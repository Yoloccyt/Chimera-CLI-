[target.x86_64-pc-windows-gnu]
# WHY: 使用 "gcc" 而非硬编码路径，让 cargo 从 PATH 中解析 MinGW 链接器。
# 本地开发通过 CLAUDE.md §1 的环境变量将 D:/msys64/mingw64/bin 加入 PATH；
# CI 通过 msys2/setup-msys2@v2 安装 MinGW 后自动注入 PATH。
# 硬编码 D:/msys64/... 在 CI 中失效（runner 只有 C 盘），导致 Windows release 构建失败。
linker = "gcc"

# WHY 固化 incremental = false:rustc 1.96.0 + Windows GNU + incremental compilation
# 存在 ICE(rmeta/encoder.rs:2448 panic "no entry found for key"),导致 cargo check
# 报告伪 warning(mlc-engine/auto-dpo/mcp-mesh/acb-governor)。源码实际干净
# (clippy -D warnings 通过)。禁用 incremental 根治该 ICE,同时与 CLAUDE.md §9
# clippy OOM 缓解(CARGO_INCREMENTAL=0)对齐,避免开发者重复设置环境变量。
# 代价:日常增量编译速度变慢,但项目规模(35 crates)下全量 check 仅 ~7s,可接受。
[build]
incremental = false

# WHY:启用 rusqlite bundled SQLite 的 FTS5 全文索引扩展编译。
# libsqlite3-sys 的 build.rs 读取此环境变量,传递 -DSQLITE_ENABLE_FTS5 给 C 编译器。
# 不设置时 FTS5 不可用,repo-wiki 自动降级到 LIKE 全表扫描(降级策略见 fts.rs)。
[env]
SQLITE_ENABLE_FTS5 = "1"

# ============================================================
# 编译阶段优化(Task 3):test profile 加速
#
# WHY:测试编译占 CI 总时长大头(303 test target)。默认 test profile 继承 dev
# (opt-level=0 已是默认),但 debug=2 全量调试信息 + codegen-units=256 默认值
# 仍拖慢编译。显式收紧:
# - opt-level = 0:跳过优化(最快编译),与默认一致,显式声明防 toolchain 默认变更
# - codegen-units = 16:最大化并行度(default dev=256 已是并行,16 平衡并行/优化)
# - debug = 0:跳过调试符号生成(test 二进制无需 gdb/lldb 调试,符号生成耗 IO/CPU)
# 注:此为 config 级 profile 覆盖(见 Cargo reference config.html [profile.<name>]),
# 优先级高于 Cargo.toml 中的同名 profile,仅影响 test profile,不触碰 release/bench。
# ============================================================
[profile.test]
opt-level = 0
codegen-units = 16
debug = 0

# WHY:build-override 应用到 build script 与 proc-macro 编译。
# 默认 build script 继承 host profile(dev),debug=2 全量符号拖慢编译。
# 显式 debug=0 + opt-level=0 加速 build script/proc-macro 编译,
# 对 303 test target 的依赖树(build script 数百个)累计收益显著。
[profile.test.build-override]
opt-level = 0
debug = 0
