# git-cliff configuration for Chimera CLI (NEXUS-OMEGA)
# 用途: 从 conventional commits 自动生成 CHANGELOG 初稿（辅助手写，不替代）
# 用法: git cliff --config cliff.toml --latest --output CHANGELOG_NEW.md
# 或:   .\scripts\generate_changelog.ps1
#
# WHY 半自动: 项目 CHANGELOG.md 手写质量高（含 ADR 引用/测试计数/架构上下文），
# git-cliff 生成的原始素材可作为新版本发布的起点，减少遗漏。

[changelog]
# Header: 文件开头的说明文字
header = """
# Changelog

All notable changes to Chimera CLI (NEXUS-OMEGA) are documented in this file.
"""
# Body: 每个版本的条目格式
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# Footer: 文件末尾（链接对比等）
footer = """
<!-- generated by git-cliff, edit before merging into CHANGELOG.md -->
"""
# 去除重复和合并提交
trim = true

[git]
# 约定式提交规范解析
conventional_commits = true
filter_unconventional = true
# 拆分合并提交
split_commits = false
# 提交预处理（去除前缀如 "fix: " 以便 body 模板重新格式化）
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# 提交分组规则
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Chores" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
]
# 过滤掉合并提交
filter_commits = false
# Tag 模式: 匹配 v*.*.*-omega
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+-omega"
# 跳过已发布的 tag（只生成最新版本）
skip_tags = ""
# 忽略这些 tag
ignore_tags = ""
# 排序
topo_order = false
sort_commits = "newest"
