# 本文件**不是**配置样例，也不是加载目标 —— 它是一份指路牌。
#
# 为什么原来那份 TOML 样例必须被撤掉（逐条实测，2026-09-23）：
#   * 加载器只注册了 Yaml provider（`crates/chimera-cli/src/config.rs` 的 `load()`：
#     `Serialized::defaults` → `Yaml::file(path)` → `Env::prefixed("CHIMERA_")`），
#     所以旧样例教人"复制为 `~/.aether/omega.toml`"永远不会被读取（真实默认路径是
#     `~/.chimera/omega.yaml`，由 `default_config_path()` 决定）。
#   * 旧样例写的 `CHIMERA_CONFIG` 环境变量在 `crates/`+`scripts/` 全库 0 命中（虚构）。
#   * 旧样例写"三源合并：Default < File < Env < CLI"并把 CLI 列为最高优先级，
#     而 `config.rs` 的注释自陈 CLI 参数**不进** Figment（只有 `--config` 改文件路径）。
#   * 旧样例的环境变量前缀写 `AETHER_`，加载器用的是 `CHIMERA_`。
#   * 它还与 `config.rs` 里的内嵌模板构成**第二份手写配置副本** —— 本仓已有三例
#     双源漂移前科，故此处只留指针，不留副本。
#
# 该看哪里（唯一权威源）：
#   * 可直接改的完整样例：`examples/config.sample.yaml`
#     —— 由 `omega_yaml_template()` 派生，`python scripts/check_config_sample_parity.py`
#        强制两处逐字等值（漂移即红）。
#   * 落盘一份真配置：`chimera config init`（等价 `cargo run -p chimera-cli -- config init`）。
#   * 字段定义：`crates/chimera-cli/src/config.rs` 的 `ChimeraConfig`（含 14 个顶层段）。
