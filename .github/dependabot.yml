# Dependabot 配置（问题清单 P1-1：action SHA pinning 治理）
# WHY: 报告附录 E-E1 识别 57 处 unpinned-uses(未固定 SHA 的 action 可被追溯篡改);
#      dependabot 的 github-actions 生态 enable-version-updates 会自动将 tag
#      引用更新为完整 SHA,并在依赖升级时同步更新 SHA——这是 unpinned-uses 的
#      标准治理路径。zizmor.yml 的 remap 豁免在全部 PR 合并后移除。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 将 uses 的 tag 引用自动 pin 为 SHA(需要时),并随升级保持 SHA 同步
    # WHY versioning-strategy 而非 enable-version-updates(2026-08-19 修复:
    # enable-version-updates 不在 dependabot schema 中,导致 GitHub 解析失败):
    # increase = 保持最低兼容版本并随依赖升级;auto 对 actions 生态同样生效
    versioning-strategy: auto
    open-pull-requests-limit: 10
