# cargo-audit 安全审计 — 每日定时 + PR 触发
# WHY: 自动检测 Cargo.lock 中的已知漏洞(RustSec Advisory Database),
# 防止引入含 CVE 的依赖。对应审计 F-012 修复。
name: Security Audit

on:
  schedule:
    # 每日 UTC 02:00 执行(北京时间 10:00)
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # WHY: 防止 cargo-audit 卡死占用 CI 资源(网络拉取 Advisory DB 偶发挂起)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
        # WHY: 加速 cargo-audit 安装与 Cargo.lock 解析,典型缓存命中可省 30-60s

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        # WHY --ignore 5 个经评估确认不影响项目的 RUSTSEC 警告:
        #   RUSTSEC-2026-0190 (anyhow unsound): 影响 Error::downcast_mut(),
        #     项目用 ? 和 match 处理错误,未调用此方法
        #   RUSTSEC-2026-0002 (lru unsound): 影响 IterMut,
        #     间接依赖(ratatui→lru),ratatui 不使用 IterMut
        #   RUSTSEC-2024-0436 (paste unmaintained): 间接依赖(ratatui→paste),
        #     仅用于宏拼接,无安全影响
        #   RUSTSEC-2025-0141 (bincode unmaintained): 间接依赖(repo-wiki→hnsw_rs→bincode),
        #     仅用于 HNSW 序列化,无安全漏洞,bincode 项目已 archived 无修复版本
        #     跟踪:待 hnsw_rs 升级替换 bincode 后移除此 --ignore
        #   RUSTSEC-2025-0119 (number_prefix unmaintained):
        #     间接依赖(indicatif→number_prefix),仅进度条数字格式化,无安全漏洞
        # 已移除的 --ignore(2026-08-07 升级修复后清理):
        #   RUSTSEC-2026-0217 (tract-nnef 整数溢出→OOB read): tract-onnx 0.21→0.22.3
        #     升级完成(tract-nnef 0.22.3 >= 0.22.2 修复线),2026-08-07 验证不再触发
        #   RUSTSEC-2026-0222/0223 (wasmtime VM 状态): wasmtime 47.0.2→47.0.3
        #     升级完成,2026-08-07 验证不再触发
        # wasmtime 47.0.2 升级(2026-07-25 P3-W12.3.3):消除 16 个 wasmtime RUSTSEC 漏洞
        #   (含 2 个 critical 沙箱逃逸 RUSTSEC-2026-0095/0096),原 22.0 的漏洞全部不再触发
        # 跟踪计划:待 anyhow 发布修复版本后移除对应 --ignore;
        #   待 ratatui 升级 lru/paste 后移除对应 --ignore;
        #   待 hnsw_rs 替换 bincode 后移除对应 --ignore
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0002 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2025-0119

  # ============================================================
  # 依赖过期观测 job(报告 §3.6 行动项 6)——非阻塞
  # WHY: cargo-outdated 是信息型工具(只报告不更新),依赖过期是常态,
  #      设为 continue-on-error 避免阻塞 PR;配合 cargo upgrade(cargo-edit)手动执行。
  #      真实 API 兼容性由 cargo-semver-checks 定位(仅库发布场景)。
  # ============================================================
  outdated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Run outdated check
        run: cargo outdated --workspace --exit-code 1
