name: Release

# ============================================================
# Week 8 Task 4 — 跨平台发布 CI/CD
#
# 触发:推送 v*.*.*-omega 标签(如 v1.0.0-omega)
# 产物:5 平台 binary + GitHub Release
# Matrix:Windows x86_64 · Linux x86_64/aarch64 · macOS x86_64/aarch64
# 附加 Job 1.5: x86-64-v3/native 双构建交叉验证(ADR-102/106 DetReduce,仅 Linux)
# ============================================================

on:
  push:
    tags:
      # WHY: 仅保留通配模式 v*.*.*-omega,已覆盖 v1.0.0-omega;
      # 显式列举具体版本会造成后续发版需手动追加,违反 DRY
      - 'v*.*.*-omega'
  workflow_dispatch:  # 允许手动触发,便于调试

permissions:
  contents: read  # 顶层最小权限；GitHub Release 写权下放至 release job（最小化暴露面）

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # WHY: panic=abort 下 release binary 无 unwind 表,线上 panic 默认无栈可追;
  #      全局开启 RUST_BACKTRACE=1 让 build/test/docker/release 所有 job 在
  #      panic 时输出 backtrace,便于 CI 日志定位根因(对应 §10.5 P1 修复)
  RUST_BACKTRACE: 1
  # WHY: 仓库名 Yoloccyt/Chimera-CLI- 以连字符结尾,docker/metadata-action 转小写后
  #      得到 ghcr.io/yoloccyt/chimera-cli-,镜像 reference 不能以 - 结尾,导致 buildx
  #      报 invalid reference format。固定使用 repository_owner + chimera-cli 作为镜像名,
  #      避开仓库名尾部的非法字符,同时保证品牌一致。
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/chimera-cli

jobs:
  # ============================================================
  # Job 1: 5 平台 Matrix 构建
  # ============================================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30  # WHY: 5 平台 matrix × release LTO 编译典型 8-15min,30min 兜底防卡死
    strategy:
      fail-fast: false  # 单平台失败不阻塞其他平台
      matrix:
        include:
          # Windows x86_64 — GNU 工具链(项目默认工具链)
          - target: x86_64-pc-windows-gnu
            runner: windows-latest
            cross: false
            artifact_name: chimera-windows-x86_64.exe
            binary_name: chimera.exe
          # Linux x86_64 — 主力服务器平台
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            artifact_name: chimera-linux-x86_64
            binary_name: chimera
          # Linux aarch64 — ARM 服务器(交叉编译,需 cross)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            artifact_name: chimera-linux-aarch64
            binary_name: chimera
          # macOS x86_64 — Intel Mac
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            artifact_name: chimera-macos-x86_64
            binary_name: chimera
          # macOS aarch64 — Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            artifact_name: chimera-macos-aarch64
            binary_name: chimera

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
        # C5 修复(2026-09-04): 移除 lookup-only: true —— actions/cache 的该参数仅
        # 检查缓存存在性而不下载恢复,使本步骤成为 no-op,5 平台 matrix 每次发版
        # 都全量冷编译(实测每 job 多 5-15min)。默认行为(restore + post save)即符合意图。

      - name: Install MinGW (Windows GNU target only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-libs
        # WHY: windows-latest runner 默认不预装 MinGW，而项目使用 GNU target
        # 作为默认 Windows 目标（.cargo/config.toml 的 linker 指向 MinGW gcc）。
        # 通过 msys2/setup-msys2@v2 安装 MinGW-w64 工具链并注入 PATH，为 cargo 提供链接器。

      - name: Install cross (for aarch64-linux)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
        # WHY: 使用预编译 binary 而非 `cargo install --git`，避免 CI 环境中
        # 从 GitHub 克隆源码并编译导致的超时或网络失败。taiki-e/install-action
        # 是官方推荐的 Rust 工具安装 Action，速度快且稳定。

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p chimera-cli
          else
            cargo build --release --target ${{ matrix.target }} -p chimera-cli
          fi

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ -f "$BIN_PATH" ]; then
            strip "$BIN_PATH" || echo "strip skipped (tool unavailable)"
          fi

      - name: Rename to artifact name
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          cp "$BIN_PATH" "${{ matrix.artifact_name }}"

      # E5(报告附录 E): <50MB 二进制体积硬约束断言——与 CLAUDE.md 发布清单一致,
      # 在 Release 上传前机械拦截体积回退(归因工具:cargo-bloat 本地使用)。
      - name: Assert binary size < 50MB
        shell: bash
        run: |
          SIZE=$(wc -c < "${{ matrix.artifact_name }}")
          echo "Binary size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::Binary exceeds 50MB limit"
            exit 1
          fi

      - name: Verify binary runs
        shell: bash
        run: |
          ./${{ matrix.artifact_name }} --version || echo "version check skipped"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 30

  # ============================================================
  # Job 1.5: 双构建交叉验证(ADR-102/106 DetReduce,W5 地基波次)
  #
  # WHY 独立 job 而非并入 build matrix:双构建由 RUSTFLAGS(-C target-cpu=...)
  # 驱动,而 RUSTFLAGS 是全局环境变量,无法只作用于单个 matrix 条目,混入会
  # 污染其他平台构建;独立 job 也让本地 Windows GNU 无法验证的交叉对比由
  # Linux CI 承担。产物只做交叉比对不上传 Release(checksums.txt 断言 5 平台
  # 5 条目,上传会破坏该门禁)。
  #
  # 交叉验证原理:nexus-core 的 `crossbuild_marker_output` 测试在两种
  # RUSTFLAGS 下分别输出 Deterministic/Audit 两模式的 reduce 位模式
  # (REDUCE_CROSSBUILD_ 前缀行)。跨构建逐位一致的契约属于 Audit 模式
  # (ADR-102:Deterministic 仅承诺 1e-6 容差——其块内 iter().sum() 被 LLVM
  # 向量化,归约顺序随 target-cpu/宽度变化,v3/native 位模式必然不同;
  # 1e-6 容差由误差界 ~2e-10·Σ|x| 数学保证,无需 diff)。
  # 故 diff 只比对 REDUCE_CROSSBUILD_audit 行,det 行保留在日志供人工参考。
  # ============================================================
  dual-build:
    name: Dual-build cross-verify (x86-64-v3 vs native)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 两轮全量 release 编译(不同 RUSTFLAGS 指纹不共享)+ 交叉测试典型 12-25min
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: dual-build-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: dual-build-cargo-

      # ---- 构建 A:x86-64-v3 ----
      - name: Build binary (x86-64-v3)
        shell: bash
        env:
          # WHY 引号:YAML 中 'RUSTFLAGS: -C ...' 的 '-' 前缀会被解析为序列
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: cargo build --release -p chimera-cli

      - name: Rename v3 binary
        shell: bash
        run: cp target/release/chimera chimera-linux-x86_64-v3

      - name: Capture reduce output (x86-64-v3)
        shell: bash
        env:
          RUSTFLAGS: '-C target-cpu=x86-64-v3'
        run: |
          cargo test --release -p nexus-core crossbuild_marker_output -- --nocapture \
            | grep 'REDUCE_CROSSBUILD_audit' > /tmp/reduce-v3.txt
          cat /tmp/reduce-v3.txt

      # ---- 构建 B:native ----
      - name: Build binary (native)
        shell: bash
        env:
          RUSTFLAGS: '-C target-cpu=native'
        run: cargo build --release -p chimera-cli

      - name: Rename native binary
        shell: bash
        run: cp target/release/chimera chimera-linux-x86_64-native

      - name: Capture reduce output (native)
        shell: bash
        env:
          RUSTFLAGS: '-C target-cpu=native'
        run: |
          cargo test --release -p nexus-core crossbuild_marker_output -- --nocapture \
            | grep 'REDUCE_CROSSBUILD_audit' > /tmp/reduce-native.txt
          cat /tmp/reduce-native.txt

      # ---- 交叉对比:Audit 位模式逐位一致断言(ADR-102) ----
      - name: Cross-verify Audit bitwise identity (v3 vs native)
        shell: bash
        run: |
          set -euo pipefail
          diff /tmp/reduce-v3.txt /tmp/reduce-native.txt \
            || { echo "::error::Audit(repro_reduce) 跨构建位模式不一致(v3 vs native)"; exit 1; }
          echo "OK: Audit(repro_reduce) 在 x86-64-v3 与 native 构建下逐位一致(ADR-102)"
          ls -la chimera-linux-x86_64-v3 chimera-linux-x86_64-native

  # ============================================================
  # Job 2: 全 workspace 测试(不阻塞 matrix 构建)
  # ============================================================
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # WHY: workspace 全量测试典型 5-12min,30min 兜底防卡死
    # WHY: 仅 tag 推送时触发测试,避免 workflow_dispatch 调试时重复跑全量测试
    if: startsWith(github.ref, 'refs/tags/v')
    # WHY: sccache 加速发布前全量测试编译(与 ci.yml check job 共享缓存)
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-test-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-test-cargo-
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11
      # WHY: 保持全量验证语义 —— 含 doc-tests 与 backpressure 60s spec 验收
      # (不设 CHIMERA_BACKPRESSURE_SECS,缺省 60s),发布前完整性不降级。
      - name: Run workspace tests
        run: cargo test --workspace

  # ============================================================
  # Job 2.5: Docker 镜像构建 + 推送 GHCR
  # ============================================================
  docker:
    name: Docker Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30  # WHY: docker build+push+验证典型 4-8min,30min 兜底防 registry 网络抖动卡死
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write  # GHCR 推送权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalize IMAGE_NAME to lowercase
        # WHY: docker/metadata-action@v5 自动将镜像名转小写推送至 GHCR,
        # 但 ${{ env.IMAGE_NAME }} 保留 github.repository_owner 的原大小写(如 Yoloccyt),
        # 导致后续 docker pull / docker run 找不到镜像。此处统一转小写覆写 IMAGE_NAME。
        # WHY 双引号: 单引号 '${IMAGE_NAME}' 在 bash 中不展开变量(2026-08-19 修复,
        # v2.27.0-omega Docker job 因 IMAGE_NAME 变为字面量 "${image_name}" 导致
        # buildx invalid tag,5 平台 Build 成功但 Release 未创建)。
        run: echo "IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-alpha') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # WHY 注入 VERSION build-arg:让 Dockerfile L49 的 ARG VERSION 接收实际 git tag,
          # 使 LABEL org.opencontainers.image.version 与 Release 版本一致,避免镜像元数据漂移
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size < 100MB
        run: |
          # WHY 使用 GHCR Registry HTTP API 而非 `docker manifest inspect`:
          # `docker manifest inspect` 需要 DOCKER_CLI_EXPERIMENTAL=enabled 且在某些
          # Docker CLI 版本中不可用,导致 CI 环境中反复失败。直接用 curl 查询 GHCR
          # v2 API 更可靠,且不依赖 Docker daemon 或 experimental 特性。
          #
          # 校验 compressed size(layers[].size 求和)而非 `docker image inspect` 的
          # uncompressed size,因为用户感知与 registry 计费均以 compressed size 为准。
          set -euo pipefail

          # WHY 转小写:GHCR API 路径要求全小写,而 github.repository_owner 可能保留原大小写
          REPO=$(echo "${{ github.repository_owner }}/chimera-cli" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME}"
          REGISTRY="https://ghcr.io"

          # 获取匿名 pull token(GHCR 公开镜像支持匿名拉取)
          TOKEN=$(curl -sf "${REGISTRY}/token?service=ghcr.io&scope=repository:${REPO}:pull" | jq -r '.token') || {
            echo "ERROR: failed to obtain GHCR token from ${REGISTRY}/token"
            exit 1
          }

          ACCEPT_IDX="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json"
          ACCEPT_MAN="application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"

          # 拉取 manifest(可能为 OCI index 或单平台 manifest)
          MANIFEST=$(curl -sfL \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: ${ACCEPT_IDX},${ACCEPT_MAN}" \
            "${REGISTRY}/v2/${REPO}/manifests/${TAG}") || {
            echo "ERROR: failed to fetch manifest from ${REGISTRY}/v2/${REPO}/manifests/${TAG}"
            exit 1
          }

          # 若为多平台 index,解析 linux/amd64 子 manifest
          if echo "$MANIFEST" | jq -e '.manifests' >/dev/null 2>&1; then
            DIGEST=$(echo "$MANIFEST" | jq -r \
              '.manifests[] | select(.platform.os=="linux" and .platform.architecture=="amd64") | .digest')
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              echo "ERROR: could not find linux/amd64 manifest in index"
              exit 1
            fi
            echo "Multi-platform index; resolving linux/amd64 digest: $DIGEST"
            MANIFEST=$(curl -sfL \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: ${ACCEPT_MAN}" \
              "${REGISTRY}/v2/${REPO}/manifests/${DIGEST}") || {
              echo "ERROR: failed to fetch platform manifest ${REGISTRY}/v2/${REPO}/manifests/${DIGEST}"
              exit 1
            }
          fi

          # 求和所有 layer 的 compressed size
          IMAGE_SIZE=$(echo "$MANIFEST" | jq '[.layers[].size] | add') || {
            echo "ERROR: could not compute compressed size from manifest"
            echo "Manifest (truncated): $(echo "$MANIFEST" | head -c 500)"
            exit 1
          }
          if [ -z "$IMAGE_SIZE" ] || [ "$IMAGE_SIZE" = "null" ]; then
            echo "ERROR: computed size is empty or null; manifest may have no layers"
            exit 1
          fi

          echo "Image compressed size: $IMAGE_SIZE bytes ($(( IMAGE_SIZE / 1048576 )) MB)"
          if [ "$IMAGE_SIZE" -gt 104857600 ]; then
            echo "ERROR: Image compressed size exceeds 100MB limit"
            exit 1
          fi
          echo "OK: Image compressed size within 100MB limit"

      - name: Verify image functionality (--version)
        run: |
          # WHY 显式 docker pull:虽然 build-push-action 已推送镜像,但本地缓存不等于
          # 用户可拉取。此步骤模拟真实用户安装路径,验证 GHCR 上的镜像可被公开拉取。
          set -euo pipefail
          IMAGE="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          # 运行 --version 验证 binary 功能正常(distroless 镜像无 shell,直接执行 binary)
          # WHY 捕获 stderr(2>&1):若 binary 因缺少共享库等原因启动失败,docker run 的
          # 错误信息会输出到 stderr。合并到 stdout 后即使 docker run 失败也能在日志中
          # 看到根因,而非仅看到 "exit code 1"。
          echo "Running: docker run --rm $IMAGE --version"
          VERSION_OUTPUT=$(docker run --rm "$IMAGE" --version 2>&1) || {
            echo "ERROR: docker run --version failed"
            echo "Output: $VERSION_OUTPUT"
            exit 1
          }
          echo "Version output: $VERSION_OUTPUT"

          # 验证输出格式:必须匹配 chimera X.Y.Z[-omega](确保 binary 未损坏)
          if ! echo "$VERSION_OUTPUT" | grep -qE '^(aether|chimera|chimela) [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: --version output does not match expected format"
            echo "Expected: chimera X.Y.Z[-omega]"
            echo "Actual: $VERSION_OUTPUT"
            exit 1
          fi
          echo "OK: Image functionality verified (--version output valid)"

  # ============================================================
  # Job 3: 汇总所有平台产物,创建 GitHub Release
  # ============================================================
  release:
    name: Publish GitHub Release
    permissions:
      contents: write  # 仅此 job 需创建 GitHub Release(softprops/action-gh-release)
    needs: [build, test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30  # WHY: 产物下载+Release 创建典型 1-3min,30min 兜底防 GitHub API 抖动
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Normalize IMAGE_NAME to lowercase
        # WHY: 与 docker job 一致,确保 Release body 中的 docker pull/run 命令使用小写镜像名
        run: echo "IMAGE_NAME=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: ls -laR artifacts

      - name: Generate checksums.txt
        # WHY: install.sh line 216-260 和 install.ps1 line 199-242 会从 Release 下载
        # checksums.txt 做 SHA256 校验,缺失则校验空转(warn 跳过)。此 step 生成
        # 与两端解析逻辑对齐的格式(<64-hex>  <filename> 双空格),并校验 5 平台
        # 产物全部纳入(防止 matrix 部分失败导致 checksums 不完整)。
        run: |
          cd artifacts
          find . -type f | sort | while IFS= read -r f; do
            bn=$(basename "$f")
            hash=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$bn"
          done > ../checksums.txt
          EXPECTED_COUNT=5
          ACTUAL_COUNT=$(wc -l < ../checksums.txt | tr -d ' ')
          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::Expected $EXPECTED_COUNT artifacts in checksums.txt, got $ACTUAL_COUNT"
            exit 1
          fi
          echo "checksums.txt generated ($ACTUAL_COUNT entries):"
          cat ../checksums.txt

      - name: Sign artifacts with GPG
        # WHY: 用户下载后可验证二进制完整性: gpg --verify chimera-*.asc chimera-*
        # 使用 GitHub Actions 内置的 GPG_KEY_SIGNING secret (ASCII-armored私钥)
        # 密钥需提前生成并通过: gpg --full-generate-key; gpg --armor --export-secret-key
        # 然后添加到仓库 Settings → Secrets and variables → Actions → GPG_KEY_SIGNING
        # 对应的公钥需上传到 GitHub Profile → GPG Keys 以便验证者信任
        if: env.GPG_KEY_SIGNING != ''
        env:
          GPG_KEY_SIGNING: ${{ secrets.GPG_KEY_SIGNING }}
        run: |
          # 导入签名密钥(无密码的 CI 密钥)
          echo "$GPG_KEY_SIGNING" | gpg --batch --import
          # 获取密钥 ID(取第一个私钥的 fingerprint)
          KEY_ID=$(gpg --list-secret-keys --with-colons --batch 2>/dev/null | grep '^sec' | head -1 | cut -d: -f5)
          echo "Signing with key: $KEY_ID"
          # 签名所有 artifacts 和 checksums.txt
          cd artifacts
          for f in */*; do
            [ -f "$f" ] || continue
            gpg --batch --yes --detach-sign --armor --default-key "$KEY_ID" "$f"
            mv "${f}.asc" "../$(basename "$f").asc"
            echo "Signed: $f → $(basename "$f").asc"
          done
          cd ..
          gpg --batch --yes --detach-sign --armor --default-key "$KEY_ID" checksums.txt
          echo "Signed: checksums.txt → checksums.txt.asc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Chimera CLI ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*/*
            checksums.txt
            *.asc
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## Chimera CLI (NEXUS-OMEGA) ${{ github.ref_name }}

            ### 平台支持
            | 平台 | 文件 | 架构 |
            |------|------|------|
            | Windows | `chimera-windows-x86_64.exe` | x86_64 |
            | Linux   | `chimera-linux-x86_64`       | x86_64 |
            | Linux   | `chimera-linux-aarch64`      | aarch64 (ARM) |
            | macOS   | `chimera-macos-x86_64`       | Intel |
            | macOS   | `chimera-macos-aarch64`      | Apple Silicon |

            ### 验证
            ```bash
            chimera --version
            ```

            ### Docker
            ```bash
            # 拉取 GHCR 镜像(distroless,< 100MB,非 root 运行)
            docker pull ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            # 验证镜像可用性(应输出版本号)
            docker run --rm ${{ env.IMAGE_NAME }}:${{ github.ref_name }} --version
            ```
