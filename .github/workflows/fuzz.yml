name: Fuzz

# ============================================================
# Week 8 限制深度攻坚 — cargo-fuzz CI 集成
#
# 触发:推送 v*.*.*-omega 标签、每周一定时(UTC 03:00,C5 新增) 或 手动触发
# 运行:ubuntu-latest runner + nightly 工具链 + cargo-fuzz
# 时长:8 target × 300s + 编译 ≈ 35-45min
#
# 本地 Windows GNU 无法运行(libFuzzer C++ 与 g++ 不兼容),
# 委托 Linux CI 执行,解除限制 1。
#
# Fuzz target 清单(8 个,与 fuzz/Cargo.toml [[bin]] 声明一致):
#   1. quest_parse           — Quest 解析
#   2. seccore_sandbox       — SecCore 沙箱
#   3. event_serialize       — 事件序列化
#   4. cacr_budget_parse     — CACR 预算配置解析
#   5. checkpoint_deserialize — Checkpoint 反序列化
#   6. config_section_parse  — 配置段解析
#   7. harness_spec_parse    — HarnessSpec TOML 解析与不可进化面守护 (P4-W15.3)
# ============================================================

on:
  push:
    tags:
      - 'v*.*.*-omega'
  # C5 新增(2026-09-04): 每周一定时模糊测试 —— 语料持续积累 + 每周新鲜输入,
  # 与 slo.yml 每日 04:00 UTC / stress nightly 错峰;
  # 注意: schedule 仅对默认分支上的本文件生效(合入后生效)。
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45  # WHY: 7 target × 300s + 编译 ≈ 35-45min,45min 兜底防止 fuzz hang 占用 nightly runner
    strategy:
      fail-fast: false
      matrix:
        target:
          - quest_parse
          - seccore_sandbox
          - event_serialize
          - cacr_budget_parse
          - checkpoint_deserialize
          - config_section_parse
          - harness_spec_parse
          # MCA M0 PR-6: SSE 归一器模糊防线(ADR-065,任意切割不变量)
          - sse_parse

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry & target
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fuzz-${{ matrix.target }}-cargo-
        # C5 修复(2026-09-04): 移除 lookup-only: true —— actions/cache 的该参数仅
        # 检查缓存存在性而不下载恢复,使本步骤成为 no-op;默认行为(restore +
        # post save)即符合意图。

      # C5 新增(2026-09-04): libFuzzer 语料滚动缓存 —— key 随 run_number 递增,
      # 每次运行 restore 最近一次语料(fuzz/corpus/<target>),fuzz 结束后 post
      # 步骤保存扩充后的语料;300s 冷启动由"从零积累"变为"在历史语料上继续深挖",
      # 旧条目由 GitHub Actions 缓存 LRU(仓库 10GB 上限)自然淘汰。
      - name: Restore fuzz corpus
        uses: actions/cache@v4 # zizmor: ignore[cache-poisoning]
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_number }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        # WHY: --locked 锁定 Cargo.lock + --version 固定工具自身版本,双重复现:
        #      上游 minor 破坏性变更与版本漂移导致的间歇失败均被封堵(reproducibility 优先)。
        #      0.13.2 = 2026-09-04 crates.io max_stable_version(C5)。
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Run fuzz target (${{ matrix.target }})
        working-directory: ./fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300 -print_final_stats=1 2>&1 | tee fuzz_${{ matrix.target }}.log

      - name: Upload fuzz log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-log-${{ matrix.target }}
          path: fuzz/fuzz_${{ matrix.target }}.log
          retention-days: 30

      - name: Upload crash inputs (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/crash-*
          retention-days: 90
          if-no-files-found: ignore
