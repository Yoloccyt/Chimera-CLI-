name: Benchmark Check

# ============================================================
# Task 2.4 — criterion benchmark CI 阈值强制
#
# 触发:
#   - PR 到 main/master(路径过滤:仅 benches/Cargo.toml 变更时)
#   - push tag v*.*.*-omega(发布前最终验证)
#   - workflow_dispatch(手动触发,便于调试)
#
# 运行 5 个 criterion benchmark,解析 estimates.json,断言中位延迟:
#   - exit_code_matrix    < 10µs  (Task 0.2 ExitCode 矩阵分发)
#   - diff_engine_bench   < 100µs (Task 0.4 v3-engine M2 增量 diff)
#   - wal_recovery        < 100ms (Task 0.7 mcp-mesh 2PC WAL 恢复)
#   - degradation_chain   < 1µs   (Task 0.5 csn 降级链推进)
#   - render_bench        < 16ms  (60 FPS 帧预算,render_bench.rs 目标)
#
# render_bench 阈值说明:
#   spec 要求"≤ ratatui 路径",但 M2 minimal 策略下 v3 路径与 ratatui 路径
#   widget 渲染相同,仅布局引擎不同(自研 flex::split O(n) vs ratatui
#   Layout::split),帧时间等价。CI 环境做 baseline 分支对比需 critcmp +
#   双 checkout,成本高且易抖动;改用绝对阈值 < 16ms(60 FPS)更稳健,
#   与 render_bench.rs 模块注释的 P95 < 16ms 目标对齐(median < P95,
#   阈值留有余量)。
#
# 失败时上传 target/criterion/ + bench logs artifact(30 天保留)
# ============================================================

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**/benches/**'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/bench_check.yml'
      # P2-7: CLI 启动路径变更触发启动延迟检查
      - 'crates/chimera-cli/src/**'
      - 'scripts/check_cli_startup.*'
  push:
    tags:
      - 'v*.*.*-omega'
  workflow_dispatch:  # 允许手动触发,便于调试

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-check:
    name: Benchmark Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 30  # WHY: 5 benchmark 编译+运行典型 3-8min,30min 兜底防卡死
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: '.'
        # WHY: 加速 benchmark 编译,典型缓存命中可省 60-120s。
        # C5 修复(2026-09-04): 移除 lookup-only: true —— 该参数仅检查缓存存在性
        # 而不下载恢复,使本步骤成为 no-op,bench job 每次 PR 都全量冷编译。
        # 默认行为(restore + job 结束后 save)即符合本步骤意图。

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          # 运行 5 个 benchmark。criterion 默认 sample_size=100 + 5 warmup,
          # 每个 benchmark 约 10-30s,总耗时(含编译)约 3-8min。
          # WHY 用 `tee` 保存日志:失败时上传 artifact 供开发者分析。
          # WHY 不用 --save-baseline:CI 每次全新运行,无需 baseline 对比。
          # WHY 逐条包装 (|| { echo ...; exit 1; }):2026-08-08 定位连续 6 次
          # exit 2 时发现 pipefail 下无法区分失败命令;包装后失败即输出
          # 命令名 + 真实退出码,消除盲区(可观测性修复)。
          run_bench() {
            local name="$1"; shift
            if ! "$@" 2>&1 | tee "bench_${name}.log"; then
              echo "::error::bench ${name} failed (pipestatus=${PIPESTATUS[*]})"
              exit 1
            fi
          }
          run_bench exit_code_matrix cargo bench -p chimera-cli --bench exit_code_matrix
          run_bench render_bench cargo bench -p chimera-tui --bench render_bench
          run_bench diff_engine_bench cargo bench -p chimera-tui --bench diff_engine_bench
          # Concord W5:流式渲染链路基准(NewlineGate 行闸门 ttfb + 单 token 增量,
          # streaming_bench.rs 模块目标 P95 < 500µs·token / ttfb < 1ms)
          run_bench streaming_bench cargo bench -p chimera-tui --bench streaming_bench
          run_bench wal_recovery cargo bench -p mcp-mesh --bench wal_recovery
          run_bench degradation_chain cargo bench -p csn-substitutor --bench degradation_chain
          # L9 Quest 层优化基线守护(2026-07-31 新增):dag/gea/scheduler/dedup/checkpoint/shadow
          run_bench dag cargo bench -p quest-engine --bench dag_bench
          # 第三轮冗余审计 批 B/C:L0 共享纯函数(sigmoid / percentile_sorted)+ 激活已落盘的 Top-K 对照
          run_bench util_micro cargo bench -p nexus-contracts --bench util_micro
          # xts_top_k.rs 已随 WS-2 落盘,但此前未进 run_bench → 其阈值长期空转,现补齐
          run_bench xts_top_k cargo bench -p nexus-contracts --bench xts_top_k
          run_bench checkpoint cargo bench -p quest-engine --bench checkpoint_bench
          run_bench gea_cache cargo bench -p gea-activator --bench gate_compute
          run_bench scheduler cargo bench -p chimera-mas --bench mas_benchmark scheduler_dequeue
          run_bench dedup cargo bench -p chimera-mas --bench dedup_bench
          run_bench shadow_stats cargo bench -p chimera-mas --bench shadow_stats
          # ===== WS-3 E1: 审计点名的 17 个未守护 bench 补全(阈值"待首跑校准")=====
          # 与 scripts/perf_thresholds.toml 的 [[run_bench]] 保持同步;
          # 该同步已由 check_perf_redlines.py 不变式 I7 机器强制(不再靠人工)。
          run_bench config_concurrency cargo bench -p chimera-cli --bench config_concurrency_bench
          run_bench writer_ansi       cargo bench -p chimera-tui --bench writer_ansi_bench
          run_bench v3_pipeline       cargo bench -p chimera-tui --bench v3_pipeline_bench
          run_bench reduce_bench      cargo bench -p nexus-core --bench reduce_bench
          run_bench session_store     cargo bench -p session-store --bench session_store_bench
          run_bench cross_layer       cargo bench -p event-bus --bench cross_layer_bench
          run_bench hybrid_search     cargo bench -p repo-wiki --bench hybrid_search_bench
          run_bench debate            cargo bench -p parliament --bench debate
          run_bench l2_recall         cargo bench -p mlc-engine --bench l2_recall
          run_bench compress          cargo bench -p hcw-window --bench compress
          run_bench compute_masks     cargo bench -p osa-coordinator --bench compute_masks
          run_bench delegation        cargo bench -p chimera-mas --bench delegation_bench
          run_bench cache_hit         cargo bench -p scc-cache --bench cache_hit
          run_bench tiering           cargo bench -p lsct-tiering --bench tiering_benchmark
          run_bench gather            cargo bench -p gqep-executor --bench gather
          run_bench produce_verify    cargo bench -p pvl-layer --bench produce_verify
          run_bench command_validator cargo bench -p seccore --bench command_validator_bench
          # ===== C6(2026-09-04): KPI 首次入 CI 强制门 + L1 热路径基线 =====
          # immune_probe=KPI-03(宣称 708ns,本地实测 907ns 同量级实证);
          # rhi_judge=KPI-04(宣称 44µs,本地实测 7.5µs);bus_bench=publish fan-out。
          run_bench immune_probe      cargo bench -p chimera-mas --bench immune_probe
          run_bench rhi_judge         cargo bench -p auto-dpo --bench rhi_judge
          run_bench bus_bench         cargo bench -p event-bus --bench bus_bench

      - name: Assert thresholds
        # WHY 用 Python 解析 criterion 的 estimates.json:
        #   - criterion 的 stdout 格式可能随版本变化, estimates.json 是稳定契约
        #   - estimates.json 包含 median.point_estimate(纳秒), 精确可信
        #   - ubuntu-latest 预装 python3, 无需额外安装
        # 输出同时落盘 bench_threshold_legacy.log:下一步的 compare 要拿它跟
        # scripts/check_perf_redlines.py 逐键对拍。tee 不改变本步成败语义
        # (pipefail 下 python 非 0 仍使本步红)。
        shell: bash
        run: |
          python3 <<'PYEOF' | tee bench_threshold_legacy.log
          import json
          import sys
          from pathlib import Path

          def format_ns(ns):
              """将纳秒格式化为人类可读的时间字符串"""
              if ns < 1_000:
                  return f"{ns:.0f} ns"
              elif ns < 1_000_000:
                  return f"{ns/1_000:.2f} µs"
              elif ns < 1_000_000_000:
                  return f"{ns/1_000_000:.2f} ms"
              else:
                  return f"{ns/1_000_000_000:.2f} s"

          # 阈值表(单位:纳秒)
          # WHY 阈值来源:
          #   - exit_code_matrix < 10µs   (Task 0.2 spec,ExitCode 矩阵分发延迟)
          #   - diff_engine_bench < 100µs (Task 0.4 spec,v3-engine 增量 diff)
          #   - wal_recovery < 100ms      (Task 0.7 spec,mcp-mesh 2PC WAL 恢复)
          #   - degradation_chain < 1µs   (Task 0.5 spec,csn 降级链推进)
          #   - render_bench < 16ms       (60 FPS 帧预算,render_bench.rs 目标 P95 < 16ms;
          #     M2 minimal 策略下 v3 路径与 ratatui 路径 widget 渲染相同,
          #     仅布局引擎不同(自研 flex::split O(n) vs ratatui Layout::split),帧时间等价)
          THRESHOLDS_NS = {
              "exit_code_matrix":  10_000,         # < 10µs
              "diff_engine_bench": 100_000,        # < 100µs
              "wal_recovery":      100_000_000,    # < 100ms
              "degradation_chain": 1_000,          # < 1µs
              "render_bench":      16_000_000,     # < 16ms (60 FPS)
              # Concord W5 流式链路守护(Concord W4 实测基线 × CI 抖动余量):
              #   - streaming_single_token 实测 ≈13-33µs,模块 P95 目标 500µs,取 500µs
              #   - ttfb_first_line 实测 ≈125ns,<1ms 预算取 1ms(≈8 倍余量)
              #   - feed_100_lines_charwise 实测 ≈34µs,取 5ms(≈140 倍余量防抖)
              "streaming_single_token": 500_000,   # < 500µs·token
              "streaming_ttfb":         1_000_000, # < 1ms
              "streaming_feed":         5_000_000, # < 5ms
              # L9 优化基线守护(2026-07-31,阀值 = 本地基线中位数 × ~2 防 CI 抖动):
              #   - dag validate/topo 1000 节点 diamond 实测 ≈1.9ms(优化后,旧版 21ms),取 5ms
              #   - gea 满载驱逐路径(含 activate 全流程),取 500µs
              #   - scheduler_dequeue 1000 任务 swap_remove 实测 ≈18µs,取 50µs
              #   - dedup_semantic 1000 条目(500k 次 128 维余弦)实测 ≈58ms,取 120ms
              #   - checkpoint_save 100 任务实测 ≈4ms(磁盘 I/O 固定开销),取 15ms
              #   - shadow bootstrap n=25/B=10000 单侧下界,取 50ms
              "dag":               5_000_000,      # < 5ms
              "gea_cache":         500_000,        # < 500µs
              "scheduler_dequeue": 50_000,         # < 50µs
              "dedup":             120_000_000,    # < 120ms
              "checkpoint":        15_000_000,     # < 15ms
              "shadow_stats":      50_000_000,     # < 50ms
              # L9 优化第二轮(2026,早停 O(n²·d)→O(n·k·d)):resolve_conflicts n=128
              # 高重叠实测 ≈22.6µs(gate_compute bench 内新增组),取 50µs
              # 专家 Agent 优化(2026-08-11):新增 512 专家高密度压力组
              # (512_high_overlap 实测 ≈92µs = 候选构建 O(n·d) + 排序 O(n log n)
              #  + 511 次重叠检测固有成本),按 ×2 抖动余量取 200µs;
              # 128 场景仍受 50µs 守护(22.8µs 实测,余量充足)
              "resolve_conflicts": 200_000,         # < 200µs(128 组仍 < 50µs)
              # ===== C6 校准（2026-09-04）：18 键由 100ms 兜底收紧为实测值 =====
              # 本地 Windows GNU 全量实测 median + 分级余量（ns 级约 x10、us 级约
              # x3-8、ms 级约 x2-2.5，与 sigmoid 33ns→500ns 先例同原则）；数据与
              # 推导见 docs/reports/c6-kpi-threshold-calibration-report-2026-09-04.md。
              # 与 scripts/perf_thresholds.toml 的 [thresholds_ns] 逐键一致（I1）。
              # gather 本地 median 305ms 为离群值（5 severe outliers；CI 侧 <100ms
              # 通过）→ 数据不可信，保留 100ms 兜底，calibration_pending 唯一存活项。
              "config_concurrency": 3_000_000,     # < 3ms（实测 1.21ms）
              "writer_ansi":        200_000,       # < 200µs（实测 58.7µs）
              "v3_pipeline":        5_000_000,     # < 5ms（实测 1.89ms）
              "reduce_bench":       2_500_000,     # < 2.5ms（实测 858µs）
              "session_store":      2_500_000,     # < 2.5ms（实测 1.02ms）
              "cross_layer":        100_000,       # < 100µs（实测 26.3µs）
              "hybrid_search":      20_000_000,    # < 20ms（实测 8.12ms）
              "debate":             100_000,       # < 100µs（实测 29.5µs）
              "l2_recall":          5_000_000,     # < 5ms（实测 1.86ms）
              "compress":           50_000,        # < 50µs（实测 9.6µs）
              "compute_masks":      1_500_000,     # < 1.5ms（实测 583µs）
              "delegation":         40_000_000,    # < 40ms（实测 16.2ms）
              "cache_hit":          10_000,        # < 10µs（实测 581ns，ns 级放大防 CI 抖动）
              "tiering":            500_000,       # < 500µs（实测 250µs）
              "gather":             100_000_000,   # < 100ms 保留兜底（本地离群不可信，待 CI 首跑收紧）
              "produce_verify":     500_000,       # < 500µs（实测 216µs）
              "command_validator":  50_000,        # < 50µs（实测 6.8µs）
              # 预留(并行 WS-2 将创建 nexus-contracts/benches/xts_top_k.rs):
              # 文件未落盘前无真实 estimates,只产生 no-estimates 告警(不失败);落地后自动守护。
              "xts_top_k":          500_000,       # < 500µs（实测 213µs；WS-2 已落盘，C6 完成校准）
              # ===== C6 新增（KPI-03/04 首次入 CI 强制门 + L1 热路径基线）=====
              # immune_probe 实测 907ns（宣称 708ns 同量级获实证）;ns 级阈值按
              # sigmoid 先例放大防 CI 抖动; rhi_judge 实测 7.5µs（宣称 44µs 实测更快）;
              # bus_bench 实测 55µs（publish fan-out/批量对比）。
              "immune_probe":       10_000,        # < 10µs（KPI-03）
              "rhi_judge":          50_000,        # < 50µs（KPI-04）
              "bus_bench":          200_000,       # < 200µs（L1 热路径）
              # 第三轮冗余审计 批 B/C:L0 共享纯函数。阈值为本地静默态实跑中位数加余量
              # (2026-08-30,Windows GNU release;ns/µs 级门槛在共享 runner 上噪声敏感,
              #  故按实测放大数倍取保守值,首跑后再收紧):
              #   sigmoid scalar     实测  33.2 ns → 门槛   500 ns (≈15×)
              #   sigmoid map 1024   实测  33.7 µs → 门槛 200_000 ns (≈6×)
              #   percentile_sorted  实测   6.5 ns → 门槛 1_000 ns (≈150×)
              # 关键实测结论:percentile_sorted 在 n=100 与 n=10000 下均为 ~6.5 ns,
              # 实证其 O(1) 契约(取分位成本与样本量无关,排序成本已留在调用方)。
              "sigmoid_scalar":      500,
              "sigmoid_map":         200_000,
              "percentile_sorted":   1_000,
          }

          # 路径关键词映射:criterion 目录名 → benchmark crate
          # WHY criterion 目录基于 benchmark function/group name,不是 crate name。
          #   通过关键词匹配,避免硬编码 function name(可能随源码演进)。
          #   关键词选取足够具体,避免跨 benchmark 歧义:
          #     - "exit_code" 仅 exit_code_matrix 使用
          #     - "diff" 仅 diff_engine_bench 使用
          #     - "wal" 仅 wal_recovery 使用
          #     - "degradation" 仅 degradation_chain 使用
          #     - "render" 仅 render_bench 使用(render_all_panels/render_each_panel/render_ide_three_panes)
          PATH_KEYWORDS = {
              "exit_code_matrix":  ["exit_code"],
              # WS-3 E1: diff/render/wal 均收窄为各自 bench 独有关键词,避免新增 bench
              # 的 id 串(如 v3_pipeline_diffed / render_full_80x24 / wal_replay_cycle)
              # 被宽泛前缀窃取进本门而污染阈值断言(见 Path 关键词唯一性原则)。
              "diff_engine_bench": ["diff_incremental_5pct", "diff_full_redraw"],
              "wal_recovery":      ["wal_append_single_fsync", "wal_recovery", "wal_read_empty", "wal_truncate_after_recovery"],
              "degradation_chain": ["degradation"],
              "render_bench":      ["render_all_panels", "render_each_panel", "render_ide_three_panes"],
              # Concord W5:流式链路关键词(与既有 render/diff/wal 无冲突,
              # 提词选取组名全名或独有子串,避免跨 benchmark 歧义)
              "streaming_single_token": ["streaming_single_token"],
              "streaming_ttfb":         ["ttfb_first_line"],
              "streaming_feed":         ["feed_100_lines"],
              # L9 关键词选取无歧义(各仅对应单一 bench group):
              #   - "dag" 仅 dag_bench 的 dag/validate|dag/topo_order 使用
              #   - "gea_cache" 对应 gate_compute 的 activate_eviction_saturated 驱逐组
              #   - "scheduler_dequeue" 仅 mas_benchmark 的调度器出队组
              #   - "dedup" 仅 dedup_bench 的 dedup_semantic 组
              #   - "checkpoint" 仅 checkpoint_bench 的 checkpoint_save|checkpoint_list 组
              #   - "shadow_stats" 仅 shadow_stats bench 的 wilson/bootstrap 组
              "dag":               ["dag/"],
              "gea_cache":         ["eviction_saturated"],
              # scheduler_dequeue 阈值(50µs)依据 1000 任务组基线(2026-07-31 注释);
              # bench 含 10/100/1000/10000 四规模组,10000 组为 O(n²) 退化压力组,
              # 套 1000 组阈值必然超标(2026-08-08 本地实测 810µs)——关键词限定 1000 组。
              # WHY 尾斜杠: 不带斜杠时 "scheduler_dequeue/1000" 是 "10000" 的前缀子串,
              # 会把 10000 组误匹配进来(2026-08-08 提取验证发现)。
              "scheduler_dequeue": ["scheduler_dequeue/1000/"],
              "dedup":             ["dedup_semantic"],
              "checkpoint":        ["checkpoint_save"],
              "shadow_stats":      ["shadow_stats"],
              # resolve_conflicts 仅 gate_compute bench 的 resolve_conflicts/ 组使用(无歧义)
              "resolve_conflicts": ["resolve_conflicts"],
              # ===== WS-3 E1: 17 个补全 bench 关键词 =====
              # 关键词取自各 bench 的 criterion id 串(bench_function/benchmark_group 实参),
              # 已核对唯一性与"单词干唯一前缀"原则,且避开 render/diff/wal 宽泛前缀冲突:
              # writer_ansi 用 incremental_5pct 而非 render 前缀;v3_pipeline 用 v3_pipeline
              # (diff 门已收窄为 diff_{incremental,full});session_store 用 single_write 而非 wal 前缀。
              "config_concurrency": ["14_sections"],
              "writer_ansi":        ["incremental_5pct", "render_full_80x24"],
              "v3_pipeline":        ["v3_pipeline"],
              "reduce_bench":       ["reduce"],
              "session_store":      ["single_write"],
              "cross_layer":        ["cross_layer"],
              "hybrid_search":      ["hybrid_search"],
              "debate":             ["deliberate"],
              "l2_recall":          ["l2_recall"],
              "compress":           ["100k_to_32k"],
              "compute_masks":      ["compute_all_masks"],
              "delegation":         ["delegation_fanout"],
              "cache_hit":          ["cache_hit"],
              "tiering":            ["apply_decision", "handle_quest_created"],
              "gather":             ["gather", "entangle_alone"],
              "produce_verify":     ["produce_verify", "produce_only", "verify_only"],
              "command_validator":  ["mixed"],
              # 预留 WS-2(nexus-contracts xts_top_k),id 串含 "xts_top_k n=" 前缀
              "xts_top_k":          ["xts_top_k"],
              # 关键词取 criterion 目录名(bench_function 第一参数)的子串,三者互不重叠;
              # 匹配循环命中即 break,故用带空区的完整子串避免 "sigmoid" 互相抢占。
              "sigmoid_scalar":      ["sigmoid scalar"],
              "sigmoid_map":         ["sigmoid map"],
              "percentile_sorted":   ["percentile_sorted"],
              # C6 新增（与 scripts/perf_thresholds.toml [path_keywords] 同步，
              # 已交叉核验无子串冲突，满足 I2）
              "immune_probe":        ["immune_probe"],
              "rhi_judge":           ["rhi_judge"],
              "bus_bench":           ["single_publish_latency", "concurrent_subscribe_throughput", "publish_batch_vs_serial"],
          }

          criterion_dir = Path("target/criterion")
          if not criterion_dir.exists():
              print("::error::target/criterion not found. Benchmarks may have failed.")
              sys.exit(1)

          # 收集每个 benchmark 的所有 median(纳秒)
          # criterion 目录结构: target/criterion/<group>/<function>/new/estimates.json
          # estimates.json 包含 median.point_estimate(纳秒)
          bench_results = {name: [] for name in THRESHOLDS_NS}
          unmatched_files = []

          for estimates_file in criterion_dir.glob("**/new/estimates.json"):
              rel_path = estimates_file.relative_to(criterion_dir).as_posix()
              try:
                  with open(estimates_file) as f:
                      data = json.load(f)
                      median_ns = data["median"]["point_estimate"]
              except (json.JSONDecodeError, KeyError) as e:
                  print(f"::warning::Failed to parse {estimates_file}: {e}")
                  continue

              # 基于路径关键词匹配到对应的 benchmark
              matched = False
              for bench_name, keywords in PATH_KEYWORDS.items():
                  if any(kw in rel_path for kw in keywords):
                      bench_results[bench_name].append((rel_path, median_ns))
                      matched = True
                      break
              if not matched:
                  unmatched_files.append((rel_path, median_ns))

          # 断言:每个 benchmark 的最大 median 必须小于阈值
          # WHY 取最大 median:一个 benchmark 可能有多个 group/function,
          #   所有 group 都必须满足阈值,故取最大值断言
          print("=== Benchmark Threshold Check ===\n")
          all_passed = True
          for bench_name, threshold_ns in THRESHOLDS_NS.items():
              results = bench_results[bench_name]
              if not results:
                  print(f"::warning::No estimates found for {bench_name}")
                  print(f"  {bench_name}: ⚠ no estimates found (skipped)\n")
                  continue
              max_path, max_median = max(results, key=lambda x: x[1])
              passed = max_median < threshold_ns
              status = "✓" if passed else "✗"
              print(f"  {bench_name}: {status} max median = {format_ns(max_median)} "
                    f"(threshold: < {format_ns(threshold_ns)})")
              print(f"    worst group: {max_path}")
              if not passed:
                  print(f"::error::{bench_name} exceeded threshold: "
                       f"{format_ns(max_median)} >= {format_ns(threshold_ns)}")
                  all_passed = False
              print()

          # 输出未匹配的 estimates.json(诊断用,帮助开发者识别新增 benchmark)
          if unmatched_files:
              print("--- Unmatched estimates (for debugging) ---")
              for path, median in unmatched_files:
                  print(f"  {path}: {format_ns(median)}")

          if not all_passed:
              print("::error::One or more benchmarks exceeded their thresholds.")
              sys.exit(1)

          print("✓ All benchmarks within thresholds.")
          PYEOF

      # R1-T6 双跑比对门：删 heredoc 的前置条件。
      # WHY 不直接换掉 heredoc：那等于把“两份实现”的验证责任变成一次不
      # 可复验的信仰跳跃（F-R4-01 的病根就在此）。让两边在同一轮 CI 里各跑
      # 一遍并逐键对拍 (passed + worst group), 连续一致一段观察期后才切流到
      # py 核单一实现。本步红 = heredoc 不得删除。
      # 表体来源：scripts/perf_thresholds.toml（与 heredoc 同源机械抽取, 2026-08-31）。
      - name: Double-run compare (heredoc vs py core)
        shell: bash
        run: python3 scripts/check_perf_redlines.py compare --legacy-out bench_threshold_legacy.log

      - name: Upload benchmark report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          # WHY 同时上传 target/criterion/ 和 bench logs:
          #   - target/criterion/ 含 estimates.json + HTML 报告,供深度分析
          #   - bench_*.log 含 criterion stdout,快速查看测量摘要
          path: |
            target/criterion/
            bench_*.log
            bench_threshold_legacy.log
          retention-days: 30

  # ============================================================
  # P2-7: CLI 启动延迟黑盒基线(hyperfine)——与 criterion 微基准互补
  # WHY: criterion 覆盖函数级微基准;启动延迟(进程启动+clap 解析+tokio 初始化)
  #      是用户可感知的黑盒指标,由 hyperfine 测量(脚本: scripts/check_cli_startup.sh)。
  #      阈值 100ms = Windows 基线(25.9~27.9ms)~3.6× 余量,Linux 更快余量更足。
  #      失败阻塞合入(启动路径回归属用户体验退化)。
  # ============================================================
  cli-startup:
    name: CLI startup latency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: '.'

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Build release binary
        run: cargo build --release -p chimera-cli

      - name: Run startup latency check (median < 100ms)
        run: bash scripts/check_cli_startup.sh -r 20
