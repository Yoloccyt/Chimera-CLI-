name: Benchmark Check

# ============================================================
# Task 2.4 — criterion benchmark CI 阈值强制
#
# 触发:
#   - PR 到 main/master(路径过滤:仅 benches/Cargo.toml 变更时)
#   - push tag v*.*.*-omega(发布前最终验证)
#   - workflow_dispatch(手动触发,便于调试)
#
# 运行全部 registered bench（run_bench 别名数以 `python scripts/check_perf_redlines.py
# invariants` 的 I3/I7 行现取为准，勿把此数抄死——ADR-252 D5：注释整数必漂），
# 解析 estimates.json,断言中位延迟。下列 5 条为首批历史示例（非全集）:
#   - exit_code_matrix    < 10µs  (Task 0.2 ExitCode 矩阵分发)
#   - diff_engine_bench   < 100µs (Task 0.4 v3-engine M2 增量 diff)
#   - wal_recovery        < 100ms (Task 0.7 mcp-mesh 2PC WAL 恢复)
#   - degradation_chain   < 1µs   (Task 0.5 csn 降级链推进)
#   - render_bench        < 16ms  (60 FPS 帧预算,render_bench.rs 目标)
#
# render_bench 阈值说明:
#   spec 要求"≤ ratatui 路径",但 M2 minimal 策略下 v3 路径与 ratatui 路径
#   widget 渲染相同,仅布局引擎不同(自研 flex::split O(n) vs ratatui
#   Layout::split),帧时间等价。CI 环境做 baseline 分支对比需 critcmp +
#   双 checkout,成本高且易抖动;改用绝对阈值 < 16ms(60 FPS)更稳健,
#   与 render_bench.rs 模块注释的 P95 < 16ms 目标对齐(median < P95,
#   阈值留有余量)。
#
# 失败时上传 target/criterion/ + bench logs artifact(30 天保留)
# ============================================================

on:
  # R2 C-68（登记册 M45，P1）：补 schedule 触发。
  # WHY：原先 pull_request 的 paths 过滤只含 benches/**、*/Cargo.toml、
  # 根 Cargo.toml、本 workflow 自身、chimera-cli/src/** 与 check_cli_startup.*，
  # 且无 schedule/push-branch 触发 —— ⇒ **对其余 45 个 crate 的纯 src 改动，
  # 本 workflow 根本不跑**，性能回退只在「碰了 benches 或 manifest」时才被发现；
  # 而把 'crates/**/src/**' 加进 paths 会让几乎每个 PR 都跑全量 bench（本 job
  # timeout 已给到 30min），成本与噪声都不可接受。日跑一次是覆盖「两次
  # 运行之间已合入的全部 src 变更」的最低成本形状：不阻塞单个 PR，但回退
  # 最长存活不超一天。仍保留原 paths 触发以便改 bench 时立即反馈。
  # W4a 时刻表去冲突：03:00 → 02:30 UTC。stress.yml 每日 03:00、fuzz.yml 每周一
  # 03:00 与本 job 同刻触发 —— 三者都是 nightly 编译重 job（全量 bench 编译/
  # 压测编译/fuzz 编译），同刻抢 runner 只会互相拖长排队与缓存冷启动；错开
  # 半小时即可把峰值摊平，且不侵入任何 job 的既有窗口约定（coverage 04:00 /
  # slo daily 04:00 不变）。
  schedule:
    - cron: '30 2 * * *'   # 每日 02:30 UTC（与 stress/fuzz-周一 03:00 错档；避开 slo/coverage 04:00 窗口）
  pull_request:
    branches: [main, master]
    paths:
      - 'crates/**/benches/**'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - '.github/workflows/bench_check.yml'
      # P2-7: CLI 启动路径变更触发启动延迟检查
      - 'crates/chimera-cli/src/**'
      # ADR-234 S8（已授权的 paths 扩面，只加本波实际改动的 crate）：
      # L7 执行面（调度器许可顺序、PlanRunner 派发窗口）的 src 变更此前**不触发**
      # 本 workflow —— 而 tool_plan/llm_tool_loop_bench 量的正是这一层。改坏
      # scheduler.rs 而 PR 不碰 benches/，并行语义的回退要等到日跑才露头。
      - 'crates/gqep-executor/src/**'
      - 'scripts/check_cli_startup.*'
  push:
    tags:
      - 'v*.*.*-omega'
  workflow_dispatch:  # 允许手动触发,便于调试

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  bench-check:
    name: Benchmark Threshold Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY: 兜底防卡死。**不在此登记 bench 数与典型耗时**：注释里写死的计数已两度
    # 失真（「5 benchmark」→「47 个」→ 2026-11-07 实测 55 → 2026-11-08 实测 56）。
    # 别名数的唯一权威源 = `check_perf_redlines.py invariants` 的 I3/I7 行
    # （与 [[run_bench]] 逐对对拍，I7 门机械守护）。
    # 真实耗时只能在 CI 侧量（本地无 Linux runner 且全量 cargo 已被占），故本行
    # 只声明它是 guard；若超时被 kill，本 job 是红不是静默通过 —— 但预算是否
    # 够需首次 schedule 跑后用时长读数再定档（已列入待裁）。
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      # WHY 钉解释器：本 job 的阈值断言步骤跑 scripts/*.py，与 ci.yml check job 同口径
      # 钉 3.11（tomllib 下限 + 本地已验证），理由全文见 ci.yml。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: '.'
        # WHY: 加速 benchmark 编译,典型缓存命中可省 60-120s。
        # C5 修复(2026-09-04): 移除 lookup-only: true —— 该参数仅检查缓存存在性
        # 而不下载恢复,使本步骤成为 no-op,bench job 每次 PR 都全量冷编译。
        # 默认行为(restore + job 结束后 save)即符合本步骤意图。

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          # 运行 5 个 benchmark。criterion 默认 sample_size=100 + 5 warmup,
          # 每个 benchmark 约 10-30s,总耗时(含编译)约 3-8min。
          # WHY 用 `tee` 保存日志:失败时上传 artifact 供开发者分析。
          # WHY 不用 --save-baseline:CI 每次全新运行,无需 baseline 对比。
          # WHY 逐条包装 (|| { echo ...; exit 1; }):2026-08-08 定位连续 6 次
          # exit 2 时发现 pipefail 下无法区分失败命令;包装后失败即输出
          # 命令名 + 真实退出码,消除盲区(可观测性修复)。
          run_bench() {
            local name="$1"; shift
            if ! "$@" 2>&1 | tee "bench_${name}.log"; then
              echo "::error::bench ${name} failed (pipestatus=${PIPESTATUS[*]})"
              exit 1
            fi
          }
          run_bench exit_code_matrix cargo bench -p chimera-cli --bench exit_code_matrix
          run_bench render_bench cargo bench -p chimera-tui --bench render_bench
          run_bench diff_engine_bench cargo bench -p chimera-tui --bench diff_engine_bench
          # Concord W5:流式渲染链路基准(NewlineGate 行闸门 ttfb + 单 token 增量,
          # streaming_bench.rs 模块目标 P95 < 500µs·token / ttfb < 1ms)
          run_bench streaming_bench cargo bench -p chimera-tui --bench streaming_bench
          run_bench wal_recovery cargo bench -p mcp-mesh --bench wal_recovery
          run_bench degradation_chain cargo bench -p csn-substitutor --bench degradation_chain
          # L9 Quest 层优化基线守护(2026-07-31 新增):dag/gea/scheduler/dedup/checkpoint/shadow
          run_bench dag cargo bench -p quest-engine --bench dag_bench
          # 第三轮冗余审计 批 B/C:L0 共享纯函数(sigmoid / percentile_sorted)+ 激活已落盘的 Top-K 对照
          run_bench util_micro cargo bench -p nexus-contracts --bench util_micro
          # xts_top_k.rs 已随 WS-2 落盘,但此前未进 run_bench → 其阈值长期空转,现补齐
          run_bench xts_top_k cargo bench -p nexus-contracts --bench xts_top_k
          run_bench checkpoint cargo bench -p quest-engine --bench checkpoint_bench
          run_bench gea_cache cargo bench -p gea-activator --bench gate_compute
          run_bench scheduler cargo bench -p chimera-mas --bench mas_benchmark scheduler_dequeue
          run_bench dedup cargo bench -p chimera-mas --bench dedup_bench
          run_bench shadow_stats cargo bench -p chimera-mas --bench shadow_stats
          # ===== WS-3 E1: 审计点名的 17 个未守护 bench 补全(阈值"待首跑校准")=====
          # 与 scripts/perf_thresholds.toml 的 [[run_bench]] 保持同步;
          # 该同步已由 check_perf_redlines.py 不变式 I7 机器强制(不再靠人工)。
          run_bench config_concurrency cargo bench -p chimera-cli --bench config_concurrency_bench
          run_bench writer_ansi       cargo bench -p chimera-tui --bench writer_ansi_bench
          run_bench v3_pipeline       cargo bench -p chimera-tui --bench v3_pipeline_bench
          run_bench reduce_bench      cargo bench -p nexus-compute --bench reduce_bench  # ADR-309: 随 compute/ 随迁
          run_bench session_store     cargo bench -p session-store --bench session_store_bench
          run_bench cross_layer       cargo bench -p event-bus --bench cross_layer_bench
          run_bench hybrid_search     cargo bench -p repo-wiki --bench hybrid_search_bench
          run_bench debate            cargo bench -p parliament --bench debate
          run_bench l2_recall         cargo bench -p mlc-engine --bench l2_recall
          run_bench compress          cargo bench -p hcw-window --bench compress
          run_bench compute_masks     cargo bench -p osa-coordinator --bench compute_masks
          run_bench delegation        cargo bench -p chimera-mas --bench delegation_bench
          run_bench cache_hit         cargo bench -p scc-cache --bench cache_hit
          run_bench tiering           cargo bench -p cmt-tiering --bench lsct_tiering_benchmark
          run_bench gather            cargo bench -p gqep-executor --bench gather
          # ===== 工具链并行化重构（ADR-239）新增 =====
          # 四环链分层归因 + 批量派发吞吐对照 + CLI 启动分段 + TUI tick + MCP registry 查找。
          # 与 scripts/perf_thresholds.toml 的 [[run_bench]] 保持同步（I7 双源配对）。
          run_bench tool_dispatch_layers cargo bench -p gqep-executor --bench tool_dispatch_layers
          run_bench tool_runtime_batch   cargo bench -p gqep-executor --bench tool_runtime_batch
          run_bench tool_runtime_chain   cargo bench -p gqep-executor --bench tool_runtime_chain
          # ADR-252：PlanRunner 分层串/并发对照（declared vs undeclared side_effect）
          run_bench toolplan_layers      cargo bench -p gqep-executor --bench toolplan_layers
          # ADR-260：seccore 判决体 opt 臂（spol_opt_hit/miss 两键守生产 ExecPolicy 热路径）
          run_bench spol_eval            cargo bench -p seccore --bench policy_eval
          # ADR-247：run --execute 批量派发对照（F-13 首个生产调用方，生产装配入口端到端）
          run_bench run_execute_batch    cargo bench -p chimera-cli --bench run_execute_batch
          run_bench cli_parse            cargo bench -p chimera-cli --bench cli_parse
          run_bench tui_tick             cargo bench -p chimera-tui --bench tui_tick_bench
          run_bench registry_lookup      cargo bench -p mcp-mesh --bench registry_lookup
          run_bench produce_verify    cargo bench -p pvl-layer --bench produce_verify
          # ADR-192 附带：probe_select 升为 registered（消除 cache_hit 串台假红），I7 双源配对
          run_bench probe_select      cargo bench -p hcw-window --bench probe_select
          run_bench command_validator cargo bench -p seccore --bench command_validator_bench
          # ===== C6(2026-09-04): KPI 首次入 CI 强制门 + L1 热路径基线 =====
          # immune_probe=KPI-03(宣称 708ns,本地实测 907ns 同量级实证);
          # rhi_judge=KPI-04(宣称 44µs,本地实测 7.5µs);bus_bench=publish fan-out。
          run_bench immune_probe      cargo bench -p chimera-mas --bench immune_probe
          # (rhi_judge run_bench 已于 2026-09-25 摘除: 其宿主 crate auto-dpo 于 38c72e6 物理删除，
          #  但 perf_thresholds.toml 2026-09-20 已删其键、此侧漏清→ I7 幽灵。见 ADR-190)
          run_bench bus_bench         cargo bench -p event-bus --bench bus_bench
          # P-6 升格（深审 2026-09-25）：cmt 热层 LRU，本地实测 median 45µs
          # （docs/reports/perf-slo-2026-09-25.md §1.2），与 perf_thresholds.toml 三表同步
          run_bench hot_lru           cargo bench -p cmt-tiering --bench hot_lru
          # P-6 二批（深审 2026-09-25）：nmc 双 bench + gsoe 两热路（实测见 perf-slo-2026-09-25.md）
          run_bench nmc_parallel_encoding cargo bench -p nmc-encoder --bench parallel_encoding
          run_bench nmc_encoding        cargo bench -p nmc-encoder --bench encoding_benchmark
          run_bench three_factor        cargo bench -p gsoe-evolution --bench three_factor_selector_bench
          run_bench formal_gate         cargo bench -p gsoe-evolution --bench formal_gate_eval
          # P-6 终批 6 项（深审 2026-09-26；pdca/memory_graph 磁盘形态根因已查实：
          # criterion 3.x 斜杠组名转义下划线单层目录，关键词按磁盘实形书写）
          run_bench coarse_recall_p95   cargo bench -p hcw-window --bench coarse_recall
          run_bench fine_recall_top     cargo bench -p hcw-window --bench fine_recall
          run_bench rerank_fill_top     cargo bench -p hcw-window --bench rerank_fill
          run_bench pdca_act            cargo bench -p chimera-mas --bench pdca_bench
          run_bench memory_graph_recall cargo bench -p mlc-engine --bench memory_graph_edges
          run_bench osa_sequential_baseline cargo bench -p osa-coordinator --bench parallel_vs_sequential
          # ADR-192（2026-09-26）：mlc L2 分层检索 10k 档（立项判据：现值 4.117ms 越
          # 4ms redline，分层后 ≤2ms）。与 perf_thresholds.toml 三表同批（I7 机器断言兜底）；
          # 100k 档属 dev-only 手动取数（CHIMERA_HNSW_BENCH_FULL=1），不入 CI 日跑。
          run_bench hnsw_tiered        cargo bench -p mlc-engine --bench hnsw_tiered
          # 静默窗口升格（2026-10-04,CPU 前置均值 6.8%）:faae_parallel_bench 由
          # dev-only → registered。hot/scoring 组有绝对阈值守门（见 scripts/perf_thresholds.toml）;
          # concurrent 组随文件注册进 CI 运行,绝对阈值待 CI 首跑数据后校准（不假锁）。
          run_bench faae_parallel      cargo bench -p faae-router --bench faae_parallel_bench
          # ADR-234 S8（第四波·工具链执行面并行化）：两条并行语义 bench 升格。
          # 与 scripts/perf_thresholds.toml 的 [[run_bench]] 同批（I7 机器对拍），
          # 组级阈值键见 scripts/perf_thresholds.toml 的 [thresholds_ns]/[path_keywords]
          # 各 8 项（W4a 起 heredoc 已删，TOML 是唯一登记表；I9/I10 键集对拍随之退役）。
          run_bench tool_plan          cargo bench -p gqep-executor --bench tool_plan
          run_bench llm_tool_loop_bench cargo bench -p chimera-cli --bench llm_tool_loop_bench

      - name: Assert thresholds
        # W4a（P9 病灶两起实害）：原内嵌 heredoc 的 THRESHOLDS_NS/PATH_KEYWORDS
        # 双表已整体删除 —— 那份双写与 scripts/perf_thresholds.toml 三表并行存在，
        # I9/I10/I12 只能对拍键集，「CI 一侧改宽数值」曾长期无人看得见（M44 静默
        # 差集前科）。阈值断言切流 scripts/check_perf_redlines.py 的 thresholds
        # 模式（py 核单一实现，perf_thresholds.toml 为唯一登记表）：
        #   - estimates.json 是 criterion 的稳定契约（stdout 格式随版本漂移）
        #   - 阈值表/关键词表只维护 TOML 一份，根除双写漂移面
        # tee 把本步 stdout 留到 bench_threshold_legacy.log：下一步 compare 拿它
        # 与同轮新鲜重算逐键对拍。tee 不改变本步成败语义（pipefail 下 python
        # 非 0 仍使本步红）。
        shell: bash
        run: python3 scripts/check_perf_redlines.py thresholds --criterion-dir target/criterion 2>&1 | tee bench_threshold_legacy.log

      # W4a 观测位（heredoc 删除后语义迁移）：原 R1-T6 双跑比对（heredoc vs py 核）
      # 的左源已删，本步改为「上一步 CI 落盘结果 vs 同轮新鲜重算」的逐键一致判定
      # —— 捕获 criterion 树在两步之间变动 / tee 截断 / 解析漂移等运行期异常。
      # CHIMERA_PERF_VERDICT_JSON 把逐键判定落盘（compare 模式 --emit-verdict-json
      # 的环境变量缺省），供后续产物消费；本步红 = 对拍发现分歧。
      - name: Double-run compare (logged CI output vs fresh recompute)
        shell: bash
        env:
          CHIMERA_PERF_VERDICT_JSON: tmp/perf_verdict.json
        run: python3 scripts/check_perf_redlines.py compare --legacy-out bench_threshold_legacy.log

      - name: Upload benchmark report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          # WHY 同时上传 target/criterion/ 和 bench logs:
          #   - target/criterion/ 含 estimates.json + HTML 报告,供深度分析
          #   - bench_*.log 含 criterion stdout,快速查看测量摘要
          path: |
            target/criterion/
            bench_*.log
            bench_threshold_legacy.log
          retention-days: 30

  # ============================================================
  # P2-7: CLI 启动延迟黑盒基线(hyperfine)——与 criterion 微基准互补
  # WHY: criterion 覆盖函数级微基准;启动延迟(进程启动+clap 解析+tokio 初始化)
  #      是用户可感知的黑盒指标,由 hyperfine 测量(脚本: scripts/check_cli_startup.sh)。
  #      阈值 100ms = Windows 基线(25.9~27.9ms)~3.6× 余量,Linux 更快余量更足。
  #      失败阻塞合入(启动路径回归属用户体验退化)。
  # ============================================================
  cli-startup:
    name: CLI startup latency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: '.'

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Build release binary
        run: cargo build --release -p chimera-cli

      - name: Run startup latency check (median < 100ms)
        run: bash scripts/check_cli_startup.sh -r 20
