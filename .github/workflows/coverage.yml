# 覆盖率门禁 — 每周定时运行 cargo-tarpaulin,非阻塞
# WHY: coverage 运行缓慢(需插桩编译+全量运行),不应阻塞 PR/推送;
# 作为独立 workflow 通过 schedule 每周运行 + 手动触发,
# 以 --fail-under 85 断言最低 85% 行覆盖率。
name: Coverage (tarpaulin)

on:
  workflow_dispatch:
  schedule:
    # 每周日 04:00 UTC 运行
    - cron: '0 4 * * 0'

# WHY: 非阻塞 — coverage 波动不应阻断任何开发流程,仅作观测信号。
# 失败时 workflow 标记为黄色(警告),不阻塞合入。
jobs:
  coverage:
    name: cargo-tarpaulin (--fail-under 85)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Install cargo-tarpaulin
        # WHY: taiki-e/install-action 下载预编译二进制,避免 cargo install 编译等待。
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage (tarpaulin)
        # WHY: --workspace 覆盖全 workspace; --exclude-files 排除测试与基准代码;
        # --fail-under 85 断言最低 85% 行覆盖率阈值;
        # --out Html/Json 双输出便于人工查看与自动化消费。
        run: cargo tarpaulin --workspace --out Html --out Json --output-dir coverage --exclude-files 'tests/*' 'benches/*' --fail-under 85

      - name: Upload coverage report (HTML)
        # WHY: 即使 --fail-under 未达标,上传产物便于事后排查。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
