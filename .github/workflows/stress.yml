# P9-T2: Stress Profile 独立 CI 工作流
# =============================================================================
# Purpose: 隔离 1000-iter 压测与 60s 级稳定性测试,仅在 nightly + 手动触发;
#          PR 快轨不阻塞,失败仅记录不阻塞合入。
# Trigger: schedule (nightly 03:00 UTC) + workflow_dispatch (manual).
# Profile: cargo nextest --profile stress (-E 'binary(/stress/)')
# WHY not blocking PR: 压测波动大,数据驱动决策;每日观察趋势而非守门禁。
# =============================================================================
name: Stress Tests (nightly)

on:
  schedule:
    # 每日 03:00 UTC 运行(北京 11:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scale:
        description: 'CHIMERA_TEST_TIMEOUT_SCALE (0.01-1.0, default 1.0)'
        required: false
        default: '1.0'

# 同一 ref 取消旧运行(防止积压)
concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  stress:
    name: 1000-iter stress / stability
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 压测可能耗时较长(1000-iter × 单 iter ~10ms = ~10s;含 setup 1-2 min)
    # P9-T2: 压测波动大,失败不阻塞合入,记录到 docs/reports/nextest-stress.json 供后续分析
    continue-on-error: true
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
      # P9-T2: 压测档 scale=1.0 保 spec 语义(不在快轨缩放),
      # 但允许 workflow_dispatch 覆盖。
      CHIMERA_TEST_TIMEOUT_SCALE: ${{ github.event.inputs.scale || '1.0' }}
      CHIMERA_BACKPRESSURE_SECS: '60'  # 压测档背压回到 spec 默认 60s
      # ultra-plan:libtest-json-plus 为实验特性需显式开启
      # (2026-08-07 修复:原 --message-format json 在 nextest 0.9.x 非法)。
      NEXTEST_EXPERIMENTAL_LIBTEST_JSON: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: stress-tests

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run stress tests
        # WHY 仅跑 stress binary:
        #   - -E 'binary(/stress/)' 匹配 binary name 包含 "stress" 的 test target
        #     (包括 stress_test, week7_stress, token_efficiency_stress)
        #   - --profile stress 走 .config/nextest.toml 中的 stress profile 配置
        #     (test-threads = 2 防 I/O 抖动,final-status-level = fail)
        #   - --run-ignored all:1000-iter 压测标了 #[ignore],需显式包含
        #     (2026-08-07 ultra-plan 修复:原 --include-ignored 为 cargo test 语法,
        #     nextest 0.9.x 报 unexpected argument,本通道从未真正运行过压测)
        #   - set +e + 记录 rc:runner 默认 bash 带 -e -o pipefail,压测失败会直接
        #     中止脚本导致退出码无法落盘;此处显式捕获 rc 写入文件供 report 步骤引用,
        #     并以原 rc 退出保留失败语义(continue-on-error 兜底不阻塞 workflow)。
        run: |
          set +e
          cargo nextest run \
            --profile stress \
            -E 'binary(/stress/)' \
            --run-ignored all \
            --no-fail-fast \
            --message-format libtest-json-plus \
            2>nextest-stress.stderr.log \
            | tee nextest-stress.stdout.log
          rc=$?
          echo "exit_code=$rc" > nextest-exit.env
          exit $rc

      - name: Generate stress report
        if: always()
        shell: bash
        run: |
          mkdir -p docs/reports
          # ultra-plan:nextest JSON 输出在 stdout(JSON Lines),stdout.log 即数据源;
          # 原 cp nextest-stress.json 源文件不存在(仅 stdout 有数据),报告从未生成。
          cp -f nextest-stress.stdout.log docs/reports/nextest-stress.json 2>/dev/null || true
          echo "Stress run completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > docs/reports/stress-run-summary.txt
          echo "scale=${CHIMERA_TEST_TIMEOUT_SCALE}" \
            >> docs/reports/stress-run-summary.txt
          # WHY 从 run 步骤写入的 nextest-exit.env 读取真实退出码:
          # $? 在本步骤是上一条 echo 的退出码(恒 0),原实现记录失真
          # (2026-08-12 修复:改读 nextest-exit.env,缺文件时标记 unknown)。
          echo "exit_code=$(cat nextest-exit.env 2>/dev/null || echo unknown)" \
            >> docs/reports/stress-run-summary.txt

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report
          path: |
            docs/reports/nextest-stress.json
            docs/reports/stress-run-summary.txt
            nextest-stress.stdout.log
            nextest-stress.stderr.log
          retention-days: 90  # 压测数据保留 90 天,供趋势分析
