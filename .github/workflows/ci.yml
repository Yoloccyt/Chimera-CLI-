# CI 前置闸门 — PR / push 到 main 时运行 fmt/check/clippy/test
# WHY: 此前仅 audit.yml 在 PR 上触发(且只做 cargo audit 依赖扫描),而
# cargo check/clippy/test 只在 tag 发布(release.yml,受 refs/tags/v 限定)时才跑,
# 即"合并进 main 之后"。缺少合并前的机械校验,会破坏编译或测试的改动可能直接落到 main。
# 本 workflow 把 CLAUDE.md §5 发布前清单中的 fmt/check/clippy/test 前移为合并前的必需闸门。
# 注: Windows-GNU 与 5 平台构建由 release.yml 在 tag 时覆盖;此闸门在 ubuntu-latest 上做
# 跨平台无关的快速校验(编译/单测/lint/格式),以获得最快反馈,不与 release 矩阵重复。
# 注: 覆盖率真实 JSON 裁决由 coverage.yml 在 nightly 阻塞运行(去 continue-on-error,
# 见 RK-P45 收口);tarpaulin 冷插桩编译远超快轨预算,不进 PR。PR 侧仅跑零 cargo 的
# 静态配置面(coverage_gate.py --selftest/--validate-config),见下方 "Coverage config" 步。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# WHY: 同一 ref 的新 push 取消仍在排队/运行的旧 CI,避免 runner 资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # WHY: 与 .cargo/config.toml 对齐 —— CI 无增量复用价值,关闭以规避历史 GNU ICE 并加速。
  CARGO_INCREMENTAL: '0'
  # 注: sccache(RUSTC_WRAPPER)为 job 级配置 —— check/e2e job 各自启用,
  # mca-feature job(ADR-065)不注入,避免影响其独立缓存键语义。

jobs:
  check:
    name: fmt · check · clippy · test
    runs-on: ubuntu-latest
    # WHY 30→15 (2026-08-07 ultra-plan):快轨实测典型 2-4min,15min 余量 3-7 倍;
    # 收紧后测试膨胀(慢测试回归)早期失败,防未来静默膨胀拖慢 PR 反馈。
    timeout-minutes: 15
    # WHY: sccache 编译缓存(跨 job 共享编译产物,与 CARGO_INCREMENTAL=0 不冲突;
    # 仅在 CI 启用,本地不硬编码以避免破坏 Windows GNU 工具链)。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY: 先跑零编译依赖的文档一致性巡检，若架构文档 crate 数与 Cargo.toml 漂移则快速失败(F4)。
      # WHY 钉解释器（2026-10-16）：下面 32 个步骤跑 scripts/*.py 门。91 个脚本经 ast
      # 扫描确认只依赖 stdlib + 同目录兄弟模块（gate_rc / check_l0_purity 等），零 PyPI
      # 包，所以换解释器不会断依赖；但 9 个脚本 `import tomllib`（3.11+ 才有），其中含
      # run_gate_manifest.py——门清单执行器本身。此前一直吃 ubuntu 预装 python3 的隐式
      # 版本，随镜像升级而浮动；Rust 侧已因 `-D warnings` 随 stable 浮动吃过突发红并
      # 钉死 1.97.1（见上一步的 WHY），Python 侧是同一个病的未治版本。
      # 钉 3.11 = 本地已验证的解释器（本机 py -3 即 3.11.9，L0 全门 rc=0），CI==开发端。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Doc consistency (crate count vs Cargo.toml)
        run: bash scripts/check_doc_consistency.sh

      # E3(报告附录 E): workflow 静态检查门禁——actionlint 是 GitHub Actions
      # 事实标准(语法/表达式类型/action 输入/脚本注入),零编译依赖,秒级反馈。
      # 本地 1.7.12 实测 9 个 workflow 零错误(2026-08-17)。
      # WHY 固定版本直接下载(2026-08-19 修复):taiki-e/install-action@v2 为
      # Node20 action,在 Node24 runner 上安装失败(exit 76,1s 内失败);改为
      # 官方 release 资产固定 v1.7.12 下载,与本地验证版本一致,零 Node 依赖。
      - name: Install actionlint (v1.7.12 pinned)
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint -color

      # WHY: 依赖铁律机械闸门(ADR-054 决策 5,check_dependency_rules.sh 头注释)——
      # L(N)→L(N+1) 向上依赖 / 内环越界 / 图完整性违规必须阻塞合入,禁止静默落地 main。
      # 退出码 0=通过 / 非 0=违规;selftest 模式(--selftest)由脚本自身内嵌 mock 图自检。
      - name: Dependency iron-law audit
        run: bash scripts/check_dependency_rules.sh

      # WHY: 层图双源对拍门(C10,2026-09-04)——铁律门以 .sh(CI 调用)/.ps1(本地)
      # 两份手写实现各自内嵌 crate→层表,2026-08-29 曾实际漂移(.ps1 升 43 而 .sh
      # 滞留 38,5 个 crate 静默漏检)。本门四方互锁 .sh case 表/layered_crates 列表、
      # .ps1 $layerMap 与 Cargo.toml workspace.members,任一侧单改必红;
      # 先跑 --selftest(fixture 负控,证明门有牙齿)再跑真实裁决,沿 reachability 先例。
      - name: Layer map parity (sh vs ps1 vs Cargo.toml)
        run: |
          python3 scripts/check_layer_map_parity.py --selftest
          python3 scripts/check_layer_map_parity.py

      # WHY: L0 契约层纯度机器门(G-99, ADR-033 追加节 2026-10-09 自陈缺口的收口)——
      # ADR-033 规定 nexus-contracts 为「纯类型 + 受控纯逻辑」(无 IO/async/网络/随机,
      # 依赖仅 serde/chrono/uuid/thiserror)。此前「受控」二字无机器判据,仅靠 WI-G1
      # 人工审计 + 单测;check_dependency_rules.ps1 Check B 只拦 crate 级向上依赖,
      # 不拦「经合法依赖或 std 引入的 impure 符号」。本门双刃:①[dependencies] 白名单,
      # ②注释/字符串先 blank 后再扫禁用符号(避免误判文档里的 tokio::spawn/URL 提及,
      # 正是 ADR-033 追加节「先确认计数口径」教训的机器化)。零编译秒级 light 门,
      # 沿 check_layer_map_parity/check_accel_exclusion 的 --selftest 双向夹具先例。
      - name: L0 contracts purity gate (G-99)
        run: |
          python3 scripts/check_l0_purity.py --selftest
          python3 scripts/check_l0_purity.py

      # WHY: ADR-222 D1 把 L0 拆为 0A 纯契约 / 0B 核心基础面，但机器层号 0/1 刻意
      # 不重排（116+ 份 ADR 以 L4 seccore 等层号引用历史证据，重排会让整条证据链
      # 失真）。层号不动 ⇒ 「谁属于 L0-A」无法从数字直接读出，故需一道门专判方向：
      # L0-A 不得声明依赖 L0-B，L0-B 不得依赖 L2+；层表多源一致仍由 G-45/G-46 负责
      # （轴分工，不互抄基线）。亚层成员来自 .sh/.ps1 双源并互相对拍。
      - name: L0 sub-layer direction (G-125)
        run: |
          python3 scripts/check_l0_sublayer.py --selftest
          python3 scripts/check_l0_sublayer.py

      # WHY: L0-B 公共 API 签名第三方后端类型泄露门(ADR-225 D6 / R2 M37+M46+M47)——
      # G-131 只锁 L0-B 的外部*依赖行*,并在自己 note 里自陈“L0-B public fn 面不在本门
      # 辖区”;G-99 属 L0-A,G-125 只判方向。结果是上层可以经 `pub fn` 签名拿到 tokio
      # 类型而全仓无任何门统计。R1 M37 只登记未改码且只数返回位,R2 实测参数位才是
      # 耦合最强面(event-bus shard.rs::spawn_workers 直接交出 broadcast::Sender 与
      # tokio::runtime::Handle,等价于要求调用方自备 runtime)。本门 only-decrease 锁
      # ret|arg|bound 三类位置,依赖词表取 l0b_dep_freeze.txt 实测集而非任何散文
      # 白名单(G-125 note 的三值集与实测 27 行仅 16 行相符,据它立门首跑即产 11 条
      # 伪红)。零编译毫秒级 light 门,沿 check_l0_sublayer / check_l0b_dep_surface 的
      # --selftest 双向夹具先例:先证门有牙,再跑真实裁决。
      - name: L0-B public signature leak gate (G-135/G-136)
        run: |
          python3 scripts/check_pub_api_leak.py --selftest
          python3 scripts/check_pub_api_leak.py

      # WHY: PowerShell 5.1 parity 守门(ADR-198 G-85)——本仓将 .ps1 定位为
      # “Windows 权威执行体”，但 CI 与 gate_manifest 均以 pwsh（默认 UTF-8）调用，
      # 而无 BOM 且含非 ASCII 的文件在 5.1 下会按 ANSI 解码。2026-10-02 实测：
      # 工作树副本 24 个 .ps1 中 17 个无 BOM 且含非 ASCII，其中 11 个在 5.1 下根本解析失败
      # （此前由根 e2e dependency_rules_inner_ring_test 调用；该 target 已按 ADR-213 R3 退役，
      #  本步骤判据不变——.ps1 孪生仍由本地 pwsh 与 check_gate_predicates_parity 对拍面调用），
      # 而全量 cargo test 当时仍报绿——即“Windows 侧从未跑成”被沉默吞噬。
      # 本门为字节级检查（不依赖平台），故 Linux runner 同样有效。
      - name: PowerShell UTF-8 BOM gate (Windows 5.1 parity)
        run: |
          python3 scripts/check_ps1_bom_gate.py --selftest
          python3 scripts/check_ps1_bom_gate.py

      # WHY(ADR-222 R8-9): 2026-10-20 的重复键使整份 check_dependency_rules.ps1
      # 无法被 PowerShell 加载，而所有门仍绿——因为 CI 只跑 .sh，G-45/46 与 G-125
      # 都用 Python 读表（dict 折叠重复键），没有任何执行体真正解析过 .ps1。
      # 本步用 Parser::ParseFile 真解析，只判「能否解析」；内容一致与亚层方向
      # 分别仍由 G-45/46 与 G-125 负责（轴分工，不互抄基线）。
      - name: PowerShell syntax gate (G-127)
        run: |
          python3 scripts/check_ps1_syntax.py --selftest
          python3 scripts/check_ps1_syntax.py

      # WHY(ADR-223 D3/D1): 1+6 拆分后 sibling 成为独立装配单元；G-91 只数定义消费者，看不见“某 sibling 被静默摘掉”。
      # 本步锁 Cargo 装配边（only-decrease）；另一步锁 L0-B 外部依赖面。
      - name: L0-A sibling assembly ratchet (G-129)
        run: |
          python3 scripts/check_l0a_sibling_assembly.py --selftest
          python3 scripts/check_l0a_sibling_assembly.py

      - name: L0-B dependency surface ratchet (G-131)
        run: |
          python3 scripts/check_l0b_dep_surface.py --selftest
          python3 scripts/check_l0b_dep_surface.py

      # WHY: 加速器/推理栈排除门(ADR-195 V1/D5)——把"零 GPU 依赖"从一次性人工核对升为
      # 机器判据。当前排除靠 feature 非激活而非结构隔离:nmc-encoder 直接依赖
      # mel_spec="0.4",其可选 feature 面(wgpu/cuda/ort-tensor,default=[])可在零 ADR、
      # 零评审可见决策下把 GPU/ONNX-Runtime 栈拖入 Cargo.lock(ort 仅 MSVC 破 windows-gnu
      # 钉定,wgpu 路径触发 ADR-195 D5 E1 无先例的 forbid(unsafe)×bytemuck::Pod 未决)。
      # 本门断言 Cargo.lock 中 wgpu/naga/ash/d3d12/candle/burn/ort 族 0 命中。先跑 --selftest
      # 守护检测器自身不退化(沿 check_ps1_bom_gate 先例)。
      - name: Accelerator / inference-stack exclusion gate (ADR-195 V1)
        run: |
          python3 scripts/check_accel_exclusion.py --selftest
          python3 scripts/check_accel_exclusion.py

      # WHY: 第三轮收口(2026-10-05, F-U1/决策 3/F-P3+F-A2)——把"并行卸载生产可达性"
      # (组合根唯一口径,棘轮禁静默升降级)、"同步卸载 async 边界必须 worker 让出保护"
      # (flavor 双分支强制模式)与"分片总线热点片事实 + 静默丢发唯一豁免"三件事
      # 从散文升为机器判据。均为零编译秒级 light 门,沿 --selftest 双向夹具先例。
      - name: Compute offload reachability gate (G-87)
        run: |
          python3 scripts/check_compute_offload_reachability.py --selftest
          python3 scripts/check_compute_offload_reachability.py

      - name: Sync offload guard gate (G-88)
        run: |
          python3 scripts/check_sync_offload_guard.py --selftest
          python3 scripts/check_sync_offload_guard.py

      - name: Bus shard hotspot gate (G-89)
        run: |
          python3 scripts/check_bus_shard_hotspot.py --selftest
          python3 scripts/check_bus_shard_hotspot.py

      # WHY: nexus-core 最小依赖机器门(WI-F1,2026-10-06 用户裁决解锁)——L1 枢纽 crate
      # 的生产依赖面是最小性论证的事实基座,本门把"集合不得无评审增减"升为机器判据
      # (NEW/STALE 双向棘轮),同时校验全部生产声明走 workspace 继承,关闭 ADR-196 D5
      # 实录的空档(grep 式检查只认 workspace=true 行,`foo = "1.0"` 外部版本钉死声明
      # 静默漏检)。dev-dependencies 不在冻结面(测试/bench 依赖不进生产图)。
      # 先 --selftest 证明门有牙再跑真实裁决;零 cargo、秒级。
      - name: Nexus-core dependency freeze gate (G-90)
        run: |
          python3 scripts/check_nexus_core_dep_freeze.py --selftest
          python3 scripts/check_nexus_core_dep_freeze.py

      # WHY: L0 契约">=2 消费者"门(WI-A1,2026-10-07)——契约类型诞生即须有两个以上
      # 工作区消费方,否则"先占位后接线"的幽灵契约(recall_fusion/price_vector 先例)
      # 会长期冒充能力。只减登记册 scripts/contract_consumer_baseline.txt 首跑为
      # 全量豁免态;与 check_dead_contract_apis.py(ADR-197 A6)互认。
      # 先 --selftest 证明门有牙(含 DEFS<50 真空守卫),再跑真实裁决;零 cargo、秒级。
      - name: Contract consumers gate (G-91)
        run: |
          python3 scripts/check_contract_consumers.py --selftest
          python3 scripts/check_contract_consumers.py

      # WHY: G-91 的 >=2 消费者规则在豁免台账覆盖面等于缺陷全集时失去约束力——新增一个
      # 零消费者公共类型只要顺手补一行基线就永久静默(ADR-220 决策 1)。本门用 exact key-set
      # 的机器派生台账补这一段:台账禁手编、每个字段每次重算逐字 diff,消费者口径 import 自
      # G-91 本体(两道锁:declared_in 第二遍必须等于 cc 的 defs 集;zero∪one 必须等于 cc 的
      # gap 集,否则退 2 判不了而非判红)。先 --selftest 证明有牙(含方言锁反事实与已接进
      # 生产路径的 defs 地板),再跑真实裁决;零 cargo、秒级。
      - name: Zero-consumer contract ledger (G-123)
        run: |
          python3 scripts/check_contract_zero_consumers.py --selftest
          python3 scripts/check_contract_zero_consumers.py

      # WHY: ADR-213 残余债务波把四支「有牙但从没咬」的检查升为阻塞门。
      # G-101(check_dead_contract_apis.py)按 ADR-197 D5「暂不登记」长期以 advisory 存在、
      # ci.yml 此前只在注释里提过它(原 :171)而从未执行;G-103(check_gates_provenance.py)
      # 方向 B 专抓「脚本自带 --selftest 却未登记 gate_manifest」,而执行这条纪律的门自身
      # 此前也未登记(它首轮实跑就抓到了自己)。两支升格已同批删除
      # gate_provenance_exemptions.txt 对应豁免行——该文件 :17-19 自订纪律:升为门未删行
      # ⇒豁免成为与清单冲突的第二真值源。
      # G-105/G-107 是本轮新建的 L0 只减棘轮:G-91 的 DEF_RE 只枚举
      # pub struct|enum|trait|type,L0 的 pub fn 面(现读 255)与 crate 根 re-export 面
      # (现读 53,W3 刻意保留的双路径)此前不受任何门统计——新增公开项不会让任何东西变红。
      # 四支门均先 --selftest 证明有牙(含真空守卫与畸形台账退 2),再跑真实裁决;零 cargo、秒级。
      - name: L0 contract-surface ratchets (G-105, G-107)
        run: |
          python3 scripts/check_l0_pubfn_ratchet.py --selftest
          python3 scripts/check_l0_pubfn_ratchet.py
          python3 scripts/check_l0_root_surface.py --selftest
          python3 scripts/check_l0_root_surface.py

      - name: Gate provenance and contract-member ledger (G-101, G-103)
        run: |
          python3 scripts/check_dead_contract_apis.py --selftest
          python3 scripts/check_dead_contract_apis.py
          python3 scripts/check_gates_provenance.py --selftest
          python3 scripts/check_gates_provenance.py

      # WHY: 源文件级可达性门(ADR-213 D-18)。ADR-160 的可达性棘轮数的是 crate,而 cargo
      # 对「某个 .rs 没有任何 mod 指向它」一个警告都不给:该文件从不被解析,其 #[cfg(test)]
      # 测试永不运行,其 pub 项不在 API 里,只会随时间腐坏。2026-10-13 实测发现 9 个此类
      # 文件(chimera-tui 5 / parliament 3 / quest-engine 1),其中 parliament 的
      # delegation·event_pipeline·scheduler 三文件在 `cargo test -p parliament --lib --list`
      # 里贡献 0 个测试——即"已交付"叙事下不参与编译的死码。台账是可见债务而非许可:
      # 每行须补 mod 或删文件并同批删行;新增孤儿必红。先 --selftest 证明门有牙再跑真实裁决。
      - name: Source-file reachability ledger (G-109)
        run: |
          python3 scripts/check_src_module_reachability.py --selftest
          python3 scripts/check_src_module_reachability.py

      # WHY: ADR-213 R8.2 冻结了「位置式(MessagePack array)持久类型的字段序」、R9 禁止给这类
