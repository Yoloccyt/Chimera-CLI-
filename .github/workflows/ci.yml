      # WHY: 函数长度红线(单函数 ≤200 行,nuxus规则.md §6.1)审计脚本的冒烟测试——
      # fixture 构造一个 >200 行函数断言 audit_fnlen.py / fn_scan.py 均检出且无误报,
      # 防止治理工具自身退化后红线静默失效(工具已入库,见 scripts/audit_fnlen.py)。
      - name: Function-length audit scripts smoke test
        run: bash scripts/test_fnlen_smoke.sh

      # WHY(M15/C-05): 并行红线静态门(G-133)——check_parallel_redlines.ps1(P1-T13)
      # 自述「零命中是波次收口门禁」,十六源手册 §5.3 红线 3(阻塞 IO 永不进 rayon)与
      # ADR-202 §4 I11 把它当门禁复测判据引用,但此前 gate_manifest 与全部 workflow
      # 均零登记零调用(「手册有文、脚本在盘、门册无号」三脱节),判据载体不存在。
      # 本步接入与 .ps1 逐条等价的 bash 形态(四条禁令:禁自旋/IO-on-rayon/
      # rayon::join 多闭包/同步锁持锁跨 await);.ps1 仍为 Windows 权威执行体
      # (G-134,沿 G-04/G-05 双源先例)。零 cargo、秒级。
      - name: Parallel redlines static gate (G-133)
        run: bash scripts/check_parallel_redlines.sh

      # WHY: ubuntu-latest 预装 stable 工具链;显式补齐 rustfmt/clippy 组件以防缺失。
      - name: Ensure rustfmt & clippy components
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all -- --check

      # WHY 删除独立 `cargo check`（T1.7）：clippy 使用 clippy-driver 重编全部
      # crate，不复用 check 的 rmeta；`--all-targets` 已含类型检查，保留 check
      # 等于同一 workspace 多跑一整轮编译。
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --jobs 2 -- -D warnings

      # WHY 预编译安装(2026-09-28 工具链效率重构):原先 machete/typos/taplo 三个工具
      # 各走 `cargo install --locked`,即在 2 核 runner 上从源码编译,单次 PR 合计
      # 约 5-8 分钟纯工具编译开销;而 Swatinem/rust-cache 只缓存 registry 与 target/,
      # 不缓存 $CARGO_HOME/bin 的安装产物 ⇒ 每一轮都重编一次。
      # taiki-e/install-action 直接下载 GitHub Releases 预编译二进制并校验 SHA256,
      # 秒级完成。C5 的"版本钉死"口径不变(仍逐一 @version);供应链姿态只升不降
      # ——从"编译 crates.io 源码"变为"校验上游 release 校验和"。
      # 本 action 已在本仓 cargo-nextest(ci.yml check/e2e/mca 三 job)、hyperfine
      # (bench_check.yml)上在用,非新增依赖面。
      - name: Install static-analysis CLIs (prebuilt, version-pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2,typos@1.50.1,taplo@0.10.0

      # WHY: 无用依赖门禁(报告 §3.6 行动项 7)——cargo-machete 秒级扫描,
      # 返回码 0/1/2 适合 CI;假阳由各 crate 的 `[package.metadata.cargo-machete] ignored`
      # 表处置(现役一处: crates/chimera-cli/Cargo.toml 的 6 条 feature-gated 装配面,
      # 属**判据放宽**, 理由与反方案见 ADR-221 §11 / T-2)。
      - name: Unused dependencies (cargo-machete)
        run: cargo machete

      # E4(报告附录 E): 拼写检查门禁——typos 以"已知拼写错误修正表"设计保持低误报,
      # 可无监督跑 PR;词表配置见 _typos.toml(项目专有名词/标识符豁免)。
      - name: Spell check (typos)
        run: typos

      # E4(报告附录 E, P1-3 基线): TOML 格式门禁——taplo 为 Even Better TOML 内核;
      # 范围限定配置文件(manifest 因依赖铁律注释布局豁免,见 .taplo.toml WHY);
      # 2026-08-17 已应用基线,本地 check 归零。
      # 注:"profiles/deployment/*.toml" 已于 2026-09-28 摘除——该目录在仓内不存在
      # (本机 taplo 实测匹配 0 文件、静默 rc=0),它是 mca-gateway spec_loader 期待的
      # 部署档目录,属"待实现"而非"待格式化";留在列表里只会掩盖真实缺口。
      #
      # ⚠ 本地复跑须知(2026-09-28 实测,与 CLAUDE.md §5 的 cargo fmt 长路径问题同类):
      # 本仓 core.autocrlf=true 且无根 .gitattributes ⇒ 工作树文件是 CRLF、git blob 是 LF,
      # 而 taplo 对行尾敏感。故在 Windows 工作树上直接跑
      #   taplo fmt --check .cargo/config.toml
      # 会**恒红**——已证明与文件内容无关:把 HEAD 版本转成 CRLF 同样红,转回 LF 即绿。
      # 要本地等效验证,先把待检文件归一化为 LF 再跑,否则极易误判为"自己改坏了格式"。
      # CI(checkout 为 LF)不受此影响,这也是本门在 CI 侧长期为绿而本地为红的原因。
      - name: TOML format check (taplo)
        run: |
          taplo fmt --check -c .taplo.toml \
            "deny.toml" ".cargo/config.toml" ".config/nextest.toml" \
            "fuzz/Cargo.toml" "examples/*.toml" \
            "crates/mca-gateway/affinity.d/*.toml"

      - name: Install cargo-nextest
        # WHY: nextest 并行执行所有测试 binary(400+ binary 从串行变并行),
        # 2026-08-05 本地实测运行段 1126.9s → 130.3s(-88%);
        # taiki-e/install-action 下载预编译二进制,避免 cargo install 16min 编译。
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (workspace, 快速回归)
        # WHY 命令裁剪(2026-08-05 实测,冷全量 ~30min):
        # - --exclude chimera-e2e-tests:根 package 的 E2E/压测 [[test]] 独立二进制的
        #   口径注（2026-10-22 现取，防下一轮误判为陈旧数字）：根 Cargo.toml 的
        #   [[test]] 声明共 **35**，分解 = 31 个 `tests/e2e/*` + 2 个 `tests/stress/*`
        #   + 2 个非 e2e（owasp_top10 / composition_root_omega_learner_test）；
        #   此前“41”为陈旧值，已按 `Select-String -CaseSensitive '^\[\[test\]\]'` 实测订正。
        #   编译+链接+运行移出快轨,由下方 e2e job 并行承担(门禁不丢失);
        #   “不丢失”的两端证据：排除是**按 package 级**
        #   （`--exclude chimera-e2e-tests` 排除根包全部 35 个 [[test]]），而 e2e job 跑
        #   `cargo nextest run -p chimera-e2e-tests -E 'not binary(/stress/)'` ⇒ 同一包内除压测外
        #   全跑；剩下的压测由 `stress.yml`（nightly 03:00 UTC，`-E 'binary(/stress/)'`）接住。
        #   ⇒ 改任何一个过滤式都会破这个闭合，三条（快轨 exclude / e2e -E / stress.yml -E）必须同批看。
        #   注:必须显式传入(2026-08-12 修复——此前命令缺失该参数,注释与命令漂移,
        #   导致 check job 重复编译运行 E2E target,拖慢快轨);
        # - nextest:不运行 doc-tests(~335s,占 cargo test 运行段 55%),
        #   doc-tests 由下方 doctest job（PR 必跑,ADR-222 R8-10）与 release.yml 全量验证覆盖;
        # - --no-fail-fast:单测试失败不阻塞其余测试运行,汇总全部失败;
        # - CHIMERA_BACKPRESSURE_SECS=5:背压测试 60s spec 时长降为 5s 快速回归
        #   (参数化设计见 backpressure_test.rs,Release 验收仍 60s);
        # - P9-T2: --profile ci-fast + -E 'not binary(/stress/)' 排除 1000-iter 压测
        #   与 60s 级稳定性测试,由独立 stress.yml 在 nightly 触发;
        # - P9-T2: CHIMERA_TEST_TIMEOUT_SCALE=0.1 收敛硬编码 2s+ 等待
        #   (见 nexus-contracts::test_scale 模块,缺省 1.0 与原行为等价)。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
          # ultra-plan: mcp-mesh 1000 次事务集成测试参数化(缺省 1000,快轨 100)
          # 事件流连续性语义在任意 N 下等价(见 integration.rs 测试注释)。
          CHIMERA_MCP_TXN_COUNT: '100'
        # WHY 必须带 --workspace(2026-08-19 修复):nextest 的 --exclude 仅在与
        # --workspace 搭配时合法;缺省时默认只跑当前 package,报 "--exclude can
        # only be used together with --workspace" 而 CI exit 101(测试 1s 即败)。
        # WHY --build-jobs 2（T1.7）：CI runner 为 2 核，cargo 默认 jobs=4 会超订；
        # 注意 nextest 的 `-j/--jobs` 是 test-threads 的别名，这里要限制的是编译并行。
        run: cargo nextest run --workspace --profile ci-fast --exclude chimera-e2e-tests -E 'not binary(/stress/)' --build-jobs 2 --no-fail-fast

      # WHY: sccache 命中率统计(始终运行,即便测试失败也能观察缓存效果)。
      # 用于评估跨 job 编译缓存复用率,指导缓存策略调优。
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ============================================================
  # E2E/压测独立 job(与 check 并行)
  # WHY: 根 package 33 个 [[test]] target(week5-8 E2E/安全/压测/控制闭环)
  # 编译+链接成本高、运行耗时长,独立成 job 避免拖慢 PR 快轨反馈;
  # 仍为 required check,合入门禁完整。独立缓存 key 防与快轨产物混用。
  # ============================================================
  e2e:
    name: test (E2E/压测 target)
    runs-on: ubuntu-latest
    # WHY 30→15 (2026-08-07 ultra-plan):e2e 档典型 3-5min,15min 余量充足;
    # 与 check job 同步收紧,防测试膨胀回归。
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-tests

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY: 与 check job 相同,背压测试降为 5s 快速回归。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (chimera-e2e-tests)
        # P9-T2: 排除 stress binary(1000-iter 压测),由独立 stress.yml 在 nightly 触发;
        #        ci-fast 档收敛硬编码等待(scale=0.1)以加速 PR 反馈。
        # 性能重构 D8：再排除 formal_verifier binary —— 其由下方“Formal verification
        #   gate”步骤专项运行(见下一 step)，避免同一 job 内重复执行。两步骤 filter 的
        #   并集仍为“非 stress 全量”(not stress ∧ not formal_verifier ∪ formal_verifier
        #   = not stress)，覆盖不降。改任一 filter 须同批看另一处。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
          # ultra-plan: 同上,快轨收敛 mcp-mesh 事务集成测试。
          CHIMERA_MCP_TXN_COUNT: '100'
        run: cargo nextest run -p chimera-e2e-tests -E 'not binary(/stress/) and not binary(/formal_verifier/)' --no-fail-fast

      # C2(2026-09-04): Formal verification gate — 形式化验证器语义显式接线
      # WHY(ADR-052 待办 2): 7 个验证器(gsoe-evolution/parliament/event-bus/
      # omega-learner/auto-dpo/decay-engine 的 formal 模块,proptest 统计性验证)
      # 此前仅被 e2e 全量隐式覆盖,缺少独立的、可被 R2 解冻治理直接引用的
      # 裁决证据锚点。本步骤显式聚合运行 4 个 formal E2E target
      # (formal_verifier_e2e/m1_e2e/m2_e2e/gate_e2e),失败即阻塞合入
      # (不设 continue-on-error)。验证性质口径:统计性 proptest 而非数学证明,
      # 见 nexus-contracts formal_props::VerificationMethod(C2 口径诚实化)。
      - name: Formal verification gate (7 verifiers)
        env:
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
        run: cargo nextest run -p chimera-e2e-tests -E 'binary(/formal_verifier/)' --no-fail-fast

  # ============================================================
  # doctest 独立 job（ADR-222 R8-10）
  # WHY: PR 快轨三 job 全用 cargo nextest，而 nextest 不跑 doc-tests（见 check job
  # 的 nextest 注释）；release.yml 的 linux-test 只在 tag/dispatch 跑 ⇒ 合入路径上
  # 一度没有任何执行体验证 doctest。本 job 把它补回 PR；独立成 job 而非塞进 check
  # （check timeout 15min，doctest 实测约 335s，混跑会压缩快轨余量）。
  # 工具链与缓存与 check/e2e 同口径钉 1.97.1；不设 continue-on-error。
  # ============================================================
  doctest:
    name: test (doctests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链：同 check/e2e，doctest 编译单元的元数据行为必须与其余 job
      # 同版本，避免版本噪声被误读成代码缺陷。
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: doctests

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY --no-fail-fast：一次跑出全部失败 target，避免「修一个才看见下一个」。
      # WHY 排除根 package：e2e 由 e2e job 承担（同 nextest 口径），doctest 面无该 target。
      - name: Run doctests
        run: cargo test --workspace --exclude chimera-e2e-tests --doc --no-fail-fast

  # ============================================================
  # loom 模型检验 job（ADR-226 D1/D2，R2 C-94）
  # WHY 独立 job：`crates/mlc-engine/tests/loom_card_system.rs` 靠
  #   `#![cfg(loom)]` 门控，必须用 `RUSTFLAGS="--cfg loom"` 才能拉起；而该 flag 是
  #   **全局** 生效的——tokio 自己也有 `cfg(loom)` 分支（`driver.rs:150` 里直接
  #   `assert!(!enabled)`，禁止开 IO driver）⇒ 绝不能拿它跑整个 workspace。
  #   所以本 job 只跑那一个 test binary，这也是 ADR-226 D2 的 E1-a/E1-c：
  #   载体必须是**真实执行**的步骤（不是 continue-on-error 观测位）。
  # WHY ubuntu 而非 windows：ADR-226 §1.5 的「Linux CI 承接」是仓内已登记的承诺
  #   （`docs/reports/phase1-wave0-1-closure.md:101`），此前 `.github/` 里 loom 0 命中。
  # 代价：`--cfg loom` 会让全部依赖重新编译一轮（本地实测单 crate 链约 19min）。
  # ============================================================
  loom:
    name: test (loom model-check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: loom

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY 只跑单个 test binary：见上方注释（tokio 的 cfg(loom) 会让 IO driver 禁能）。
      # WHY --test-threads 1：loom 模型检验本身已串行执行交错，多线程只会互相抢 CPU。
      - name: Run loom model check (card_system)
        env:
          RUSTFLAGS: '--cfg loom'
        run: cargo test -p mlc-engine --test loom_card_system -- --test-threads 1

  # ============================================================
  # MCA 双轨旁路 job(ADR-065 决策 6,PANTHEON 计划 M0 PR-4)
  # WHY: feature `mca` 默认 off,默认 CI 不编译不测试下游 crate 中
  # `#[cfg(feature = "mca")]` 门控的接线代码,存在"门控代码腐化、
  # 转 on 时集中爆雷"风险(风险清单 R5)。本 job 以 --features mca
  # 双轨验证门控面,与默认轨互补,保证两条轨道恒绿。
  # 不设 continue-on-error:门控代码编译/测试失败必须阻塞合入。
  # ============================================================
  mca-feature:
    name: check · test (--features mca)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          # WHY 独立缓存键: feature 集不同,target 产物与默认轨不可混用
          key: mca-feature

      - name: Type check (workspace, --features mca)
        run: cargo check --workspace --all-targets --features mca

      - name: Install cargo-nextest
        # WHY 与 fmt job 对齐:Test 步骤改用 nextest 排除 stress(见其 WHY)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # E2(报告附录 E): feature 矩阵机械闸门——cargo-hack each-feature 穷举
      # 每个 crate 的 feature 组合,封堵"门控代码腐化、转 on 集中爆雷"风险(R5)。
      # --no-dev-deps 减少编译量;--exclude chimera-e2e-tests 避免重复编译 E2E。
      # WHY 预编译安装:同 check job 论证——cargo-hack 源码编译约 1-2 分钟/轮,
      # 而预编译二进制秒级;C5 的版本钉死口径不变。
      - name: Install cargo-hack (prebuilt, version-pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45

      - name: Feature matrix check (cargo-hack)
        run: cargo hack check --workspace --each-feature --no-dev-deps --exclude chimera-e2e-tests

      - name: Test (workspace, --features mca)
        # WHY nextest + 排除 stress(2026-08-19 修复):cargo test 串行跑全部 target
        # (含 35+ E2E + stress)在 2 核 runner 与其余 3 job 并行时资源竞争 flaky
        # (70d840f 轮 success / e50e626 轮 panic,同代码异结果);与 fmt job 的
        # ci-fast 档对齐,stress 由独立 stress.yml 承担;mca_quota_switch_e2e 在根
        # package 仍被编译运行(feature 门控保留)。
        run: cargo nextest run --workspace --features mca -E 'not binary(/stress/)' --no-fail-fast

  # ============================================================
  # P1-7: repo-wiki CI benchmark 阈值断言(可选,不阻塞合并)
  # WHY: benchmark 在 CI 环境波动较大,设为 continue-on-error 避免误报阻塞 PR。
  # 主要目的是捕获数量级退化(如 10× 以上),而非精确性能回归。
  # 仅运行 10K entry 快速 benchmark(~30s),100K 在 release/local 验证。
  # 阈值表见 scripts/check_repo_wiki_benchmark.sh 头部注释。
  # ============================================================
  benchmark:
    name: repo-wiki benchmark 阈值
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # WHY: benchmark 阈值断言脚本(P1-7)
      # 运行 repo-wiki vector_bench 的 10K entry benchmark 并断言阈值
      # 退出码:0=通过 / 1=超阈值 / 2=脚本错误
      - name: repo-wiki benchmark threshold check (10K)
        run: bash scripts/check_repo_wiki_benchmark.sh
