# CI 前置闸门 — PR / push 到 main 时运行 fmt/check/clippy/test
# WHY: 此前仅 audit.yml 在 PR 上触发(且只做 cargo audit 依赖扫描),而
# cargo check/clippy/test 只在 tag 发布(release.yml,受 refs/tags/v 限定)时才跑,
# 即"合并进 main 之后"。缺少合并前的机械校验,会破坏编译或测试的改动可能直接落到 main。
# 本 workflow 把 CLAUDE.md §5 发布前清单中的 fmt/check/clippy/test 前移为合并前的必需闸门。
# 注: Windows-GNU 与 5 平台构建由 release.yml 在 tag 时覆盖;此闸门在 ubuntu-latest 上做
# 跨平台无关的快速校验(编译/单测/lint/格式),以获得最快反馈,不与 release 矩阵重复。
# 注: 覆盖率由 coverage.yml 独立 workflow 处理(非阻塞,每周定时),不在 PR 门禁中运行。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# WHY: 同一 ref 的新 push 取消仍在排队/运行的旧 CI,避免 runner 资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # WHY: 与 .cargo/config.toml 对齐 —— CI 无增量复用价值,关闭以规避历史 GNU ICE 并加速。
  CARGO_INCREMENTAL: '0'
  # 注: sccache(RUSTC_WRAPPER)为 job 级配置 —— check/e2e job 各自启用,
  # mca-feature job(ADR-065)不注入,避免影响其独立缓存键语义。

jobs:
  check:
    name: fmt · check · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WHY: sccache 编译缓存(跨 job 共享编译产物,与 CARGO_INCREMENTAL=0 不冲突;
    # 仅在 CI 启用,本地不硬编码以避免破坏 Windows GNU 工具链)。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Setup sccache
        uses: mozilla/sccache-action@v0

      # WHY: 先跑零编译依赖的文档一致性巡检，若架构文档 crate 数与 Cargo.toml 漂移则快速失败(F4)。
      - name: Doc consistency (crate count vs Cargo.toml)
        run: bash scripts/check_doc_consistency.sh

      # WHY: ubuntu-latest 预装 stable 工具链;显式补齐 rustfmt/clippy 组件以防缺失。
      - name: Ensure rustfmt & clippy components
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Type check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        # WHY: nextest 并行执行所有测试 binary(400+ binary 从串行变并行),
        # 2026-08-05 本地实测运行段 1126.9s → 130.3s(-88%);
        # taiki-e/install-action 下载预编译二进制,避免 cargo install 16min 编译。
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (workspace, 快速回归)
        # WHY 命令裁剪(2026-08-05 实测,冷全量 ~30min):
        # - --exclude chimera-e2e-tests:33 个 E2E/压测 [[test]] 独立二进制的
        #   编译+链接+运行移出快轨,由下方 e2e job 并行承担(门禁不丢失);
        # - nextest:不运行 doc-tests(~335s,占 cargo test 运行段 55%),
        #   doc-tests 由 release.yml 全量验证与发布清单步骤覆盖;
        # - --no-fail-fast:单测试失败不阻塞其余测试运行,汇总全部失败;
        # - CHIMERA_BACKPRESSURE_SECS=5:背压测试 60s spec 时长降为 5s 快速回归
        #   (参数化设计见 backpressure_test.rs,Release 验收仍 60s);
        # - P9-T2: --profile ci-fast + -E 'not binary(/stress/)' 排除 1000-iter 压测
        #   与 60s 级稳定性测试,由独立 stress.yml 在 nightly 触发;
        # - P9-T2: CHIMERA_TEST_TIMEOUT_SCALE=0.1 收敛硬编码 2s+ 等待
        #   (见 nexus-contracts::test_scale 模块,缺省 1.0 与原行为等价)。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
        run: cargo nextest run --profile ci-fast -E 'not binary(/stress/)' --no-fail-fast

      # WHY: sccache 命中率统计(始终运行,即便测试失败也能观察缓存效果)。
      # 用于评估跨 job 编译缓存复用率,指导缓存策略调优。
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ============================================================
  # E2E/压测独立 job(与 check 并行)
  # WHY: 根 package 33 个 [[test]] target(week5-8 E2E/安全/压测/控制闭环)
  # 编译+链接成本高、运行耗时长,独立成 job 避免拖慢 PR 快轨反馈;
  # 仍为 required check,合入门禁完整。独立缓存 key 防与快轨产物混用。
  # ============================================================
  e2e:
    name: test (E2E/压测 target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-tests

      - name: Setup sccache
        uses: mozilla/sccache-action@v0

      # WHY: 与 check job 相同,背压测试降为 5s 快速回归。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (chimera-e2e-tests)
        # P9-T2: 排除 stress binary(1000-iter 压测),由独立 stress.yml 在 nightly 触发;
        #        ci-fast 档收敛硬编码等待(scale=0.1)以加速 PR 反馈。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
        run: cargo nextest run -p chimera-e2e-tests -E 'not binary(/stress/)' --no-fail-fast

  # ============================================================
  # MCA 双轨旁路 job(ADR-065 决策 6,PANTHEON 计划 M0 PR-4)
  # WHY: feature `mca` 默认 off,默认 CI 不编译不测试下游 crate 中
  # `#[cfg(feature = "mca")]` 门控的接线代码,存在"门控代码腐化、
  # 转 on 时集中爆雷"风险(风险清单 R5)。本 job 以 --features mca
  # 双轨验证门控面,与默认轨互补,保证两条轨道恒绿。
  # 不设 continue-on-error:门控代码编译/测试失败必须阻塞合入。
  # ============================================================
  mca-feature:
    name: check · test (--features mca)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          # WHY 独立缓存键: feature 集不同,target 产物与默认轨不可混用
          key: mca-feature

      - name: Type check (workspace, --features mca)
        run: cargo check --workspace --all-targets --features mca

      - name: Test (workspace, --features mca)
        run: cargo test --workspace --features mca

  # ============================================================
  # P1-7: repo-wiki CI benchmark 阈值断言(可选,不阻塞合并)
  # WHY: benchmark 在 CI 环境波动较大,设为 continue-on-error 避免误报阻塞 PR。
  # 主要目的是捕获数量级退化(如 10× 以上),而非精确性能回归。
  # 仅运行 10K entry 快速 benchmark(~30s),100K 在 release/local 验证。
  # 阈值表见 scripts/check_repo_wiki_benchmark.sh 头部注释。
  # ============================================================
  benchmark:
    name: repo-wiki benchmark 阈值
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # WHY: benchmark 阈值断言脚本(P1-7)
      # 运行 repo-wiki vector_bench 的 10K entry benchmark 并断言阈值
      # 退出码:0=通过 / 1=超阈值 / 2=脚本错误
      - name: repo-wiki benchmark threshold check (10K)
        run: bash scripts/check_repo_wiki_benchmark.sh
