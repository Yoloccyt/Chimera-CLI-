# CI 前置闸门 — PR / push 到 main 时运行 fmt/check/clippy/test
# WHY: 此前仅 audit.yml 在 PR 上触发(且只做 cargo audit 依赖扫描),而
# cargo check/clippy/test 只在 tag 发布(release.yml,受 refs/tags/v 限定)时才跑,
# 即"合并进 main 之后"。缺少合并前的机械校验,会破坏编译或测试的改动可能直接落到 main。
# 本 workflow 把 CLAUDE.md §5 发布前清单中的 fmt/check/clippy/test 前移为合并前的必需闸门。
# 注: Windows-GNU 与 5 平台构建由 release.yml 在 tag 时覆盖;此闸门在 ubuntu-latest 上做
# 跨平台无关的快速校验(编译/单测/lint/格式),以获得最快反馈,不与 release 矩阵重复。
# 注: 覆盖率真实 JSON 裁决由 coverage.yml 在 nightly 阻塞运行(去 continue-on-error,
# 见 RK-P45 收口);tarpaulin 冷插桩编译远超快轨预算,不进 PR。PR 侧仅跑零 cargo 的
# 静态配置面(coverage_gate.py --selftest/--validate-config),见下方 "Coverage config" 步。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# WHY: 同一 ref 的新 push 取消仍在排队/运行的旧 CI,避免 runner 资源浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # WHY: 与 .cargo/config.toml 对齐 —— CI 无增量复用价值,关闭以规避历史 GNU ICE 并加速。
  CARGO_INCREMENTAL: '0'
  # 注: sccache(RUSTC_WRAPPER)为 job 级配置 —— check/e2e job 各自启用,
  # mca-feature job(ADR-065)不注入,避免影响其独立缓存键语义。

jobs:
  check:
    name: fmt · check · clippy · test
    runs-on: ubuntu-latest
    # WHY 30→15 (2026-08-07 ultra-plan):快轨实测典型 2-4min,15min 余量 3-7 倍;
    # 收紧后测试膨胀(慢测试回归)早期失败,防未来静默膨胀拖慢 PR 反馈。
    timeout-minutes: 15
    # WHY: sccache 编译缓存(跨 job 共享编译产物,与 CARGO_INCREMENTAL=0 不冲突;
    # 仅在 CI 启用,本地不硬编码以避免破坏 Windows GNU 工具链)。
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY: 先跑零编译依赖的文档一致性巡检，若架构文档 crate 数与 Cargo.toml 漂移则快速失败(F4)。
      - name: Doc consistency (crate count vs Cargo.toml)
        run: bash scripts/check_doc_consistency.sh

      # E3(报告附录 E): workflow 静态检查门禁——actionlint 是 GitHub Actions
      # 事实标准(语法/表达式类型/action 输入/脚本注入),零编译依赖,秒级反馈。
      # 本地 1.7.12 实测 9 个 workflow 零错误(2026-08-17)。
      # WHY 固定版本直接下载(2026-08-19 修复):taiki-e/install-action@v2 为
      # Node20 action,在 Node24 runner 上安装失败(exit 76,1s 内失败);改为
      # 官方 release 资产固定 v1.7.12 下载,与本地验证版本一致,零 Node 依赖。
      - name: Install actionlint (v1.7.12 pinned)
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar xz
          sudo mv actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Run actionlint
        run: actionlint -color

      # WHY: 依赖铁律机械闸门(ADR-054 决策 5,check_dependency_rules.sh 头注释)——
      # L(N)→L(N+1) 向上依赖 / 内环越界 / 图完整性违规必须阻塞合入,禁止静默落地 main。
      # 退出码 0=通过 / 非 0=违规;selftest 模式(--selftest)由脚本自身内嵌 mock 图自检。
      - name: Dependency iron-law audit
        run: bash scripts/check_dependency_rules.sh

      # WHY: 层图双源对拍门(C10,2026-09-04)——铁律门以 .sh(CI 调用)/.ps1(本地)
      # 两份手写实现各自内嵌 crate→层表,2026-08-29 曾实际漂移(.ps1 升 43 而 .sh
      # 滞留 38,5 个 crate 静默漏检)。本门四方互锁 .sh case 表/layered_crates 列表、
      # .ps1 $layerMap 与 Cargo.toml workspace.members,任一侧单改必红;
      # 先跑 --selftest(fixture 负控,证明门有牙齿)再跑真实裁决,沿 reachability 先例。
      - name: Layer map parity (sh vs ps1 vs Cargo.toml)
        run: |
          python3 scripts/check_layer_map_parity.py --selftest
          python3 scripts/check_layer_map_parity.py

      # WHY: 生产可达性棘轮(ADR-160)——依赖铁律只判"方向对不对",不判"有没有被装配"。
      # 2026-08-29 冗余审计实测:43 个 crate 中仅 28 个从组合根 chimera-cli 沿生产
      # [dependencies] 边可达,15 个孤岛合计 50,604 src LOC(15.2%),而同期
      # `cargo test --workspace` 10836 全绿——测试与 bench 覆盖掩盖了"从未接线"。
      # 判据:dev-dependencies 与 optional(feature 门控)边一律不计入装配面;
      # 已知孤岛登记在 scripts/crate_reachability_freeze.txt 作为可见债务(只减不增),
      # 新增未登记孤岛 → 退出码非 0 阻塞合入。先跑 --selftest 守护治理工具自身不退化。
      - name: Crate reachability ratchet
        run: |
          bash scripts/check_crate_reachability.sh --selftest
          bash scripts/check_crate_reachability.sh

      # WHY: Top-K sort_by 例外登记表守护门(C9, ADR-160 同族)——该表此前登记无门
      # (零消费者, 与 coverage_baseline/crate_reachability 同族的"有登记无牙齿"反模式)。
      # 现补一条只 enforce 登记表自身不退化的静态门(格式/重复/失效/裁决词/只减不增),
      # 刻意不做启发式 sort_by 扫描(避免误报红)。先 --selftest 证明门有牙再跑真实裁决,
      # 沿 check_layer_map_parity/check_crate_reachability 先例。全部零 cargo、秒级。
      - name: Top-K sort_by registry ratchet
        run: |
          python3 scripts/check_topk_registry.py --selftest
          python3 scripts/check_topk_registry.py

      # WHY: 覆盖率门的静态面(WS-B, 审计 P0 #1)——真实 JSON 裁决在 nightly
      # (coverage.yml, 去 continue-on-error 后判定生效);PR 只校"配置自洽 + 棘轮单调 +
      # 门自身有牙",全部零 cargo、秒级。首跑校准前 min 暂留 50(见 coverage_baseline.toml)。
      - name: Coverage config & ratchet gate (static, zero-cargo)
        run: |
          python3 scripts/coverage_gate.py --selftest
          python3 scripts/coverage_gate.py --validate-config

      # WHY: 反馈链路一致性门(审计 finding #4)——交叉校验 gate_manifest 中 expect=0
      # (收口必绿)的门脚本,是否在某个 workflow 的 continue-on-error 语境被吞(=清单说
      # 阻塞、实际丢弃,coverage 旧版此病)。全部零 cargo、秒级。先 --selftest 再真实裁决。
      - name: Gate parity (manifest expect vs CI continue-on-error)
        run: |
          python3 scripts/audit_gate_parity.py --selftest
          python3 scripts/audit_gate_parity.py

      # WHY: 性能红线与 bench 清单静态门(R1-T5, 审计发现 F-R4-01)——本门禁原以
      # .ps1(429 行) + .sh(246 行) 两份手写实现存在, 而 CI 中零次调用(全 .github/
      # 唯一命中是 bench_check.yml 的一句注释), 即 6 项 SLO + RL-01~11 + 120 bench
      # 三态登记只在开发者手动敲一次 pwsh 时才生效。现表体已外置为单一真值源、逻辑
      # 收敛到 scripts/check_perf_redlines.py, 本步把"有门"从记性变机制。
      # --static-only = lint(32 子检查) + inventory(三态, 未知即红) + invariants
      # (两表键集对等/兜底债棘轮/重叠对棘轮) + ignored 归属门; 全部零 cargo 调用、
      # 秒级, 故挂在无 paths 过滤的 check job 而非 bench_check(PR 带 paths 过滤且排在
      # 3-8min bench 之后)。故意不写 continue-on-error: 兜脏等于再写一个不跑的门。
      - name: Perf redline inventory & lint gate
        run: |
          bash scripts/check_perf_redlines.sh --selftest
          bash scripts/check_perf_redlines.sh --static-only

      # Concord W5:斜杠命令词表防退化——断言 24 条主流竞品同名命令均存在于
      # SlashCommandRegistry 且 tier 正确(W2 check_slash_vocab 口径提升为 CI 门禁;
      # 退出码 0=通过 / 非 0=词表漂移阻塞合入)。i18n 硬编码防退化由
      # chimera-tui 的 i18n_hardcode_invariant_test 随 workspace 测试覆盖。
      - name: Slash vocab regression
        run: bash scripts/check_slash_vocab.sh

      # WHY: 函数长度红线(单函数 ≤200 行,nuxus规则.md §6.1)审计脚本的冒烟测试——
      # fixture 构造一个 >200 行函数断言 audit_fnlen.py / fn_scan.py 均检出且无误报,
      # 防止治理工具自身退化后红线静默失效(工具已入库,见 scripts/audit_fnlen.py)。
      - name: Function-length audit scripts smoke test
        run: bash scripts/test_fnlen_smoke.sh

      # WHY: ubuntu-latest 预装 stable 工具链;显式补齐 rustfmt/clippy 组件以防缺失。
      - name: Ensure rustfmt & clippy components
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Type check (workspace, all targets)
        run: cargo check --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # WHY: 无用依赖门禁(报告 §3.6 行动项 7)——cargo-machete 秒级扫描,
      # 返回码 0/1/2 适合 CI;误报用 workspace.metadata.cargo-machete 忽略表解决。
      - name: Unused dependencies (cargo-machete)
        run: |
          # C5(2026-09-04): --version 固定工具自身版本(--locked 仅锁依赖树),
          # 防上游 breaking 造成 CI 间歇红;升级需显式改版本号并观察首轮结果。
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete

      # E4(报告附录 E): 拼写检查门禁——typos 以"已知拼写错误修正表"设计保持低误报,
      # 可无监督跑 PR;词表配置见 _typos.toml(项目专有名词/标识符豁免)。
      - name: Spell check (typos)
        run: |
          # C5(2026-09-04): pin 1.50.1(注意: crate 名是 typos-cli,与 typos 库版本不同步)
          cargo install typos-cli --locked --version 1.50.1
          typos

      # E4(报告附录 E, P1-3 基线): TOML 格式门禁——taplo 为 Even Better TOML 内核;
      # 范围限定配置文件(manifest 因依赖铁律注释布局豁免,见 .taplo.toml WHY);
      # 2026-08-17 已应用基线,本地 check 归零。
      - name: TOML format check (taplo)
        run: |
          # C5(2026-09-04): pin 0.10.0
          cargo install taplo-cli --locked --version 0.10.0
          taplo fmt --check -c .taplo.toml \
            "deny.toml" ".cargo/config.toml" ".config/nextest.toml" \
            "fuzz/Cargo.toml" "examples/*.toml" "profiles/deployment/*.toml" \
            "crates/mca-gateway/affinity.d/*.toml"

      - name: Install cargo-nextest
        # WHY: nextest 并行执行所有测试 binary(400+ binary 从串行变并行),
        # 2026-08-05 本地实测运行段 1126.9s → 130.3s(-88%);
        # taiki-e/install-action 下载预编译二进制,避免 cargo install 16min 编译。
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (workspace, 快速回归)
        # WHY 命令裁剪(2026-08-05 实测,冷全量 ~30min):
        # - --exclude chimera-e2e-tests:根 package 33 个 E2E/压测 [[test]] 独立二进制的
        #   编译+链接+运行移出快轨,由下方 e2e job 并行承担(门禁不丢失);
        #   注:必须显式传入(2026-08-12 修复——此前命令缺失该参数,注释与命令漂移,
        #   导致 check job 重复编译运行 E2E target,拖慢快轨);
        # - nextest:不运行 doc-tests(~335s,占 cargo test 运行段 55%),
        #   doc-tests 由 release.yml 全量验证与发布清单步骤覆盖;
        # - --no-fail-fast:单测试失败不阻塞其余测试运行,汇总全部失败;
        # - CHIMERA_BACKPRESSURE_SECS=5:背压测试 60s spec 时长降为 5s 快速回归
        #   (参数化设计见 backpressure_test.rs,Release 验收仍 60s);
        # - P9-T2: --profile ci-fast + -E 'not binary(/stress/)' 排除 1000-iter 压测
        #   与 60s 级稳定性测试,由独立 stress.yml 在 nightly 触发;
        # - P9-T2: CHIMERA_TEST_TIMEOUT_SCALE=0.1 收敛硬编码 2s+ 等待
        #   (见 nexus-contracts::test_scale 模块,缺省 1.0 与原行为等价)。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
          # ultra-plan: mcp-mesh 1000 次事务集成测试参数化(缺省 1000,快轨 100)
          # 事件流连续性语义在任意 N 下等价(见 integration.rs 测试注释)。
          CHIMERA_MCP_TXN_COUNT: '100'
        # WHY 必须带 --workspace(2026-08-19 修复):nextest 的 --exclude 仅在与
        # --workspace 搭配时合法;缺省时默认只跑当前 package,报 "--exclude can
        # only be used together with --workspace" 而 CI exit 101(测试 1s 即败)。
        run: cargo nextest run --workspace --profile ci-fast --exclude chimera-e2e-tests -E 'not binary(/stress/)' --no-fail-fast

      # WHY: sccache 命中率统计(始终运行,即便测试失败也能观察缓存效果)。
      # 用于评估跨 job 编译缓存复用率,指导缓存策略调优。
      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ============================================================
  # E2E/压测独立 job(与 check 并行)
  # WHY: 根 package 33 个 [[test]] target(week5-8 E2E/安全/压测/控制闭环)
  # 编译+链接成本高、运行耗时长,独立成 job 避免拖慢 PR 快轨反馈;
  # 仍为 required check,合入门禁完整。独立缓存 key 防与快轨产物混用。
  # ============================================================
  e2e:
    name: test (E2E/压测 target)
    runs-on: ubuntu-latest
    # WHY 30→15 (2026-08-07 ultra-plan):e2e 档典型 3-5min,15min 余量充足;
    # 与 check job 同步收紧,防测试膨胀回归。
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_CACHE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          key: e2e-tests

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11

      # WHY: 与 check job 相同,背压测试降为 5s 快速回归。
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test (chimera-e2e-tests)
        # P9-T2: 排除 stress binary(1000-iter 压测),由独立 stress.yml 在 nightly 触发;
        #        ci-fast 档收敛硬编码等待(scale=0.1)以加速 PR 反馈。
        env:
          CHIMERA_BACKPRESSURE_SECS: '5'
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
          # ultra-plan: 同上,快轨收敛 mcp-mesh 事务集成测试。
          CHIMERA_MCP_TXN_COUNT: '100'
        run: cargo nextest run -p chimera-e2e-tests -E 'not binary(/stress/)' --no-fail-fast

      # C2(2026-09-04): Formal verification gate — 形式化验证器语义显式接线
      # WHY(ADR-052 待办 2): 7 个验证器(gsoe-evolution/parliament/event-bus/
      # omega-learner/auto-dpo/decay-engine 的 formal 模块,proptest 统计性验证)
      # 此前仅被 e2e 全量隐式覆盖,缺少独立的、可被 R2 解冻治理直接引用的
      # 裁决证据锚点。本步骤显式聚合运行 4 个 formal E2E target
      # (formal_verifier_e2e/m1_e2e/m2_e2e/gate_e2e),失败即阻塞合入
      # (不设 continue-on-error)。验证性质口径:统计性 proptest 而非数学证明,
      # 见 nexus-contracts formal_props::VerificationMethod(C2 口径诚实化)。
      - name: Formal verification gate (7 verifiers)
        env:
          CHIMERA_TEST_TIMEOUT_SCALE: '0.1'
        run: cargo nextest run -p chimera-e2e-tests -E 'binary(/formal_verifier/)' --no-fail-fast

  # ============================================================
  # MCA 双轨旁路 job(ADR-065 决策 6,PANTHEON 计划 M0 PR-4)
  # WHY: feature `mca` 默认 off,默认 CI 不编译不测试下游 crate 中
  # `#[cfg(feature = "mca")]` 门控的接线代码,存在"门控代码腐化、
  # 转 on 时集中爆雷"风险(风险清单 R5)。本 job 以 --features mca
  # 双轨验证门控面,与默认轨互补,保证两条轨道恒绿。
  # 不设 continue-on-error:门控代码编译/测试失败必须阻塞合入。
  # ============================================================
  mca-feature:
    name: check · test (--features mca)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'
          # WHY 独立缓存键: feature 集不同,target 产物与默认轨不可混用
          key: mca-feature

      - name: Type check (workspace, --features mca)
        run: cargo check --workspace --all-targets --features mca

      - name: Install cargo-nextest
        # WHY 与 fmt job 对齐:Test 步骤改用 nextest 排除 stress(见其 WHY)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # E2(报告附录 E): feature 矩阵机械闸门——cargo-hack each-feature 穷举
      # 每个 crate 的 feature 组合,封堵"门控代码腐化、转 on 集中爆雷"风险(R5)。
      # --no-dev-deps 减少编译量;--exclude chimera-e2e-tests 避免重复编译 E2E。
      - name: Feature matrix check (cargo-hack)
        run: |
          # C5(2026-09-04): pin 0.6.45
          cargo install cargo-hack --locked --version 0.6.45
          cargo hack check --workspace --each-feature --no-dev-deps --exclude chimera-e2e-tests

      - name: Test (workspace, --features mca)
        # WHY nextest + 排除 stress(2026-08-19 修复):cargo test 串行跑全部 target
        # (含 35+ E2E + stress)在 2 核 runner 与其余 3 job 并行时资源竞争 flaky
        # (70d840f 轮 success / e50e626 轮 panic,同代码异结果);与 fmt job 的
        # ci-fast 档对齐,stress 由独立 stress.yml 承担;mca_quota_switch_e2e 在根
        # package 仍被编译运行(feature 门控保留)。
        run: cargo nextest run --workspace --features mca -E 'not binary(/stress/)' --no-fail-fast

  # ============================================================
  # P1-7: repo-wiki CI benchmark 阈值断言(可选,不阻塞合并)
  # WHY: benchmark 在 CI 环境波动较大,设为 continue-on-error 避免误报阻塞 PR。
  # 主要目的是捕获数量级退化(如 10× 以上),而非精确性能回归。
  # 仅运行 10K entry 快速 benchmark(~30s),100K 在 release/local 验证。
  # 阈值表见 scripts/check_repo_wiki_benchmark.sh 头部注释。
  # ============================================================
  benchmark:
    name: repo-wiki benchmark 阈值
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # WHY 钉定工具链(2026-09-05): `-D warnings` 的 clippy 门必须锁版本；
      # 浮动到 ubuntu 预装 stable(现 1.98) 会因新版 clippy 新 lint 突发红
      # (如 chunks_exact_to_as_chunks 波及 nexus-contracts/repo-wiki 等多 crate)。
      # 钉到全仓本地已验证的 1.97.1(check/clippy/test 全绿)，使 CI==开发工具链；
      # 待代码整体采用新 lint 后再上调。不用 rust-toolchain.toml（会破 GNU/MSVC/Linux 兼容）。
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # WHY: benchmark 阈值断言脚本(P1-7)
      # 运行 repo-wiki vector_bench 的 10K entry benchmark 并断言阈值
      # 退出码:0=通过 / 1=超阈值 / 2=脚本错误
      - name: repo-wiki benchmark threshold check (10K)
        run: bash scripts/check_repo_wiki_benchmark.sh
