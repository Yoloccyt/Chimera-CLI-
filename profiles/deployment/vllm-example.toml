# 部署 Profile 示例 — vLLM 自部署通道(ADR-072 决策 ⑧)
#
# 服务端不可控域的能力表达载体:自部署推理服务的服务端参数无法由
# Chimera 客户端控制,以下发 Profile 形式表达"部署方承诺的能力"。
#
# 两个区段职责边界(严格):
# - [server_params]: 服务端部署参数,**Chimera 零解析零执行**,仅作部署
#   附注与运维对账(校验存在性与类型,不进入任何客户端逻辑)。
# - [client_relevant]: 客户端可消费的覆盖项,spec_loader 加载时应用到
#   ModelAffinitySpec.capabilities(覆盖 context_window / prompt_caching)。
#
# 引用方式:在 affinity.d/*.toml 顶层声明 `deployment_profile = "<id>"`,
# 该厂商全部模型卡共享此 Profile(如本地自部署的 custom 通道)。

[profile]
id = "vllm-7b-chat"
# 对应 affinity.d 卡片(如 custom.toml)的 provider 名
channel = "custom"
engine = "vllm"

# ============ 服务端参数(仅部署附注,客户端不解析) ============
[server_params]
# KV cache 量化位数(8/4/0=不量化)——PagedAttention 引擎参数
kv_cache_quant_bits = 8
# PagedAttention block 大小(token/块)
paged_attention_block_size = 16
# 前缀缓存开关(等价 DeepSeek 隐式自动缓存)
enable_prefix_caching = true
# chunked prefill 分块大小(token)
chunked_prefill_size = 8192
# 引擎最大序列长度(token)——客户端的 max-model-len 上限
max_model_len = 131072
# 批处理窗口(并发请求数)
max_num_seqs = 256

# ============ 客户端可消费覆盖项(spec_loader 应用) ============
[client_relevant]
# 覆盖 capabilities.context_window(服务端 max_model_len 的可用窗口)
context_window_override = 131072
# 覆盖 capabilities.prompt_caching("implicit"/"explicit_control"/"none")
# vLLM prefix caching = 隐式自动缓存,客户端按 Implicit 族做会话粘性
cache_support_override = "implicit"
