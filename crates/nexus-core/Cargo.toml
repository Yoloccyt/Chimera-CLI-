[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# P5-T1（D-Q4）:tokio_unstable cfg 声明已提升至根 [workspace.lints.rust]
# （E-5 opt-in 后局部 [lints.*] 与 lints.workspace=true 互斥，见根注释）

[dependencies]
# 全部使用 workspace 共享依赖(§4.1 规范)
ndarray = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# L1-R1(2026-11,随 v2.30 重构批):tokio 全 crate(src/tests/benches)零使用,
# 系 B2/ADR-311 RL/resilience 面退役后的孤儿依赖,摘除( freeze 台账同批)。
# event-bus: WS-4A ClvSnapshotReported 事件发布(L1 Core → L1 Core 同层互引合规)
# WHY 合规: §2.2 同层互引允许 L(N)→L(N);event-bus 不依赖 nexus-core(零环,
# payloads.rs ClvSummary::from_clv_slice 已解耦),故 nexus-core→event-bus 无环。
event-bus = { workspace = true }
# ADR-309 (W4-1) 迁出记录：CPU 卸载计算面已为独立 crate nexus-compute（L0-B 同层）。
# B1/ADR-311 shim 退役：兼容 shim 已删，消费方直连 nexus_compute；本 crate 对其
# 零依赖（G-125 方向守护不变），`nexus-core|nexus-compute` 内部边同批自 dep_edge_freeze 摘除。
# L0-B 同层：计算面遥测契约与上报编排（ADR-222 D3）。
# B2 迁出后的零消费残留（本任务 Wave L1-C-1 摘除）：`nexus-telemetry` 声明理由
# 「KindCounters 引用 TaskKind/hts」随 compute 面迁往 nexus-compute 后已不成立；
# `nexus-core` 全 crate（含 tests/benches）grep `nexus_telemetry` = 0 命中。
# 唯一消费者是 nexus-compute ⇒ 保留 nexus-telemetry 为独立 crate（ADR-222 D3），
# 但 nexus-core 对它零依赖，G-125 方向守护与 G-90 依赖面棘轮同批同步。
# tracing: WS-4A ClvSnapshotReported 发布失败告警日志
tracing = { workspace = true }
# Task 3.10: L0 nexus-contracts 类型下沉(EventMetadata/TaskStatus/Checkpoint)
# WHY 合规: L1 → L0 恒允许(§2.2 依赖铁律扩展 ADR-033);nexus-contracts 纯类型零依赖,不引入环
# B4d/ADR-311: `types` 纯 re-export 汇聚点已退役 ⇒ 消费方直连 nexus-contracts,
# 本 crate 只在自身实现处使用 L0 领域类型(Quest/Task/TaskStatus/ThinkingMode)。
nexus-contracts = { workspace = true }
# P1-W4 统计学习层与 P1-W5 RL 客户端已随 B2/ADR-311 退役（2026-11-15）：
# rand（仅 stat_learning 消费）与 async-trait（仅 rl_client 消费）同批摘除；
# rayon/arc-swap 系 W4-1 compute/HTS 迁出后的零消费残留，B2 一并清理。

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rmp-serde = { workspace = true }
serde_json = { workspace = true }
# L1-R1:chrono 唯一使用点 tests/types.rs:354(Utc::now 时间戳断言),降为 dev 面
chrono = { workspace = true }

[[bench]]
name = "clv_bench"
harness = false

[[bench]]
name = "clv_cosine"
harness = false

# ADR-309 (W4-1): bridge_bench / hts_bench / reduce_bench 已随迁至 crates/nexus-compute/Cargo.toml [[bench]]

# E-5 opt-in: production code expects rewritten to documented defensive
# branches (pop-if-let / iterator let-else); rest are test/bench idioms.
[lints]
workspace = true
