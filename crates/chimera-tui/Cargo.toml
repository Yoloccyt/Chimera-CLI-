[package]
name = "chimera-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

# TUI 面板总览:19 面板循环(22 PanelId 枚举,3 个标注'暂不注册'原因:
# Timeline/OsaSparse/Sysinfo,详见 app/mod.rs 注册逻辑)
# v3.1 重构:自研渲染引擎特性开关(ADR-029 / ADR-061)
# WHY feature flag:自研引擎与现有 ratatui 路径双轨并存,逐面板迁移,
# 每个里程碑可 cargo test --workspace 全绿、随时回滚。
# M0-M1 引擎骨架默认编译(供 CI 类型检查);M2 起 v3-engine 默认启用,
# 经 `default = ["v3-engine"]` 切换实际渲染路径(ADR-061,2026-07-30)。
# 回退机制:运行时 `CHIMERA_NO_V3_ENGINE=1` env var 或 CLI `--no-v3-engine`
# flag 可禁用 v3 路径走 ratatui 回退(2 个版本周期兼容窗口)。
[features]
default = ["v3-engine"]
# 启用自研渲染引擎作为实际渲染后端(M2 起默认启用,见 ADR-061)
v3-engine = []

[dependencies]
# L10 Interface → L1 Core(向下依赖,event-bus 是唯一跨层通道,§2.2 依赖铁律)
event-bus = { workspace = true }
# WHY 直接依赖:engine::compat 需按 Unicode 显示宽度定位宽字符续格(ratatui 0.29
# 渲染不写 skip 标志);unicode-width 已是 ratatui 传递依赖,版本同源零新增下载。
unicode-width = "0.2"

# nexus-core 为 L1 Core 共享领域类型(Quest/Task 等),L10 向下依赖允许
nexus-core = { workspace = true }
# Phase 6 D-6 虚假数据固化治理(延续 L2/L3/L4 深度优化事件驱动化先例):
# - 原 Task 3.2 mlc-engine 依赖(current_memory_stage() 全局占位)已移除,
#   记忆策略阶段改由 latest_events 事件流派生(MemConStrategyAdjusted 事件)
# - 原 Task 3.3 cmt-tiering 依赖(tier_distribution() 全局占位)已移除,
#   四层存储分布改由 latest_events 事件流派生(CapabilityTierStatsReported 事件)
# - 原 Task 3.4 decay-engine 依赖(shadow_breaker_status() 全局占位)已移除,
#   熔断状态改由 latest_events 事件流派生(ShadowBreakerTripped 事件)
# - 原 Task 3.6 osa-coordinator 依赖(five_dimension_masks() 全零占位,已弃用)已移除,
#   掩码真实数据由 OsaSparseSync 从 OmniSparseMasksComputed 事件同步
# 共减少 4 条 L10→L2/L3/L4/L6 依赖边,跨层数据一律走 EventBus(§2.2 依赖铁律)。
# Task 3.5: L10 → L5 向下依赖,DagVizPanel 调用 spec_dag_snapshot()
# 显示谱系 DAG 节点/边计数(规范版本演化图)
gsoe-evolution = { workspace = true }
# Task 3.7: L10 → L7 向下依赖,MetricsDashboard 调用 timeout_stats()
# 显示 GQEP 双层超时防护统计(单操作超时 + 全局超时)
gqep-executor = { workspace = true }
# Task 3.7: L10 → L7 向下依赖,PvlScorePanel 调用 pvl_score()
# 显示 PVL 九维度过程评分(快手 KAT,ADR-049)
pvl-layer = { workspace = true }
# Task 3.9: L10 → L9 向下依赖,TaskManagerPanel 调用 quadrant_status()
# 显示四象限稳定分工 + WSJF 调度(ADR-027)
chimera-mas = { workspace = true }
# Task 3.8: L10 → L8 向下依赖,ParliamentPanel 调用 immune_system_status()
# 显示三探针免疫系统状态(ADR-046)
parliament = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# serde_yaml:TuiConfig 持久化(Task 15),save_to_file/load_from_file YAML 读写
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# TuiBible 多源配置加载器(Task 3.2):Figment 4 源合并(默认/文件/env/CLI),
# 复用 workspace 共享 figment,避免重复声明版本
figment = { workspace = true }
# 事件元数据中的时间戳格式化(已存在于 workspace 依赖)
chrono = { workspace = true }
# MessagePack 编码/解码,用于事件详情弹窗(P3.1)
rmp-serde = { workspace = true }
# 系统资源指标采集(CPU/内存/磁盘/网络)
sysinfo = { workspace = true }
# TUI 渲染与终端 IO
ratatui = { workspace = true }
crossterm = { workspace = true }
# Task 2.3: 指标历史 SQLite 持久化(资源监控趋势图)
# WHY rusqlite: 复合主键 (unix_ts, metric) + ON CONFLICT REPLACE 幂等写入
# 是 SQLite 标准用法;bundled 模式不依赖系统 SQLite,跨平台一致
rusqlite = { workspace = true }
# M3b:Chat 会话 session_id 生成(uuid v7 时间有序,复用 workspace 声明)
uuid = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# criterion:性能基准测试框架(P3.2 任务,§7.1 测试矩阵约定)
criterion = { workspace = true }
# Task 2.3: SQLite 历史持久化测试隔离(每个测试独占临时目录,避免污染)
tempfile = { workspace = true }
# engine_compat_test 需复刻"前格宽度 >= 2 定位续格"的等价判定
unicode-width = "0.2"

# P3.2 性能与压力验证:data_pipeline 测量快照生成延迟,render 测量 5 面板渲染帧时间。
# harness = false:criterion 自带 main,关闭 libtest 默认 harness 避免冲突。
[[bench]]
name = "data_pipeline_bench"
harness = false

[[bench]]
name = "panels_scale_bench"
harness = false

[[bench]]
name = "v3_output_bench"
harness = false

[[bench]]
name = "render_bench"
harness = false

# v3.1 M0 benchmark-first(先 RED):diff_engine 测量双缓冲差异计算延迟,
# streaming 测量 token 增量渲染延迟。阈值见各 bench 文件头注释。
[[bench]]
name = "diff_engine_bench"
harness = false

[[bench]]
name = "streaming_bench"
harness = false

# v3.1 M1.2:测量 writer 样式去重 + Span 合并后的输出渲染耗时(低带宽关键路径)。
[[bench]]
name = "writer_ansi_bench"
harness = false

# v3-engine 全链路渲染路径(评估报告 P0-1):TestBackend 新建 + draw + clone +
# compat 转换 + diff 写出的完整链路段量化基线(目标 P95 < 16ms @200x50)。
[[bench]]
name = "v3_pipeline_bench"
harness = false
