[package]
name = "omega-learner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L0 Contracts:共享类型(SelectorPolicy / SelectorWeights / TemporalMeta 等,ADR-033)
# WHY 排在首位:omega-learner 输出 SelectorPolicy::Learned 给 hcw-window selector,
# 复用 nexus-contracts 的契约类型,避免类型分裂(§4.1:库层避免 Box<dyn Trait>)
nexus-contracts = { workspace = true }
# L1 Core:EventBus 跨层通信,订阅 AgentTaskCompleted/Failed/CheckpointSaved 作为奖励信号
# WHY 合规:omega-learner 位于 L6,event-bus 位于 L1,L6 → L1 向下依赖允许(§2.2 依赖铁律)
# 学习器只异步订阅反馈事件,不在推理关键路径同步调用(spec.md §7.3 "learner 只异步下发策略")
event-bus = { workspace = true }
# ndarray:LinUCB 算法核心矩阵运算(A_a d×d 矩阵 + b_a d 向量 + θ_a 计算)
# WHY workspace 已声明:mlc-engine/osa-coordinator 等同层 crate 使用,LinUCB 与 CLV 共享同一线性代数栈
ndarray = { workspace = true }
# 序列化:LinUCB 状态(A_a/b_a 矩阵)持久化用于断点恢复 + spec 版本化
serde = { workspace = true, features = ["derive"] }
# 序列化格式:LinUCB 状态 JSON 持久化(便于 inspect/debug)
serde_json = { workspace = true }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(arm 选择/模型更新/反馈信号追踪)
tracing = { workspace = true }
# 时间处理(反馈事件时间戳 + 学习步时间戳)
chrono = { workspace = true }
# UUIDv7 生成(学习版本号 + 轨迹 ID)
# rand:经验回放池随机采样(P4-W16.2.1)— off-policy RL 训练需均匀采样
# WHY workspace 已声明:proptest 等 crate 间接使用,直接声明确保版本一致
rand = { workspace = true }
# tokio:异步事件订阅(s9_integration 后台任务订阅 StreamSessionCompleted)
# WHY 生产依赖:s9_integration 使用 tokio::spawn 启动后台事件订阅任务,
# 不在关键路径同步调用(§3.4.1 原则 1:OMEGA 四定律守恒,Ω-Event 异步通信)。
# 与 dev-dependencies 的 tokio 共享 workspace 版本。
tokio = { workspace = true }

[dev-dependencies]
# 异步测试运行器(LinUCB select_arm 非 async,但 feedback 订阅器集成测试需 tokio)
tokio = { workspace = true }
# 属性测试框架(LinUCB 不变量验证:regret 单调性 / 矩阵正定性)
proptest = { workspace = true }
# 基准测试框架(LinUCB select_arm p95<1ms 性能基线)
criterion = { workspace = true }

[[bench]]
name = "linucb_select"
harness = false

# P4-W16.2.2 步骤 7:R1 召回配额 CQL/IQL 性能基准
[[bench]]
name = "r1_recall_quota"
harness = false

# polish-v2.7 P0-5:经验回放池采样基线(ADR-049 决策 6 性能可证伪门禁)
# WHY 先建基线:均匀采样 ReplayPool 在 1K/10K/100K 规模的延迟曲线,
# 作为 Phase 4 per_buffer(SumTree 优先级采样)的对比基准。
[[bench]]
name = "replay_sample"
harness = false

# closure Stage C-12:SumTree PER 采样门禁固化(KPI-P4:100K/batch32 p99<100µs)
[[bench]]
name = "per_buffer_sample"
harness = false

# R2 解冻阶段③ 前置 1:后悔率采集管线开销基线
# WHY SLO:record 每学习步调用需 <1µs;assess_trend 周期性评估需 <100µs
[[bench]]
name = "regret_collection"
harness = false

# P1-2: S9 63 臂场景下查询性能基准(7 厂商 × 3 模型 × 3 思考档)
# WHY 新增:验证 63 臂 select_route/observe 延迟 < 100μs,
# 超过 ~40 臂典型场景,压力测试确保性能红线合规。
[[bench]]
name = "s9_bench"
harness = false

# PROBE P2.3: S4 29 臂探针配比选择基准（select p99 < 50μs 红线）
[[bench]]
name = "s4_select"
harness = false
