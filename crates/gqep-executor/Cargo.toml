[package]
name = "gqep-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L1 Core:提供 id_newtype! 宏(生成 OperationId newtype)
nexus-contracts = { workspace = true }
# L4 Security: execpolicy 决策审计 + 规则引擎（P4-T3 接线:ToolExecutor 挂审批流水线）
seccore = { workspace = true }
nexus-core = { workspace = true }
# L1 Core:跨层通信唯一通道,发布 GatherCompleted/OperationTimedOut/OrphanCallDetected 事件
event-bus = { workspace = true }
# L4 Security:QEEP 协议,提供 OrphanDetector 与 entangle 包裹(零孤儿调用保证)
qeep-protocol = { workspace = true }
# 异步运行时:tokio::time::timeout 包装单操作超时
tokio = { workspace = true }
# 配置与结果类型序列化(#[derive(Serialize, Deserialize)])
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(事件发布失败告警)
tracing = { workspace = true }
# FuturesUnordered 流式聚集(对应 A.2 设计决策:流式处理,内存占用更低)
futures = { workspace = true }
async-trait = { workspace = true }
# UUIDv7 操作 ID 生成(时间有序,便于追溯)
# 时间戳(聚集延迟计算)

[dev-dependencies]
# 性能基准框架(SubTask 24.6)
# WHY async_tokio:启用 `Bencher::to_async` 方法,支持异步基准测试
criterion = { workspace = true, features = ["async_tokio"] }
# 属性测试框架(SubTask 24.6)
proptest = { workspace = true }
# ADR-241 W3-T3 裁决用：沙箱门缓存的「无锁读候选」同轮对照基准。
# WHY 只作 dev-dependency：候选实现尚未采纳（须先由同轮对照证明收益>0），
# 裁决前不进生产依赖，避免供应链面无谓扩大。
dashmap = { workspace = true }
# tokio 测试工具
tokio-test = { workspace = true }
# JSON 序列化测试(config.rs serde 往返测试)
serde_json = { workspace = true }

# 性能基准配置:harness=false 以使用 criterion 自定义 main
[[bench]]
name = "gather"
harness = false

[[bench]]
name = "tool_runtime_chain"
harness = false

# 性能增量（2026-11-06）：四环链分层归因基准（policy/sandbox/route/transport 各环占比）
[[bench]]
name = "tool_dispatch_layers"
harness = false

# 性能增量（2026-11-06）：批量派发「串行 vs 有界并行」吞吐对照
[[bench]]
name = "tool_runtime_batch"
harness = false

# 性能增量（2026-11-06）：PlanRunner 只读层「concurrency=1 vs 8」墙钟对照
[[bench]]
name = "toolplan_layers"
harness = false

# E-5 第五例 opt-in：生产码唯二 expect(“validate 已保证”不变量)已改 fail-soft
# 错误 JSON(与执行失败同型)；余命中全在 cfg(test) mod/benches/tests，按惯用法 allow。
[lints]
workspace = true
