[package]
name = "cmt-tiering"
version.workspace = true
edition.workspace = true

[dependencies]
# L1 Core:EventBus 跨层通信,发布 CapabilityTiered 事件(Week 3 Task 6 新增)
event-bus = { workspace = true }
# L1 Core:nexus-core(SubTask 21.2 — 共享 sqlite_pragma 模块,消除 PRAGMA 重复实现)
nexus-core = { workspace = true }
# L0 Contracts:八维度奖励权重接入(Milestone D-2e,RLVR 层权重 × RewardLayer)
# WHY L3→L0(§2.2 依赖铁律):分层奖励接入需消费 RewardSpec 权重表
nexus-contracts = { workspace = true }
# Warm/Cold 层 SQLite 持久化(WAL 模式与附加数据库,避免新依赖)
rusqlite = { workspace = true }
# Hot 层线程安全分片锁(支持并发读写)
dashmap = { workspace = true }
# 序列化:条目持久化与事件 payload
serde = { workspace = true }
serde_json = { workspace = true }
# rand:分层经验回放池均匀采样(polish-v2.7 P4-2,rl_replay_pool)
# WHY workspace 已声明:omega-learner 回放池同款采样需求,统一版本
rand = { workspace = true }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 时间戳:CapabilityEntry 访问时间与衰减计算
chrono = { workspace = true }
# 异步运行时与 spawn_blocking(Cold/Ice 层文件 I/O 包装)
tokio = { workspace = true }
# 结构化日志(操作追踪与调试)
tracing = { workspace = true }

[dev-dependencies]
# 测试用临时文件/目录(跨平台安全),用于 Warm/Cold/Ice 层持久化测试
tempfile = { workspace = true }
# 基准测试框架(SubTask 11.1:Week 3 复审扩展)
criterion = { workspace = true }
# 属性测试框架(SubTask 15.12:DecayCalculator 单调递减不变量验证)
proptest = { workspace = true }

[[bench]]
name = "hot_lru"
harness = false

[[bench]]
name = "pragma_capable_bench"
harness = false

# closure Stage C-12:分层回放池采样基准(ADR-049,分层 vs 均匀采样开销对照)
[[bench]]
name = "rl_replay_sample"
harness = false

# Milestone D-2e:DQN 记忆迁移决策基准(性能可证伪)
[[bench]]
name = "rl_migration_bench"
harness = false
