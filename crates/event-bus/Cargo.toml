[package]
name = "event-bus"
version.workspace = true
edition.workspace = true

[dependencies]
# 全部使用 workspace 共享依赖(§4.1 规范)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
# arc-swap:P2-W7.2.3 RCU 原语(内环最终一致 + 单调读)
arc-swap = { workspace = true }
# L0 Contracts:formal_props 验证结果类型(FormalVerifier M1 P7-T4,ADR-047)
# WHY 合规:L1 → L0 恒允许(§2.2 依赖铁律扩展);nexus-contracts 纯类型零依赖,不引入环
nexus-contracts = { workspace = true }
# L1 Core 共享领域类型(Quest 等),event-bus 与 nexus-core 同层互引允许(§2.2)
# ADR-054 决策 6(P9-T7 Task 4):Quest 引用已改从 L0 nexus-contracts(domain 模块);
# 仍保留 nexus-core 生产依赖,原因:ClvSummary::from_clv 生产 API 签名依赖
# nexus_core::clv::CLV(512 维向量,未下沉 L0,nexus-contracts 零依赖铁律无法承载)。
# 解除条件:CLV 下沉 L0 或 from_clv 改签,见 P9-T7 Task 4 落地记录。
nexus-core = { workspace = true }
# Prometheus 指标注册表与文本编码(Phase V Task V-8:/metrics 端点导出)
prometheus-client = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# tracing-test:捕获 tracing 日志,验证 Critical 事件无订阅者时的 warn 日志(SubTask 17.2)
tracing-test = { workspace = true }
# criterion:性能基准测试框架(§7.1 测试矩阵约定)
criterion = { workspace = true }
# proptest:属性测试框架,用于 NexusEvent severity/type_name/topic 不变量验证
proptest = { workspace = true }

[[bench]]
name = "bus_bench"
harness = false

# P2-W7.1.2: 膜投递性能基准(跨膜事件投递 p95<10ms 验收)
[[bench]]
name = "membrane_delivery_bench"
harness = false

# Task 3.1:TuiAction 协议分发延迟基准(8 变体 publish_blocking < 10µs 验收)
# WHY 独立 bench:8 变体 payload 形态不同,参数化测量可识别偏高频次;
# 全部走 broadcast 路径(非 Critical),不触发 mpsc 旁路
[[bench]]
name = "tui_action_dispatch_bench"
harness = false

# P3-2: 内环跨层集成性能基准
# 模拟 L1→L2→L6→L7 跨层数据流,测量 EventBus 作为跨层通信唯一通道的
# 端到端延迟与并发扇出吞吐量。
# 运行: cargo bench -p event-bus --bench cross_layer_bench
[[bench]]
name = "cross_layer_bench"
harness = false
