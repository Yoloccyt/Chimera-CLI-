[package]
name = "event-bus"
version.workspace = true
edition.workspace = true

[dependencies]
# 全部使用 workspace 共享依赖(§4.1 规范)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rmp-serde = { workspace = true }
# arc-swap:P2-W7.2.3 RCU 原语(内环最终一致 + 单调读)
arc-swap = { workspace = true }
# L0 Contracts:formal_props 验证结果类型(FormalVerifier M1 P7-T4,ADR-047)
# WHY 合规:L1 → L0 恒允许(§2.2 依赖铁律扩展);nexus-contracts 纯类型零依赖,不引入环
nexus-contracts = { path = "../nexus-contracts" }
# L1 Core 共享领域类型(Quest 等),event-bus 与 nexus-core 同层互引允许(§2.2)
nexus-core = { path = "../nexus-core" }
# Prometheus 指标注册表与文本编码(Phase V Task V-8:/metrics 端点导出)
prometheus-client = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# tracing-test:捕获 tracing 日志,验证 Critical 事件无订阅者时的 warn 日志(SubTask 17.2)
tracing-test = { workspace = true }
# criterion:性能基准测试框架(§7.1 测试矩阵约定)
criterion = { workspace = true }
# proptest:属性测试框架,用于 NexusEvent severity/type_name/topic 不变量验证
proptest = { workspace = true }

[[bench]]
name = "bus_bench"
harness = false

# P2-W7.1.2: 膜投递性能基准(跨膜事件投递 p95<10ms 验收)
[[bench]]
name = "membrane_delivery_bench"
harness = false
