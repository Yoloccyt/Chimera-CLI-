[package]
name = "seccore"
version.workspace = true
edition.workspace = true

[features]
# 默认构建:仅进程级隔离(tokio::process::Command),零额外依赖,契合单机 CLI 零依赖部署。
default = []
# WASM 沙箱 PoC(ADR-035 决策 2):启用 wasmtime 后端,为高风险场景提供 VM 级隔离。
# 启用方式:`cargo check -p seccore --features wasm-sandbox`。
# WHY feature gate:wasmtime 编译时间约 5+ 分钟,体积大;默认构建不应承担此成本。
#     ADR-035 明确"Windows 仅作 PoC 验证可编译性,不强制启用"。
wasm-sandbox = ["dep:wasmtime"]

[dependencies]
# ADR-054 决策 3(P9-T4):AttackType/Command/CommandPolicy/CommandValidator 上提 L0,
# seccore 依赖 L0 契约(经 re-export 保对外 API 兼容)并实现 CommandValidator trait。
# 依赖方向: L4 → L0 ✓(§2.2 依赖铁律扩展,ADR-033)。
nexus-contracts = { workspace = true }
# SHA-256 审计链哈希计算
sha2 = { workspace = true }
# 哈希十六进制编码(审计块、执行结果摘要)
hex = { workspace = true }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 领域类型序列化(审计块持久化、跨进程传输)
serde = { workspace = true, features = ["derive"] }
# 异步沙箱执行(tokio::process::Command)
tokio = { workspace = true }
# 审计块时间戳(UTC)
chrono = { workspace = true }
# 审计/拦截事件日志
tracing = { workspace = true }
# UUID v4 生成(gVisor 沙箱名防冲突)
uuid = { workspace = true, features = ["v4"] }
# serde_json:OCI config.json 序列化(gVisor OCI bundle 生成)
serde_json = { workspace = true }
# Event Bus:L1 事件总线,发布 AsaIntervention 事件通知 Parliament 干预决策(§2.2 跨层通信唯一通道)
event-bus = { workspace = true }
# WASM 沙箱后端(ADR-035 决策 2,可选):仅在 `wasm-sandbox` feature 启用时引入。
# WHY 直接版本声明而非 workspace 级:ADR-035 决策 3 明确要求避免 workspace 级孤儿声明,
#     由 seccore 自身显式声明,避免再次孤儿化(根 Cargo.toml L60 的孤儿声明已在 P1 阶段清理)。
# WHY optional:默认构建不引入 wasmtime(编译时间与体积成本),仅 PoC 与高风险场景启用。
# WHY 不设 default-features = false:wasmtime 默认 features 含 "runtime"(提供 Engine/Store/Module/
#      Instance/TypedFunc/Trap 等核心 safe API),禁用会导致类型不可用。cache 与 parallel-compilation
#      对 PoC 性能有正面作用,保留默认值。
# WHY 版本 47.0.2(2026-07-25 P3-W12.3.3 升级):原 22.0 含 16 个 RUSTSEC 漏洞(含 2 个 critical 沙箱
#      逃逸 RUSTSEC-2026-0095/0096),升级到 47.0.2 修复全部已知漏洞。API 迁移:`Instance::new` →
#      `Linker::new` + `linker.instantiate`(`Instance::new` 在 25.0+ 弃用);
#      `get_typed_func` 签名调整;`set_fuel`/`get_fuel` 保持稳定。
wasmtime = { version = "47.0.2", optional = true }

[dev-dependencies]
# criterion 基准测试框架(ASA 审计延迟基准)
# WHY async_tokio:gvisor_bench.rs 的异步基准(to_async)需要该 feature,
# 与 chimera-mas 的 criterion 配置保持一致(P3-6 gVisor benchmark 验证)
criterion = { workspace = true, features = ["async_tokio"] }
# proptest:属性测试框架,用于 ASA 不变量验证(SubTask 37.7)
proptest = { workspace = true }
# tracing-test:捕获 tracing 日志,验证 audit_and_execute / ASA 审计的 span 与结构化字段(P1-W4.1)
tracing-test = { workspace = true }

# criterion 基准测试配置:避免与单元测试冲突
[[bench]]
name = "asa_audit"
harness = false

# P3-6: gVisor execute vs 降级路径延迟对比
# 非 Linux 平台仅包含 sandbox 降级路径基准。
# 默认跳过(需 runsc 环境),运行: cargo bench -p seccore --jobs 1
[[bench]]
name = "gvisor_bench"
harness = false

# ADR-054 决策 3(P9-T4): CommandValidator trait 间接调用 vs 直接 validate_command 延迟对比
# 运行: cargo bench -p seccore --bench command_validator_bench -- --quick
[[bench]]
name = "command_validator_bench"
harness = false
