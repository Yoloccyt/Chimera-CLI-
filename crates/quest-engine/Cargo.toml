[package]
name = "quest-engine"
version.workspace = true
edition.workspace = true

[dependencies]
# nexus-core:L1 核心领域类型(UserIntent/Quest/Task/TaskStatus/ThinkingMode)
nexus-core = { workspace = true }
# nexus-contracts:L0 契约层,BudgetTier 上提后 TTG/Arbitration 的类型来源
# (ADR-054 决策 3:消除 L9→L8 生产违规边,L(N)→L(0) 恒允许)
nexus-contracts = { workspace = true }
# event-bus:L1 事件总线,跨层通信唯一通道(§2.2 依赖铁律)
event-bus = { workspace = true }
# dashmap:并发安全哈希表;读多写少场景下分片锁并发性能优于 RwLock<HashMap>
dashmap = { workspace = true }
# tokio:异步运行时,EventBus::publish 为 async
tokio = { workspace = true }
# tracing:结构化日志,记录 Quest 生命周期事件(审计追溯)
tracing = { workspace = true }
# thiserror:库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# serde:配置序列化(QuestConfig)
serde = { workspace = true, features = ["derive"] }
# serde_json:JSON 序列化,用于检查点状态持久化
serde_json = { workspace = true }
# uuid:UUIDv7 生成 quest_id(时间有序,便于因果追踪)
uuid = { workspace = true }
# chrono:时间处理(检查点 created_at 时间戳)
chrono = { workspace = true }
# rmp-serde:MessagePack 序列化(ADR-004,与 Event Bus 一致),用于检查点持久化
rmp-serde = { workspace = true }
# sha2:SHA-256 哈希,用于检查点完整性校验(防状态漂移)
sha2 = { workspace = true }
# hex:十六进制编码,将 SHA-256 字节转为可读字符串存储
hex = { workspace = true }

[dev-dependencies]
# tempfile:测试用临时文件/目录
tempfile = { workspace = true }
# repo-wiki:L5 知识沉淀,端到端集成测试需验证 Quest 结果可生成 Wiki 条目
repo-wiki = { workspace = true }
# model-router:L1 模型路由,端到端集成测试需验证 Quest 创建后可路由至执行模型
model-router = { workspace = true }
# nexus-contracts:L0 契约,同时为生产依赖(BudgetTier,ADR-054 决策 3)与
# 测试用类型来源(MCA ThinkingPreference,RoutingRequest 字段);tests/ 目录使用
nexus-contracts = { workspace = true }
# criterion:基准测试框架,用于 TTG 模式选择延迟基准(SubTask 35.6)
criterion = { workspace = true }
# proptest:属性测试框架,用于 TTG 不变量验证(SubTask 37.7)
proptest = { workspace = true }

# criterion 基准测试目标 — 对应 SubTask 35.6
[[bench]]
name = "ttg_select"
harness = false

# DAG 校验/拓扑排序基准 — L9 优化 2.1(O(V²·D)→O(V+E) 证伪与回归守护)
[[bench]]
name = "dag_bench"
harness = false

# Checkpoint save/list 基准 — L9 优化 2.5(数据关门:save<5ms 则不做增量检查点)
[[bench]]
name = "checkpoint_bench"
harness = false
