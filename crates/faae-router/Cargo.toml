[package]
name = "faae-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L0 Contracts:ToolId 共享类型(ADR-033,从本地 id_newtype! 宏切换为 L0 统一类型)
# WHY:消除与 osa-coordinator/kvbsr-router 的 ToolId 类型分裂(星型耦合消解)
nexus-contracts = { workspace = true }
# L1 Core:CLV 余弦相似度计算 + id_newtype! 宏
nexus-core = { workspace = true }
# L1 Core:EventBus 跨层通信,发布 ExpertRouted/EntropyBalanced 等事件
event-bus = { workspace = true }
# 异步运行时(RwLock/tokio::spawn 用于并发路由与后台衰减循环)
tokio = { workspace = true }
# 序列化:ExpertProfile/RoutingResult 等类型派生 Serialize/Deserialize
serde = { workspace = true, features = ["derive"] }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(路由与均衡追踪)
tracing = { workspace = true }
# 线程安全并发映射(保留以备未来高并发场景优化)
# UUIDv7 生成(事件元数据)
# 时间处理(事件元数据)
chrono = { workspace = true }
# 伪随机数生成(EDSB 概率均衡 Task 11:替换 SystemTime 纳秒伪随机)
rand = { workspace = true }
# Phase 6 §11.2: L5 四套原子算子 + ThreeFactorSelector（OperatorRouter 消费）
# WHY 合规: L6 → L5 向下依赖允许（§2.2 依赖铁律）；gsoe-evolution 不依赖任何
# L6 crate，无循环风险（ADR-049 决策 1 内嵌落点 D-2）。
gsoe-evolution = { workspace = true }

[dev-dependencies]
# 基准测试框架
criterion = { workspace = true }
# 属性测试框架
proptest = { workspace = true }
# 测试用临时文件/目录
tempfile = { workspace = true }
# 配置 JSON 反序列化兼容测试（P1-T14: 旧配置缺省字段回填验证）
serde_json = { workspace = true }

[[bench]]
name = "route"
harness = false

# W4(§11.2): 算子路由选择基准——聚合表 O(K) vs 全历史扫描对照(性能可证伪)
[[bench]]
name = "operator_select"
harness = false

# P1-T14: 批量专家评分 ComputeBridge 并行注入 — 串行 vs 并行吞吐对照（门禁 1.5×）
# WHY 独立 bench 文件: 与 route.rs（单请求端到端延迟）解耦,专注测量大批量
# 专家评分场景的 ComputeBridge Rayon 并行收益
[[bench]]
name = "faae_parallel_bench"
harness = false
