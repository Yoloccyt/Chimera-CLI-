[package]
name = "nexus-contracts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NEXUS-OMEGA L0 契约层 — 纯类型定义，零逻辑，零 crate 依赖（仅 serde 派生）"

[dependencies]
# ADR-033: nexus-contracts 禁止依赖任何 workspace crate（含 nexus-core）
# Task 3.10 扩展例外清单: serde + chrono + uuid(基础类型库,无运行时业务逻辑)
#
# 例外说明:
# - serde: 派生宏(编译期代码生成,非运行时逻辑),OmniSparseMasks/SparseMask/HarnessSpec
#   等类型需跨 crate 序列化(EventBus 传输 + TOML 反序列化)
# - chrono: DateTime<Utc> 类型,Task 3.10 下沉的 EventMetadata/Checkpoint 字段需时间戳
#   (纯类型库,无运行时业务逻辑,与 serde 同级例外)
# - uuid: Uuid 类型,Task 3.10 下沉的 EventMetadata.event_id 字段需 UUIDv7
#   (纯类型库,无运行时业务逻辑,与 serde 同级例外)
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
serde_yaml = { workspace = true }
proptest = { workspace = true }
# 测试用:统一使用 nexus-core 权威 cosine_similarity_slices,避免多副本优化不一致
# ADR-033 豁免(W8 清理记档):dev-dependencies 为测试专用豁免面(§2.2),
# 仅 vector.rs 单测与 type_consistency_test 使用,生产依赖图零污染
nexus-core = { workspace = true }
# Task 3.10: 测试用 MessagePack 序列化 roundtrip 验证(ADR-004 消息序列化协议)
rmp-serde = { workspace = true }

# ============================================================
# ADR-033: L0 nexus-contracts 契约层
#
# 设计约束(C6 治理 L1 上帝 crate):
# - 纯类型定义 + 零逻辑 + 零 crate 依赖（仅 serde 派生）
# - 依赖铁律扩展: L(N) → L(0) 恒允许
# - nexus-contracts 禁止依赖任何 crate（含 nexus-core / event-bus）
#
# 承载类型:
# - OmniSparseMasks（从 osa-coordinator 上提）+ SparseMask<T> + 5 个 ID 类型
# - HarnessSpec / ContractSpec / HopSpec（P4 Harness-as-Spec，TOML 反序列化派生）
# - TemporalMeta / TransitionType（P3 时间元数据扩展）
# - NamespaceQuota（chimera-mas 命名空间配额上提）
# ============================================================
