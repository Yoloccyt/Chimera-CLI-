[package]
name = "nexus-contracts"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NEXUS-OMEGA L0-A 契约层 facade — 纯类型 + 受控纯逻辑；外部仅 serde/chrono/uuid/thiserror，workspace 内部仅 6 个 L0-A sibling（ADR-222 D2/D4，方向单向）"

[dependencies]
# ADR-033 + ADR-222 D2/D4：本 umbrella 禁止依赖 L0-B（nexus-core / event-bus / nexus-telemetry）
# 与任何层号 >= 2 的 crate；**允许且仅允许**依赖 6 个 L0-A sibling（作 facade 重导出，
# 方向单向：sibling 不得反向依赖本 crate，否则即 crate 环）——旧口径「禁止依赖任何
# workspace crate」随 1+6 拆分订正；机器判据 = G-99（依赖白名单 + 禁用符号）+ G-125（[PURITY-LEAK]/[UPWARD]）。
# Task 3.10 扩展例外清单: serde + chrono + uuid(基础类型库,无运行时业务逻辑)
#
# 例外说明:
# - serde: 派生宏(编译期代码生成,非运行时逻辑),OmniSparseMasks/SparseMask/HarnessSpec
#   等类型需跨 crate 序列化(EventBus 传输 + TOML 反序列化)
# - chrono: DateTime<Utc> 类型,Task 3.10 下沉的 EventMetadata/Checkpoint 字段需时间戳
#   (纯类型库,无运行时业务逻辑,与 serde 同级例外)
# - uuid: Uuid 类型,Task 3.10 下沉的 EventMetadata.event_id 字段需 UUIDv7
#   (纯类型库,无运行时业务逻辑,与 serde 同级例外)
# - thiserror: 统一错误层级契约(errors.rs,A0/WI-01 §6.6)需 thiserror derive
#   (库层错误类型标准 §4.1:37 个 error.rs 全部 thiserror 先例;
#   A0 融合裁决:与 serde 同级的基础库例外,无运行时业务逻辑)
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
# L0-A sibling（ADR-222 D2）：core_domain 领域契约。umbrella 以 facade 保持旧路径；
# sibling 内部仍保留 `src/core_domain/` 目录，故 G-105/G-115 等台账键逐字不变。
nexus-contracts-core = { workspace = true }

# ADR-222 D2 sibling（umbrella 仅作 facade 汇聚，不含业务逻辑）
nexus-contracts-sparse = { workspace = true }
# ADR-222 D2 sibling（umbrella 仅作 facade 汇聚，不含业务逻辑）
nexus-contracts-safety = { workspace = true }
# ADR-222 D2 sibling（umbrella 仅作 facade 汇聚，不含业务逻辑）
nexus-contracts-seams = { workspace = true }
# ADR-222 D2 sibling（umbrella 仅作 facade 汇聚，不含业务逻辑）
nexus-contracts-mca = { workspace = true }
# ADR-222 D2 sibling（umbrella 仅作 facade 汇聚，不含业务逻辑）
nexus-contracts-memory = { workspace = true }
[dev-dependencies]
serde_json = { workspace = true }
serde_yaml = { workspace = true }
proptest = { workspace = true }
# ws2-c1: xts_top_k criterion 基准(校验 O(n) partial-sort 对比 O(n log n) 全排)
criterion = { workspace = true }
# 方向 1 契约层解环(2026-09-11):dev-dep nexus-core 已清零。
# 原唯一使用者 tests/type_consistency_test.rs::test_backward_compat_nexus_core_reexport
# 已搬迁至 nexus-core/src/types.rs::tests::reexported_types_are_identical_to_contracts,
# 并从 JSON roundtrip 弱证明升级为**编译期类型等价**证明(独立定义会直接编译失败)。
# 效果: ① L0 的 dev 依赖环消失 —— `cargo tree -p nexus-contracts -e dev` 不含任何
# workspace crate; ② `cargo test -p nexus-contracts` 不再拖入 L1 依赖树,编译成本下降。
# 若有人再次向 L0 引入 L1 及以上的 dev 依赖,请先读上述用例注释再动手:
# 契约层不应为验证实现层而反向依赖实现层。
# Task 3.10: 测试用 MessagePack 序列化 roundtrip 验证(ADR-004 消息序列化协议)
rmp-serde = { workspace = true }

# ws2-c1:xts_top_k 基准(红线 #8 Top-K 收敛对照)
[[bench]]
name = "xts_top_k"
harness = false

# 第三轮冗余审计 批 B/C:L0 共享纯函数(sigmoid / percentile_sorted)性能证据
# 含 CountingAlloc 零堆分配断言,证明收敛未引入隐式分配回退
[[bench]]
name = "util_micro"
harness = false

# ADR-217 D-36:L0 唯一生产热路径函数(SparseMask::select_top_k)的单元基线 +
# full_sort 回退对照组;dev-only 态登记(bench_inventory_freeze.txt),读数不入 SLO 三表
[[bench]]
name = "sparse_select_top_k"
harness = false

# ============================================================
# ADR-033: L0 nexus-contracts 契约层
#
# 设计约束(C6 治理 L1 上帝 crate):
# - 纯类型定义 + 受控纯逻辑；外部依赖仅 serde/chrono/uuid/thiserror，workspace 内部仅 6 个
#   L0-A sibling（ADR-222 D2/D4；旧口径「零 workspace 内部 crate 依赖」已随 1+6 拆分订正）
#   「受控」两字的判据史：原口径「零逻辑」自 ADR-033 追加节 2026-10-09 量体订正为
#   「受控纯逻辑」；符号面由 ADR-212 决策 3 的 G-99 守护，逻辑量面由 ADR-218 的 G-119
#   （scripts/l0_logic_ledger.txt 完备性对拍）守护——旧版此处写「零逻辑」属未随订正同步
# - 依赖铁律扩展: L(N) → L(0) 恒允许
# - 禁止依赖 L0-B 与层号 >= 2 的 crate（含 nexus-core / event-bus）；仅允许 6 个 L0-A sibling
#   ——旧句「禁止依赖任何 crate」在 ADR-222 拆分后与本文件自己的 [dependencies] 互斥，已订正
#
# 承载类型:
# - OmniSparseMasks（从 osa-coordinator 上提）+ SparseMask<T> + 5 个 ID 类型
# - HarnessSpec / ContractSpec / HopSpec（P4 Harness-as-Spec，TOML 反序列化派生）
# - TemporalMeta / TransitionType（P3 时间元数据扩展）
# - NamespaceQuota（chimera-mas 命名空间配额上提）
# ============================================================

# E-5 opt-in: production expects rewritten (defensive if-let / documented
# explicit panic contracts); test/bench units idiomatic allow.
[lints]
workspace = true
