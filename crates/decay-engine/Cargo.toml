[package]
name = "decay-engine"
version.workspace = true
edition.workspace = true

[dependencies]
# thiserror:库层错误类型标准(§4.1 规范:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# dashmap:并发安全哈希表;读多写少场景下分片锁并发性能优于 RwLock<HashMap>
dashmap = { workspace = true }
# tracing:结构化日志,用于记录衰减事件与冻结决策(审计追溯)
tracing = { workspace = true }
# nexus-contracts: L0 契约层（P4-W14.4 S6 接缝：DecayPolicy/DecayProfile 类型）
# WHY L4 → L0 依赖铁律合规：decay-engine 仅依赖 L0 的纯类型，不依赖 L6 omega-learner
nexus-contracts = { workspace = true }
# nexus-core: L1 Core（P1-4 衰减模型统一：共享指数衰减公式）
# WHY L4 → L1 依赖铁律合规：向下依赖，仅使用纯数学函数
nexus-core = { workspace = true }

[dev-dependencies]
# criterion:性能基准测试框架(§7.1 测试矩阵约定)
criterion = { workspace = true }
# proptest:属性测试框架,用于衰减函数单调性/有界性/连续性不变量验证
proptest = { workspace = true }

[[bench]]
name = "decay_bench"
harness = false

[[bench]]
name = "decay_compute"
harness = false