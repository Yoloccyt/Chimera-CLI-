[package]
name = "gsoe-evolution"
version.workspace = true
edition.workspace = true

# ADR-042 决策 4 + 决策 5:r2_path feature 默认关闭
# WHY 显式声明:使 `debug_assert!(!cfg!(feature = "r2_path"))` 在运行时检测可工作。
# 任何启用 `--features r2_path` 的构建会触发 debug build panic + CI 静态扫描告警。
# 解冻条件:FormalVerifier 落地 + 新 ADR 评审通过 + 影子模式 2 周验证(ADR-042 决策 3)
[features]
default = []
r2_path = []

[dependencies]
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ndarray = { workspace = true }
event-bus = { path = "../event-bus" }
nexus-core = { path = "../nexus-core" }
# P4-W15.1.2: SpecLoader 依赖
# nexus-contracts:L0 契约层(HarnessSpec 类型定义,ADR-033)
# toml:TOML 反序列化(spec 加载器解析 HarnessSpec DSL,设计文档 §7.2)
# WHY 两者新增:gsoe-evolution 需读取并校验 HarnessSpec TOML 文件
nexus-contracts = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true, features = ["async_tokio"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# P4-W15.1.2 测试:临时文件用 tempfile
tempfile = { workspace = true }

[[bench]]
name = "evolution_benchmark"
harness = false

# P5.2.5: RHI-CG 通道 B criterion 基准(3 项)
# - ci_gate_execute: CiGate 执行性能(MockCiGate + CargoCiGate INV-9 路径)
# - significance_detection: SignificanceDetector p-value 计算性能
# - spec_registry_register: SpecRegistry::register_with_source 性能(含事件发布)
[[bench]]
name = "channel_b_benchmark"
harness = false
