[package]
name = "mlc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L1 Core:使用 CLV(512-dim 潜在向量)作为语义记忆的统一表示
nexus-core = { workspace = true }
# L0 Contracts:TemporalMeta / TransitionType 时间元数据(P3-W11.1 D12 修复)
# WHY(P3-W11.1):TemporalMeta 定义在 L0 nexus-contracts,mlc-engine(L2)向下依赖符合 §2.2 铁律
nexus-contracts = { workspace = true }
# L1 Core:EventBus 跨层通信,发布 MemoryMetricsReported/MemoryTiered 事件
event-bus = { workspace = true }
# L3 ProceduralMemory 持久化(WAL 模式提升并发读写性能)
rusqlite = { workspace = true }
# L0 WorkingMemory 线程安全分片锁(支持并发读写)
dashmap = { workspace = true }
# CLV 向量运算(余弦相似度计算,通过 nexus-core 间接依赖,此处直接用于 L2)
# 序列化:条目持久化与事件 payload
serde = { workspace = true }
serde_json = { workspace = true }
# 库层错误类型标准(4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# MemoryId 为调用方供给的透明 String newtype(id_newtype!),ProceduralEntry 以 pattern_signature 为唯一键;
# 本 crate 不生成 ID、无 uuid 依赖;ExperienceCard.card_id 的「约定 UUIDv7」由消费方生成(L0 契约 doc)
# 时间戳:EpisodicMemory 时间索引、MemoryEntry 访问时间
chrono = { workspace = true }
# 异步运行时与 spawn_blocking(L3 ProceduralMemory SQLite 操作包装,避免阻塞 worker 线程)
tokio = { workspace = true }
# 结构化日志(操作追踪与调试)
tracing = { workspace = true }
# HNSW 近似最近邻(Phase 8.3:memory_graph >1K 节点建边候选生成,
# 替代 O(n²·512) 全对打分;repo-wiki HnswStore 生产先例,workspace 版本 0.3.4)
hnsw_rs = { workspace = true }

[dev-dependencies]
# 测试用临时文件/目录(跨平台安全),用于 L3 SQLite 持久化测试
tempfile = { workspace = true }
# 异步测试运行器(engine.rs 集成测试使用 #[tokio::test])
tokio = { workspace = true }
# 基准测试框架(SubTask 11.1:Week 3 复审扩展)
criterion = { workspace = true }
# 属性测试框架(SubTask 15.12:L2 recall_by_clv 分数不变量验证)
proptest = { workspace = true }
# loom:并发 permutation 模型检验（ADR-226 D1 / 业主 T-2）
# WHY 只进 dev 面：loom 只在 `--cfg loom` 的模型检验跑里拉起，不进生产二进制；
# 首次落地只覆盖 `card_system`（`Arc<Mutex<ExperienceCardSystem>>`）的锁段协议，
# 因为那是本 crate 唯一“纯同步锁 + 短临界区”的可建模面。
loom = { workspace = true }

[[bench]]
name = "l2_recall"
harness = false

[[bench]]
name = "mlc_l2_knn"
harness = false

# closure Stage C-12:记忆图谱建边规模曲线(ADR-049 决策 6,O(n·k) 验证)
[[bench]]
name = "memory_graph_edges"
harness = false

# ADR-192:L2 分层检索验收取数(10k/100k 双档 × {tiered, exact} + recall@10 质量采样)
[[bench]]
name = "hnsw_tiered"
harness = false

# R12 W2-2:量"读锁持有期间写者被阻塞"的严重性(写者 p50/p95/p99 vs 读者数 c∈{0,1,2,4,8},
# 含阳性对照与 CPU-only 混杂对照、以及"锁外快照"方案的 COW 克隆代价探针)
[[bench]]
name = "l2_lock_contention"
harness = false

# E-5 lint ratchet opt-in (docs/reports/arch-quality-deep-review-2026-09-25.md)
[lints]
workspace = true
