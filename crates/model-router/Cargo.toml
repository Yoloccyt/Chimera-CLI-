[package]
name = "model-router"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nexus-core = { workspace = true }
# L0 Contracts: MCA 通道化(ADR-065 M3)的 ProviderId/ThinkingPreference 三元组路由键
# WHY L1 → L0 合规(依赖铁律 §2.2);RouteTarget 仅用 affinity 纯类型
nexus-contracts = { workspace = true }
event-bus = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# WI-06 模型 provider 开放注册:异步 trait(带 async fn 的 ModelProvider)
# WHY workspace:async-trait 0.1 全工作区共享,天然稳定位点
# async-trait:为 trait 方法提供 async fn 支持
async-trait = { workspace = true }
# WI-06 模型 provider 热更:RCU(Read-Copy-Update)原子换表
# WHY 复用 arc-swap(event-bus 已在用):读路径 O(1) 快照、写路径无锁替换,
# 满足"hot_reload 后 <1s 生效"且配置错误时旧表不受污染;纯 safe 封装符合 forbid(unsafe)
arc-swap = { workspace = true }
# v1.3.0 S2:InMemoryHistoryStore 并发安全历史存储(model_id → HistoryRecord)
# WHY DashMap:L1 Core 工具依赖,符合 §2.2 依赖铁律;并发读写无锁,适合路由热路径
dashmap = { workspace = true }
# v1.4.0 P1:SqliteHistoryStore 持久化实现
# WHY rusqlite:SQLite 原生 Rust 绑定,bundled feature 内嵌 SQLite 不依赖系统库;
# 与 repo-wiki/scc-cache 一致,L1 Core 工具依赖,符合 §2.2 依赖铁律
rusqlite = { workspace = true }
# v1.4.0 P1:VecDeque<f32> → BLOB 序列化(MessagePack)
# WHY rmp-serde:ADR-004 已采用 MessagePack 作为消息序列化协议,此处复用一致选型;
# VecDeque<f32> 滑动窗口序列化为 BLOB 存储,反序列化时恢复 VecDeque 类型
rmp-serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 性能基准框架(Phase III-2:验证 RwLock<HashMap> 在小规模注册表下的吞吐)
criterion = { workspace = true }
# 属性测试框架 — CACR 预算检查不变量验证
proptest = { workspace = true }

# ModelRegistry 读写并发基准(SubTask III-2.3)
# harness = false:使用 criterion 自定义 main,而非默认 test harness
[[bench]]
name = "registry_bench"
harness = false

# MoE 稀疏门控路由延迟基准(Task 3 [I1]:对比 O(n) 全量 vs O(k) Top-K)
# 对比全量评估 vs Top-K 门控在 50/100/200 模型规模下的 route_auto 延迟
[[bench]]
name = "moe_bench"
harness = false

# P2-T12: Provider 热更延迟门禁基准(ArcSwap RCU 热更 <1s)
[[bench]]
name = "hot_reload_bench"
harness = false
