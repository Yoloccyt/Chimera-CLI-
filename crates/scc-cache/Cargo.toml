[package]
name = "scc-cache"
version.workspace = true
edition.workspace = true

[dependencies]
# L1 Core: nexus-core 提供 id_newtype! 宏
nexus-core = { workspace = true }
# L0 Contracts: PrefetchPolicy / PrefetchStrategy 预取策略契约（P4-W14.2 S3 接缝）
# WHY(P4-W14.2): PrefetchPolicy 定义在 L0 nexus-contracts,scc-cache(L3)向下依赖符合 §2.2 铁律
nexus-contracts = { workspace = true }
# L1 Core: EventBus 跨层通信,发布 CacheHit/CacheMiss/CachePrefetched/CacheStatsReported 事件
event-bus = { workspace = true }
# 异步运行时(预取后台任务 tokio::spawn)
tokio = { workspace = true }
# 序列化:ContextId 的 newtype 派生
serde = { workspace = true, features = ["derive"] }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(预取失败静默处理时 tracing::warn!)
tracing = { workspace = true }
# 线程安全分片锁(缓存条目并发读写)
dashmap = { workspace = true }
# UUID(EventMetadata 生成)
# 时间戳(EventMetadata 生成)
chrono = { workspace = true }
# SQLite WAL 持久化(Task 6.2:SqliteWal 真实持久化实现)
# WHY rusqlite:workspace 已收录 0.32 + bundled + chrono;
#   bundled 自动编译 SQLite,Windows 上无需系统预装;
#   内部 FFI unsafe 不传播到当前 crate(#![forbid(unsafe_code)] 仅约束本 crate 源码)
rusqlite = { workspace = true }

[dev-dependencies]
# 基准测试框架
criterion = { workspace = true }
# 属性测试框架
proptest = { workspace = true }
# 测试用临时文件/目录
tempfile = { workspace = true }
# JSON 序列化(测试用,验证 SccConfig 序列化往返)
serde_json = { workspace = true }
# SHA-256(基准测试用,cache_key_compute bench)
sha2 = { workspace = true }

[[bench]]
name = "cache_hit"
harness = false

# Week 8 Task 1.1:WAL 崩溃恢复压测基准
# 1000 次崩溃恢复无数据丢失验证 + 单次恢复延迟测量
[[bench]]
name = "wal_recovery"
harness = false

# ADR-069:语义缓存基准(查询 <50μs / 插入 <20μs / SHA-256 x2 <5μs)
[[bench]]
name = "semantic_cache_bench"
harness = false
