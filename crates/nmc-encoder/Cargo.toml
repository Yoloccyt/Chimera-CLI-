[package]
name = "nmc-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L1 Core:使用 CLV(512-dim 潜在向量)作为多模态编码的统一输出
nexus-core = { workspace = true }
# L1 Core:EventBus 跨层通信,发布 NmcEncoded 事件
event-bus = { workspace = true }
# 异步运行时(事件总线 publish_blocking 同步调用,但保留 tokio 供未来扩展)
# 序列化:配置与类型派生
serde = { workspace = true, features = ["derive"] }
# 应用层错误(集成测试场景)
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(操作追踪与调试)
tracing = { workspace = true }
# 内容哈希(SHA256,生成 CognitiveElement.content_hash)
sha2 = { workspace = true }
# tract: 纯 Rust ONNX 推理引擎，加载预训练多模态模型 (CLIP ViT-B/32, Whisper, VideoMAE)
# WHY: ImagePerceptor/VideoPerceptor/AudioPerceptor 从占位升级为语义级嵌入推理，
# ort 仅支持 MSVC 工具链，tract 为纯 Rust 实现，跨平台兼容且与 forbid(unsafe_code) 一致
tract-onnx = { workspace = true }
# 图像解码: PNG/JPEG/WebP 解码 + 缩放为模型输入尺寸 (224x224)
# WHY: 图像预处理需将原始字节解码为 RGB 像素矩阵，再缩放归一化
image = { workspace = true, features = ["png", "jpeg", "webp"] }
# ndarray: 多维数组张量，ONNX 推理输入/输出的数据载体
# WHY: ort crate 的输入/输出为 ndarray::Array，需在 nmc-encoder 中直接使用
ndarray = { workspace = true }
# 分词器: 为 TextPerceptor ONNX 推理提供 tokenizers 分词 (all-MiniLM-L6-v2)
# WHY: tokenizers 0.21 在 Rust 生态中提供高性能 SentencePiece/BPE 分词，
# 与 tract-onnx 纯 Rust 推理栈一致，支持 #![forbid(unsafe_code)]
tokenizers = "0.21"
# Mel 频谱生成: 为 Whisper encoder 计算 log-mel 频谱
# WHY: 当前 preprocess_audio 生成零填充占位张量，mel_spec 库提供纯 Rust
# Mel 频谱计算，与 #![forbid(unsafe_code)] 哲学一致
mel_spec = "0.4"
# WAV 音频解码: 解析 WAV 文件头部与 PCM 数据
# WHY: 当前 preprocess_audio 无法生成非零 Mel 频谱，需要 hound 解码
# WAV 文件为 f32 PCM 数据
hound = "3.5"

[dev-dependencies]
# 属性测试框架(嵌入不变量验证)
proptest = { workspace = true }
# 基准测试框架(文本编码延迟 p95 ≤ 30ms 验收)
criterion = { workspace = true }

[[bench]]
name = "encoding_benchmark"
harness = false

# P1-T14: 批量编码 ComputeBridge 并行注入对照基准（串行 vs 并行,单行采样模式）
[[bench]]
name = "parallel_encoding"
harness = false
