[package]
name = "pvl-layer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# L1 Core:提供 id_newtype! 宏(生成 OperationId newtype)
nexus-core = { workspace = true }
# L1 Core:跨层通信唯一通道,发布 OperationProduced/PredictionVerified/ProducerStrategyAdjusted 事件
event-bus = { workspace = true }
# 异步运行时:tokio::sync::mpsc 通道(Producer→Verifier→Feedback 单向流)
tokio = { workspace = true }
# 配置与类型序列化(#[derive(Serialize, Deserialize)])
serde = { workspace = true, features = ["derive"] }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = { workspace = true }
# 结构化日志(事件发布失败告警)
tracing = { workspace = true }
# UUIDv7 操作 ID 生成(时间有序,便于追溯)
# 时间戳(事件元数据)
# 内容哈希(置信度评分占位实现:基于内容哈希计算置信度)
sha2 = { workspace = true }
# 动态黑名单:集成 SecCore 运行时黑名单,替代静态关键词列表
# Phase 7 D-3: seccore 从 optional 转正式依赖(L7→L4 向下合规,无环已核验)——
# 经验卡片生成复用 ExecutionFeedbackIntegrator::classify(铁律8 六类状态单一来源)
# 与 compute_error_hash(铁律7 错误签名哈希单一来源)。
seccore = { workspace = true }
# Phase 7 §12.1: L0 契约类型正式依赖(ExperienceCard/ExecutionStatus/ErrorSignature
# 等,此前仅 dev-dep);L7→L0 向下依赖恒允许(ADR-033)
nexus-contracts = { workspace = true }
# Phase 7 §12.1: ExperienceCard.created_at 为 DateTime<Utc>
chrono = { workspace = true }

[features]
# 动态黑名单:启用后通过 SecCore 策略引擎获取运行时更新的危险命令黑名单
# Phase 7: seccore 已转正式依赖,本 feature 退化为纯 cfg 开关(空声明,
# 保留以兼容既有 #[cfg(feature = "dynamic-blacklist")] 代码路径)
dynamic-blacklist = []

[dev-dependencies]
# 性能基准框架(SubTask 25.6)
# WHY async_tokio:启用 `Bencher::to_async` 方法,支持异步基准测试
criterion = { workspace = true, features = ["async_tokio"] }
# 属性测试框架(SubTask 25.5)
proptest = { workspace = true }
# tokio 测试工具
tokio-test = { workspace = true }
# JSON 序列化测试(config.rs serde 往返测试)
serde_json = { workspace = true }
# P9-T2: 测试等待缩放工具(CHIMERA_TEST_TIMEOUT_SCALE 协议)
# Phase 7: nexus-contracts 已提升为正式依赖(dev-dep 条目保留供测试目标直接使用)
nexus-contracts = { workspace = true }

# 性能基准配置:harness=false 以使用 criterion 自定义 main
[[bench]]
name = "produce_verify"
harness = false

# Milestone D-2e:GTPO + RLVR 基准(性能可证伪)
[[bench]]
name = "gtpo_rlvr_bench"
harness = false
