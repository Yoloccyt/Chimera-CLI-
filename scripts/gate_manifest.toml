note = "audit.yml / agents.md / CLAUDE.md 三处 cargo audit 口径逐字等价；缺文件退 2"
ci_exempt = "收口审计项:audit.yml/agents.md/CLAUDE.md 三处 cargo audit 口径一致性,收口时跑,非 PR 快轨"

[[gate]]
id = "G-07"
