# Phase R 收口判据清单（单一真值源）
#
# WHY：本波次多次出现"判据写在 A 文档、跑法写在 B 文档、实际跑的是 C"的三源分裂，
# 而且我自己就因手工重述漏跑过（clippy 在 Cargo.lock 变更后没重跑，靠复扫才发现）。
# 因此"收口要跑哪些命令"必须有唯一登记处：本文件。
#
# 字段：
#   id          判据编号（closure / checklist 引用它，不复制命令）
#   spec_ref    对应 Spec 条目（用于完成度审计反查）
#   cmd         实际命令（相对仓库根；用 {python} 占位当前解释器）
#   expect      期望退出码（0=绿；1=按设计为红，例如未提交前的耦合审计）
#   kind        light（秒级，可随手跑） | heavy（需编译/长时间，跑前查磁盘）
#   disk_gb     heavy 项要求的最低 D 盘空闲 GB（低于则跳过并判"不可判定"，不判通过）
#   needs       前置门 id 列表（v2 字段）。它只买得到两件事：planner.toposort 的
#               **入列顺序**，以及"声明了 needs 的计划拒绝 --shard 切分"。
#               它**不是互斥锁**：jobs>1 时执行环把 pending 整批 submit 进线程池，
#               全程不读 needs ⇒ 被依赖者与依赖者可以同时在跑。实测锁见
#               scripts/govd/tests/test_govd.py::NeedsSemanticsTests
#               （jobs=2 断言区间重叠；jobs=1 作阳性对照断言不重叠，
#               否则"重叠"可能只是仪器分辨不出串行的空转）。
#               因此"给 cargo 类 heavy 门彼此加 needs 以免互踩包锁"是无效缓解 ——
#               那条互斥本来就由 cargo 自己的 target-dir 锁提供（后来者等待而非损坏）。
#   test_kind   评测生命周期标注（v2.3 §(b.6)，与 39 分层对齐，渐进回写）：
#               crate_unit（单 crate 内单测门）| cross_crate（跨 crate 集成/静态审计门）。
#               缺省视为未标注（不判红）；新增/改动门应就近标齐。run_gate_manifest.py
#               仅校验 REQUIRED 六字段,本字段为**只增不改**的治理元数据（向后兼容）。
#   note        一句话说明它证明什么
#
# 纪律：新增判据必须同时写 spec_ref 与 note；漏 spec_ref 会被 run_gate_manifest.py 判红。

[[gate]]
id = "G-01"
