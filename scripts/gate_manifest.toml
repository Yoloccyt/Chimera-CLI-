expect = 0
kind = "light"
note = "已跟踪执行体引用未跟踪文件的全集；在途批次已于 c5a5327 落地→耦合消解，按'各批落地后应归 0'从 1 翻为 0；若再现新未跟踪引用则重新变红（2026-09-21 F32 批次即属此类：run_gate_manifest.py 新增 import gate_rc，消解条件＝同 commit 内 git add scripts/gate_rc.py）"
