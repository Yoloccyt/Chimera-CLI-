[[gate]]
id = "G-113"
spec_ref = "ADR-213 决策 R8.2（Class B 字段序冻结 + 只增尾必带默认）+ 决策 R9（位置式禁增 default+skip 字段）"
cmd = "{python} scripts/check_positional_field_order_freeze.py"
expect = 0
kind = "light"
test_kind = "cross_crate"
note = "输入面 crates/*/src/**/*.rs（风险非 L0 局部：envelope 声明在 L0、落盘写在 L3/L9/L10），注释与字符串经 G-99 同一词法器 blank、#[cfg(test)] 尾经同一 test_tail_mask 遮蔽——**import 复用而非手抄**，两份「什么算生产码」正是 G-45/G-46 要治理的漂移病灶。四类判定：NEW（无行的位置式写点）/ STALE（行在点没了，含 EXEMPT 的僵尸豁免＝台账说谎）/ ORDER_DRIFT（实字段序≠冻结序且非纯尾部追加，即静默互换形态）/ UNREGISTERED_TAIL_APPEND·NO_DEFAULT_ON_APPEND·R9_SKIP_ON_ARRAY（尾部追加是许可的生长形状但须同批重发该行；追加字段缺 default 会响亮破坏旧 blob；新增 default+skip 在 array 下把非跳过值挤进被跳过邻字段位，邻字段同类型则静默错值）。键用 <文件>::<所在 fn> 而非行号：W3 物理搬移实测使全部 L0 行号漂移，行锚一搬整台账假红。**与 G-109 联动不可省**：src_module_reachability_freeze.txt 内文件的站点入 ORPHAN-EXCLUDED（不记账但打印计数），该文件一旦接线即离开 G-109 台账、落入本门面判 NEW——不做联动，接线当天就是静默漏判窗口。退码：0 干净 / 1 违规 / 2 不可判定（台账行畸形·未知键·证据<24 字符·重复 site·类型查无或多文件未 pin in=·非具名字段结构元组/枚举不可判形·扫描面低于 FLOOR 600），rc=2 一律 [TOOL-ERROR] 绝不 [FAIL]（G-44 曾因此判红 5 条 C4）。**诚实边界**：「该站点参数属于该类型」由行断言、仅以 pin 的 arg= 文本做机械反证（Rust 类型推断不在本门范围）；枚举变体序同样具位置意义，本门**不判**且不得称已覆盖。现取实况（2026-10-14，走 799 文件）：生产位置式写点恰 2 处——quest-engine/src/wal.rs::append_entry 属 G-109 孤儿被排除、chimera-tui/src/popup.rs::event_detail 经取证判 EXEMPT（:249 编码的字节在 :263 同函数内即被解回、只经 hex_string() 渲染上屏，payload_raw 无其它消费点且 popup.rs 全文无 fs/write/save，被编码物是 serde_json::Value 本无声明序可冻）。⇒ ADR-213 R8.1 的 Class B 现存 **0 员**，本门是**新增准入**而非存量清算。真树反事实：撤该行 EXEMPT ⇒ NEW 红 rc=1，还原 ⇒ rc=0 且 cmp 证台账逐字节相同；本地实测 0.70s。"

