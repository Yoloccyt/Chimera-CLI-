spec_ref = "ADR-214 决策 3（D-22：`#[non_exhaustive]` 与 wire 字段序正交；per-type 开放/封闭政策须变机器锁）"
cmd = "{python} scripts/check_l0_surface.py extensibility"
expect = 0
kind = "light"
test_kind = "cross_crate"
group = "l0-contract"
concurrency = 8
resource = "io"
note = "L0 公共类型可扩展性分级台账。补的洞有量纲性：实测 nexus-contracts 有 103 `pub enum` + 124 `pub struct`（门自报 227 生产面；未 blank 未遮尾的裸 grep 报 228，多的那个是 `vector_math/vector.rs:342 InMemoryVectorStore` 落在 cfg(test) 尾内）且 `#[non_exhaustive]` **命中 0** ⇒ 今天每个公共类型都是封闭的，新增任一变体/字段对 30+ 消费 crate 都是源码级破坏（`ExperienceCard` 61 处外部字面量、上一波漏跑 `--all-targets` 才暴露的 E0063 是同一敞口的两次显形）。**为何不是无脑加标**：本仓在承重位置刻意反着用它——`event-bus/src/registry.rs` 的 `define_event_registry!` 展开 5 个无通配 match，正是靠「新增变体必须被每个消费方处理」当安全属性；裁决类（verdict/failure/severity/strategy）保留封闭才对，展示/格式/词表类才适合开放。于是政策落成语义锁：`class=open ⇔ 带属性`、`class=closed ⇔ 不带属性`——**开一个类型必须同批做两件事**（翻行 + 加属性 + ≥24 字符理由），只做一半即 CLASS_MISMATCH 红；单加属性是「静默摘掉下游强制处理」，单翻行是「台账说谎」，两者都是本仓反复被咬的形态。新增公共类型无行⇒NEW 红；类型搬移/消失而行不撤⇒STALE 红（W3 式物理搬移须同批改键）。行畸形 / class 取值非法 / open 缺理由 / 重复行 / 抽取数<`TYPES_FLOOR(150)` ⇒ 退 2 不可判定，且 **floor 守卫刻意排在 `--emit` 之前**：致盲的解析器不得把自己的致盲写成一份「干净」基线（那等于把致盲洗白进台账）。现取基线：227 行全 closed（与「属性命中 0」的实况同构，emit 派生故首跑即自洽）——本门不新增任何决定，它把一个从未被显式声明的默认值变成可评审、可回退的登记，使第一次「开放某类型」成为有人签字的动作而非副产物。待开短名单（21 个零提及 enum + 64 个无外部字面量 struct）与其反面论证记于 ADR-214 D-22；其中范围教训值得留档：首轮只扫 `crates/*/src` 得 22 个候选，实测 `VerificationMethod` 在根 `tests/e2e` 三个文件里被匹配 ⇒ 下游面**必须含根 tests/**，否则候选集偏松、照它加标会在 e2e 的穷尽匹配处编译断裂。**ADR-218 追加 CLAIM 轴**：本台账头注曾长期自称「all 227 rows are closed, because L0 measures ZERO #[non_exhaustive] today」，而实测 16 个 src 文件带该属性、56 行为 open——散文比使它成立的那个动作活得更久，且当时无任何门覆盖头注。现改为一行机器核验的 `# CLAIM types=NNN listed=NNN open=N closed=N`，每次由实况+行集重算比对：缺行⇒退 2（不肯描述自己的台账无法审它是否说谎）、不符⇒CLAIM 红、出现第二行⇒malformed（一份台账两副自述）。本门由此从「修一处漂移」升级为「让这类漂移没有生存空间」，并与 G-119 的 CLAIM 形态共用同一约定。"

