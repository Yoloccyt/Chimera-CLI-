# 持锁跨 await 门（架构重构方向 2）。先 --selftest 证明门有牙（构造性违规必报、
# 三类假阳性必抑制），再跑真实裁决，沿 check_topk_registry / coverage_gate 先例。
# WHY 必须成对登记：初版扫描器（粗糙正则）曾把 .write().await / spawn_blocking 闭包
# 内 lock / 从锁里取出的值 全判为缺陷，照单全修会破坏 IO 帧原子性与 rusqlite 红线。
# selftest 就是这条教训的固化——门必须先证明自己不会误报，才配拦人。
[[gate]]
id = "G-26"
spec_ref = "架构重构方向 2 / 持锁跨 await"
cmd = "{python} scripts/check_await_across_guard.py --selftest"
expect = 0
kind = "light"
note = "持锁跨 await 门有牙齿（1 构造性违规必报；块作用域/spawn_blocking 闭包/取锁 await 三类假阳性必抑制）"

[[gate]]
id = "G-27"
spec_ref = "架构重构方向 2 / 持锁跨 await"
cmd = "{python} scripts/check_await_across_guard.py"
expect = 0
kind = "light"
note = "生产代码零持锁跨 await（豁免经人工复核登记于 await_guard_allowlist.txt；失效条目必红，豁免不得比代码活得更久）"

