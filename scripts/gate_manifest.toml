# Phase R 收口判据清单（单一真值源）
#
# WHY：本波次多次出现"判据写在 A 文档、跑法写在 B 文档、实际跑的是 C"的三源分裂，
# 而且我自己就因手工重述漏跑过（clippy 在 Cargo.lock 变更后没重跑，靠复扫才发现）。
# 因此"收口要跑哪些命令"必须有唯一登记处：本文件。
#
# 字段：
#   id          判据编号（closure / checklist 引用它，不复制命令）
#   spec_ref    对应 Spec 条目（用于完成度审计反查）
#   cmd         实际命令（相对仓库根；用 {python} 占位当前解释器）
#   expect      期望退出码（0=绿；1=按设计为红，例如未提交前的耦合审计）
#   kind        light（秒级，可随手跑） | heavy（需编译/长时间，跑前查磁盘）
#   disk_gb     heavy 项要求的最低 D 盘空闲 GB（低于则跳过并判"不可判定"，不判通过）
#   note        一句话说明它证明什么
#
# 纪律：新增判据必须同时写 spec_ref 与 note；漏 spec_ref 会被 run_gate_manifest.py 判红。

[[gate]]
id = "G-01"
spec_ref = "R1-T4 / T5"
cmd = "{python} scripts/check_perf_redlines.py --selftest"
expect = 0
kind = "light"
note = "性能红线门有牙齿（未登记必红/幽灵登记必红/收紧未删债必红）；断言条数由门自报, 台账不写死。入口契约亦在断言面内：未知旗标/用法/崩溃三态由 F18+F29+F30 锁定, rc 只承载 0/1/2 不承载计数"
ci_exempt = "CI 经 check_perf_redlines.sh(G-03, ci.yml Perf redline step)执行等价判据;.py 直调为本地/收口形式"

[[gate]]
id = "G-02"
spec_ref = "R1-T4 / P0-A / T5"
cmd = "{python} scripts/check_perf_redlines.py --static-only"
expect = 0
kind = "light"
note = "lint + inventory + invariants + ignored 全静态面（ci.yml 阻塞步的本地等价）"
ci_exempt = "同 G-01:--static-only 的 CI 形态是 .sh 包装(G-03),.py 直调为本地收口形式"

[[gate]]
id = "G-03"
spec_ref = "P0-A"
cmd = "bash scripts/check_perf_redlines.sh --static-only"
expect = 0
kind = "light"
note = "Linux 侧薄包装可用（shebang/编码合规的运行时证据，非仅静态检查）"

[[gate]]
id = "G-04"
spec_ref = "R1-T3 / T11"
cmd = "pwsh -NoProfile -File scripts/check_doc_consistency.ps1"
expect = 0
kind = "light"
note = "文档一致性权威执行体（自报 6 categories / N check ids，含 D3/D4/D5）"
ci_exempt = "CI 经 check_doc_consistency.sh(G-05)执行;.ps1 是 Windows 权威执行体,CI(Linux)无 pwsh,故本机/收口跑"

[[gate]]
id = "G-05"
spec_ref = "R1-T3 / ADR-166"
cmd = "bash scripts/check_doc_consistency.sh"
expect = 0
kind = "light"
note = "CI 兼容性冒烟面（自报 id 数显著少于 .ps1，正是 ADR-166 的论断）"

[[gate]]
