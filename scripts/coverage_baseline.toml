# 行覆盖率水位（`.github/workflows/coverage.yml` 消费本文件，不在 workflow 里写死数字）。
#
# 语义：
#   min_line_coverage    —— cargo tarpaulin `--fail-under` 的实际门槛，低于即 CI 红。
#   target_line_coverage —— 治理目标（OMEGA 覆盖率基线），达到后 min 与 target 应相等。
#
# 棘轮纪律：min_line_coverage **只升不降**。
#   2026-09-01 建立本文件时，全库尚无一次"阈值真正生效"的测量（旧 coverage.yml 有
#   --fail-under 85 但 job 级 continue-on-error: true，结论被丢弃 ⇒ 见 RK-P45）。
#   因此 50 是**首跑校准前的临时下界**，不是实测值；第一次 Coverage 跑完后必须把
#   min 抬到实测值附近（留 3-5 个百分点缓冲）并在 RK-P 登记上调，禁止长期停在 50。
min_line_coverage = 50
target_line_coverage = 85
