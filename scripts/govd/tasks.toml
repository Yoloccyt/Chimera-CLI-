# Non-gate task families for govd (ADR-228 §3.2).
# These rows are NOT gates: they never appear in gate_manifest.toml. `release`
# merges every family; the other lanes merge only the `external` rows that name
# them in `profiles`, so the pr ledger keeps meaning "135 light + 7 heavy".
# `source` is one of gate|rust|external|diagnostic (G-138 enforces it).

[[task]]
id = "R-01"
profiles = ["release"]
spec_ref = "ADR-228 §3.2 rust 只读族"
cmd = "cargo fmt --all -- --check"
expect = 0
kind = "light"
source = "rust"
timeout_s = 300
owner = "rust-owners"
note = "格式只读门：cargo fmt --check 只读不写；release 前置。与 CI 的 fmt 步骤同判据，但由 govd 记录 rc/时长/日志。宿主限制（2026-10-29 实测）：在 Windows 长路径环境下 `cargo fmt --all` 不执行任何检查即中断（输出 `os error 206` + 用法横幅）并以 rc=1 退出——与“rustfmt 发现差异”的红码相同；classify.py 已把该形状归为环境失败（退 2，不记 mismatch），所以本任务的红判据只在其能真正执行的档（Linux CI）上才有意义。仓内另有 G-19 逐包 rustfmt 检查作为本机可用替代品。"

[[task]]
id = "R-02"
profiles = ["release"]
spec_ref = "ADR-228 §3.2 rust 只读族"
cmd = "cargo metadata --no-deps --format-version 1"
expect = 0
kind = "light"
source = "rust"
timeout_s = 120
owner = "rust-owners"
note = "workspace 元数据可解析性：只读、不编译；用于在 release 前证明 Cargo.toml 图能被工具链消费。"

[[task]]
id = "R-03"
profiles = ["release"]
spec_ref = "ADR-228 §3.2 rust 只读族（编译类仍归 CI）"
cmd = "cargo check --workspace --all-targets"
expect = 0
kind = "heavy"
source = "rust"
timeout_s = 1800
disk_gb = 8
owner = "rust-owners"
note = "全 workspace 类型检查。本地磁盘 <8GB 时 govd 记 UNKNOWN 而不静默跳过；权威载体是 CI，release 机器足够磁盘时才真正执行。"
[[task]]
id = "E-01"
profiles = ["nightly", "release"]
spec_ref = "ADR-228 §3.2 external（Aegis 套件）/ Spec I9"
cmd = "{python} -m unittest discover -s Aegis/tests/helpers -p \"test_aegis_[d]*.py\""
expect = 0
kind = "light"
source = "external"
timeout_s = 600
owner = "aegis-owners"
note = "Aegis 脚本单测（aegis-deferred-ledger + aegis-doctor）：实测 Ran 11 tests / rc 0（2026-10-29）。原写法 discover Aegis/tests 因 tests/helpers 不是包而只跑 0 tests + rc 0，是假绿，已改。"

[[task]]
id = "E-02"
profiles = ["nightly", "release"]
spec_ref = "ADR-228 §3.2 external（Aegis 套件）/ Spec I9"
cmd = "{python} -m unittest discover -s Aegis/tests/helpers -p \"test_workspace_*.py\""
expect = 0
kind = "light"
source = "external"
timeout_s = 600
owner = "aegis-owners"
note = "workspace 证据收敛 + 文本写入兼容：实测 rc 0（2026-10-29）。"

[[task]]
id = "E-03"
profiles = ["nightly", "release"]
spec_ref = "ADR-228 §3.2 external（Aegis 套件）/ Spec I9"
cmd = "{python} -m unittest discover -s Aegis/tests/helpers -p \"test_*.py\""
expect = 0
kind = "light"
source = "external"
timeout_s = 900
owner = "aegis-owners"
note = "全量 helpers 套件：实测 Ran 129 tests / OK (skipped=6) / rc 0（2026-10-29，py3.11 + Windows）。6 个 skip 是 benchmark 族的模块级 SkipTest（fcntl/resource//proc/PR_SET_CHILD_SUBREAPER 为 POSIX-only，Linux CI 仍全量跑）。原 2 failures 已修（is_junction 的 3.11 reparse-tag 回退、注册表单比较 canonical 形式）；原 1 error 已修（copilot-session-start.ps1 钉 UTF-8 输出 + 测试钉 encoding/errors）；原 1 error 是 `tests.helpers` 不是包导致的永久 ImportError，已按同目录写法改 top-level import。方向：expect=0 是棘轮——Aegis 侧任何回归立刻变红，不再把已知红冻结为期望。"

[[task]]
id = "D-01"
profiles = ["release"]
spec_ref = "L1-B-4（零装配面登记门的诊断侧登记）"
cmd = "{python} scripts/check_l1_dead_surface.py"
expect = 0
kind = "light"
source = "diagnostic"
timeout_s = 300
owner = "governance"
note = "零装配面登记门的**诊断侧**登记（L1-B 波次，2026-11-16）。本脚本的正式门身份在 gate_manifest.toml 的 G-161/G-162（一条正式门 + 一条 --selftest 自测门）；本行只把同一脚本登记进 govd 的工具台账，使 `govd list` / 收口报告能看到它在本仓的位置，并让脚本在 release 车道有一个确定的执行归属。判据来源：L0-B 四个核心基础面（event-bus / nexus-core / nexus-compute / nexus-telemetry）的 pub 项零生产装配清单，与 scripts/l1_dead_surface_freeze.txt 双向对账；纯静态只读（零 cargo、零编译），实测 1.8s。"

[[task]]
id = "D-02"
profiles = ["release"]
spec_ref = "ADR-322 compat-2x 移除前置（v2.31.0-omega 下游事件导入机械迁移）"
cmd = "{python} scripts/migrate_l1_event_imports.py --check"
expect = 1
kind = "light"
source = "diagnostic"
timeout_s = 300
owner = "governance"
note = "事件导入迁移盘的**诊断侧**登记（ADR-322 波次，2026-11-18）。正式门身份在 gate_manifest.toml 的 G-163（--check，expect=1 表示 compat-2x 移除前按设计恒红）与 G-164（--selftest）；本行只把同一脚本登记进 govd 工具台账，使 `govd list` 与收口报告能看到它。判据：以 crates/nexus-events/src/** 的公开面为符号归属单一事实源，扫 crates/*/src/**（排除 event-bus / nexus-events 自身与 #[cfg(test)] mod X; 外部测试文件）里 `use event_bus::<事件符号>` 的待改项。纯静态只读，不执行 --apply。"
