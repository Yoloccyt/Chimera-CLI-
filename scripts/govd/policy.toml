[profiles.pr]
include_heavy = false
jobs = 4
allow_mutating = false

[profiles.nightly]
include_heavy = true
jobs = 2
allow_mutating = false

[profiles.release]
include_heavy = true
jobs = 1
allow_mutating = true

[profiles.local]
include_heavy = false
jobs = 1
allow_mutating = false

[exec]
whitelist = ["{python}", "bash", "pwsh", "cargo", "git"]
default_timeout_s = 300
heavy_timeout_s = 1800
env_retry = 1
mutating_prefixes = ["tmp/", "target/"]
# ADR-318 工具链批 TL-W3c：cargo 门的应用层互斥开关。与 .cargo/config.toml
# 的 jobs = 4 互补 —— target-dir 文件锁只能挡同 target/ 的并发，挡不住 4 个门
# 各自拉起 4 个 rustc 的内存峰值叠加（15.2GB 宿主内存墙前科：诊断报告 16 并发→0GB）。
# true ⇒ executor 对所有 argv[0] 基名为 cargo 的门加进程级 Semaphore(1)。
# 显式 false 即整体回滚到「只靠文件锁隐式等待」的旧行为。
cargo_semaphore = true

[roles.local-dev]
profiles = ["pr", "nightly", "release", "local"]

[roles.ci]
profiles = ["pr", "nightly"]

[roles.release-manager]
profiles = ["release"]

