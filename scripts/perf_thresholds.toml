# Chimera CLI bench 阈值与 CI 清单单一真值源
#
# 权威消费者：scripts/check_perf_redlines.py；
# 迁移来源：bench_check.yml THRESHOLDS_NS / PATH_KEYWORDS / run_bench 行（2026-08-31 机械抽取）。
#
# 【2026-11-11 T4 订正】历史上（2026-10-26 R2，登记册 L51/M65）本表曾是「第二份表」：
# bench_check.yml 自带 THRESHOLDS_NS heredoc，check_perf_redlines.py 的 thresholds
# 模式无 workflow 调用，两表差集静默存在（R2 M44：本表有 hnsw_tiered 而 heredoc 无）。
# 该缺陷已被机器门根修：I9（heredoc THRESHOLDS_NS 键集 == 本表 [thresholds_ns] 键集，
# 严格相等）与 I10（PATH_KEYWORDS 同构对拍）已实现并于 CI --static-only 跑
# （check_perf_redlines.py:359-376；R2 M44 由 I9 根修、N-3 幽灵门残留由 I10 根修）。
# ⇒ 本表现在是受机器对拍保护的双写面：改一处必须同批改另一处，否则 I9/I10 判红。
# 键数以门自报为准（当前 85 keys，不用 awk 逐节计数）。残余缺口 M3：键集相等有门，
# 但「值」一致性由 compare 模式承担而该模式未接任何 workflow ⇒ 值漂移仍无门（待裁决）。
#
# 不变式（由 py 核 --selftest 与常规模式共同断言）：
#   I1 set(thresholds_ns) == set(path_keywords)
#   I2 任意两个关键词互不为子串（防匹配串台，根除 F-R4-04）
#   I3 state==registered 的 (crate,bench) 与 run_bench 行双向等价
#   I4 100ms 兜底条数只减不增（棘轮，见 [ratchet]）

[thresholds_ns]
exit_code_matrix = 10000
diff_engine_bench = 100000
wal_recovery = 100000000
degradation_chain = 1000
render_bench = 16000000
streaming_single_token = 500000
streaming_ttfb = 1000000
streaming_feed = 5000000
dag = 5000000
gea_cache = 500000
scheduler_dequeue = 50000
dedup = 120000000
checkpoint = 15000000
shadow_stats = 50000000
resolve_conflicts = 200000
# ===== C6 校准（2026-09-04）=====
# 以下 18 键由本地 Windows GNU 全量实测收紧(median + 分级余量:ns 级约 x10、
# us 级约 x3-8、ms 级约 x2-2.5,与 sigmoid 33ns→500ns 先例同原则);数据与
# 推导见 docs/reports/c6-kpi-threshold-calibration-report-2026-09-04.md。
# gather 本地 median 305ms 为离群值(5 severe outliers,CI 侧 <100ms 通过)
# 数据不可信 → 保留 100ms 兜底,为 calibration_pending 唯一存活项,待 CI
# 首跑实测收紧。
config_concurrency = 3000000
writer_ansi = 200000
v3_pipeline = 5000000
reduce_bench = 2500000
session_store = 2500000
cross_layer = 100000
hybrid_search = 20000000
debate = 100000
l2_recall = 5000000
compress = 50000
compute_masks = 1500000
delegation = 40000000
# ===== 工具链并行化重构（ADR-239）新增 =====
# 数据来源：本机 Windows GNU 全量实测 median（2026-11-06，criterion sample_size
# 50/30/20 视 bench 而定）。余量按本表既有分级原则：ns 级 ×10、us 级 ×3-8、
# ms 级 ×2-2.5。推导与归因公式见 docs/architecture/ADR-239-*.md。
#
# 【归因锚点】四环链分层归因（dispatch_layers/dispatch_chain）给出各环成本：
#   传输地板 floor_echo_transport  = 58 ns
#   策略层   policy_evaluate_allow = 465 ns  （链级残差 539-58=481ns，吻合）
#   沙箱层   sandbox_check_seccore = 1179 ns （链级残差 1698-539=1159ns，吻合）
# 两组独立测点互相印证 ⇒ 阈值按链级端到端值设，另设分层测点做交叉守护。
#
# WHY 键名不含公共子串：不变式 I2 要求任意两关键词互不为子串，否则
# first-match-wins 会把长路径误归给短键（`cache_hit` 污染先例）。
# 故用 `dispatch_` / `dchain_` / `tbatch_` / `trchain_` 四个互不包含的前缀族。
#
# —— 分层归因（单点，微基准）——
# 传输地板：链的地板（一次 boxed future 分配 + Arc 解引用）
dispatch_floor_echo = 1000
# 策略层：ExecPolicy::evaluate 纯同步规则匹配（Allow 路径）
dispatch_policy_eval = 10000
# 沙箱层（当前实现，派生策略记忆化命中）
dispatch_sandbox_cached = 20000
# 沙箱层（旧实现对照组，逐次 clone 策略）—— 保留以防缓存被静默移除
dispatch_sandbox_uncached = 60000
# —— 链级端到端 ——
# AllowAll 沙箱 + 路由命中：策略 + 路由 + 传输的地板路径
dchain_allowall_hit = 10000
# Seccore 沙箱 + 路由命中：真实安全路径的端到端
dchain_seccore_hit = 40000
# Seccore 沙箱 + 路由命中（旧沙箱门对照组）
dchain_seccore_legacy = 80000
# 拒绝路径：短路必须比放行路径更快（fail-closed 的性能特征）
dchain_policy_deny = 2000
dchain_sandbox_deny = 12000
dchain_route_miss = 12000
# —— 工具运行时链（独立 bench，端到端 allow 路径）——
trchain_allow_echo = 20000
# —— 批量派发（串行 vs 有界并行）——
# 零延迟派发（纯开销）：64 条请求串行 ≈ 146µs，并行 ≈ 165µs
# WHY 并行略慢是预期：零延迟场景下并行无收益可摊，仅有调度开销；
# 该键锁定的是「并行开销不失控」，不是「并行更快」。
tbatch_serial_zero = 1000000
tbatch_parallel_zero = 2000000
# 含 1ms 模拟延迟（真实 I/O 场景）：64 条串行 ≈ 493ms，并行（bound 8）≈ 112ms
# WHY 这两条是并行化的**核心收益判据**：4.4× 加速来自有界并发的真实摊薄。
tbatch_serial_slow = 1200000000
tbatch_parallel_slow = 400000000
# —— PlanRunner 分层串/并发（toolplan_layers bench，ADR-252）——
# 8 个只读 ToolCall 同层，每节点 sleep 2ms；declared = 计划显式写
# side_effect:"read_only"，undeclared = 字段缺省 None。
# 2026-11-06 本机 median（改前上界时代）：
#   declared   c1 69.086ms / c8 14.901ms  ⇒ 显式声明时并发真生效（4.6×）
#   undeclared c1 69.814ms / c8 63.804ms  ⇒ 未声明时 c8 ≈ c1，整层仍串行
# 2026-11-08 X2-N1 收紧（bench 执行器补 capability_of/declared_tools 后，
# deepdive §5.3/§5.4 九步程序；改前基线 = tmp/x1_criterion_backup/
# toolplan_layers_pre_x3，装回作 base 实测首轮 undeclared c8 −79.5%）：
#   第二轮 undeclared c8 mean=12.585ms / median=13.220ms ≈ readonly c8
#   mean 13.234ms（比值 0.95——ADR-252 D3「≈readonly8/8」预言兑现）；
#   new = ceil(12.585×2.5)=31.46 → 1ms 粒度 = 32ms（< 160ms 棘轮护栏 ✓，
#   收紧 5×）。测量态=提交态；日志 tmp/x2_bench_toolplan.log。
# /1 组（c1 107ms）本机负载敏感，仅作端到端对照不设阈值（c8/c1 ≥4× 判据
# 由本轮 8.5× 实证）。
tplan_declared_serial = 175000000
tplan_declared_parallel = 38000000
tplan_undeclared_serial = 175000000
tplan_undeclared_parallel = 32000000
# —— 混层写屏障分段（toolplan_layers bench，ADR-281/T1）——
# mixed7r1w_ms2/8（7 读+末尾 1 写，写屏障分段并发）。阈值 = 重测 median × 2.5
# 向上取整到 ms 粒度（:115 惯例）。2026-11-11 重测两次 c8 median 30.899/31.091ms
# （工单首轮 21.777ms，偏差 +42% > 20% ⇒ 按 T1 步骤1 用新 median 重算）；
# ceil(31.091×2.5)=77.73 → 78ms（< 160ms 棘轮护栏 ✓）。c8 负载敏感（CI 宽），
# 取较高 median 防 runner 假红；/1 组（c1 ~124ms）负载敏感不设阈值（:117 惯例）。
# 防回退判据：退回整层串行 c8≈c1≈124ms > 78ms 即红。
tplan_mixed_parallel = 78000000
# —— seccore 判决体（policy_eval bench，ADR-260/工程工单 A-3）——
# opt 臂 = 生产 ExecPolicy（索引+零分配），ref 臂 = 改造前线性判决（对照组，
# 不设阈值——其值只作 ADR-260 §4 的对照证据）。阈值 = 实测 max median × 10
# （ns 档 ×10，C6 校准同源余量）；hit/miss 各一键，词条跨 R∈{4,32,256} 三档
# 取 max（legacy 断言为 max median 语义）。
# 2026-11-08 本机 median：opt/hit 33.4~33.7ns / opt/miss 25.9~26.2ns。
spol_opt_hit = 350
spol_opt_miss = 300
# —— run --execute 批量派发（run_execute_batch bench，ADR-247/W2）——
# 经生产装配入口 with_optional_delegate 构造 ToolRuntime，64 请求同轮对照。
# 2026-11-07 本机 median（Windows timer granularity 抬高绝对值，同轮比值有效，
# ADR-252 D5 同源口径）：1ms 档串行 521.85ms / 并行 61.78ms ⇒ 有界并行 8.45×；
# 零延迟对照 49.39µs / 52.64µs（并行 +6.6% 属预期编排开销，ADR-239 D6）。
# 余量：ms 档 ×2.5、µs 档 ×8（ADR-239 分级同源）。
runx_serial_zero = 400000
runx_parallel_zero = 450000
runx_serial_1ms = 1300000000
runx_parallel_1ms = 155000000
# —— CLI 启动分段（cli_parse bench）——
# clap 解析成本（实测 131/110/104 µs）：D4 把 parse 前置到 runtime 创建之前，
# 这三档是「命令树构建 + 参数匹配」的纯 CPU 成本，锁定其不退化。
cli_parse_help = 500000
cli_parse_run = 500000
cli_parse_doctor = 500000
# 配置按需判定（D5）：判定本身 ~104µs（与 parse 同量级，说明是 clap 解析主导）。
cli_startup_config = 500000
# runtime 构建：current_thread ~4.3µs；multi_thread ~783µs（建 worker 池，
# 是 one-shot 命令启动税的主要来源之一）⇒ 两个 flavor 分别设阈。
cli_startup_runtime = 5000000
# 启动端到端（parse + 分类 + runtime 构建）：实测 ~982µs。
cli_startup_e2e = 5000000
# —— MCP server registry 查找（registry_lookup bench）——
# 最大值来自 list_alive_100（遍历 100 个存活 server，实测 10.6µs）；
# 单点 get/contains 为 ns 级，被同键兜底覆盖。
mcp_registry_lookup = 100000
# ADR-192 附带（性能门精度）：dev-only bench `hcw-window/probe_select` 升为 registered。
# 其值组目录 `score_cache_hit_vs_recompute/{cache_hit,recompute}` 的路径内嵌 `cache_hit` 子串，
# 在本地累积的 criterion 树上被 first-match-wins 误归给下方 `cache_hit` 键，使其报 100µs > 10µs 假红
# （真值 403.7ns；`all` 静态子模式不跑 thresholds，CI 侧不生成该目录故不受影响，但本地无法验收）。
# 子串语义下 `cache_hit` 无法用更长关键词区分（真路径恰是污染路径的后缀），故按门自身提示
# “fix the keyword sets instead of flipping this switch”：把污染路径抢在 `cache_hit` 之前归给本键
# （匹配循环文档序 = 判定序）。阈值 = 实测最重组 `probe_score_throughput/1000_blocks` 338.5µs 的 ~1.5× 余量
# （同轮三组：probe_window_select/256_blocks 88.1µs、score_cache_hit_vs_recompute/{recompute 96.6µs, cache_hit 0.4ns}）。
probe_select = 500000
cache_hit = 10000
tiering = 500000
gather = 100000000
produce_verify = 500000
command_validator = 50000
xts_top_k = 500000
# C6 新增注册（KPI-03/04 首次入 CI 强制门 + L1 热路径基线）:
# immune_probe 实测 907ns（宣称 708ns 同量级获实证）; bus_bench 实测 55us
# （publish fan-out）。
# rhi_judge 键已删除（2026-09-20）：其宿主 crate auto-dpo 目录已物理移除，
# 阈值指向不存在的 bench 即为虚门；原实测 7.5us 记录保留在 C6 closure 报告中。
immune_probe = 10000
bus_bench = 200000
hot_lru = 200000
# P-6 终批（分诊后实升 4 项；pdca_act/memory_graph_recall 因 criterion 目录层级与
# 斜杠组名失配、断言路径待深查，按"实测路径不确定不升格"纪律留 dev-only 待复查）：
# 召回三段（粗/细/重排）取 p95 组或最重规模 ×3-8 余量；
# osa 串行基线（串行变慢即回归信号；并行组已被 compute_masks 关键词覆盖）
coarse_recall_p95 = 8_000_000
fine_recall_top = 20_000_000
rerank_fill_top = 30_000_000
pdca_act = 20_000
memory_graph_recall = 4_000_000
osa_sequential_baseline = 1_000_000
# P-6 二批（深审 2026-09-25，perf-slo 报告 §1.2/§3 实测驱动）：
# nmc 并行 1200 单元实测 3.27ms（串行 21.2ms，并行收益 6.5×）→ x3.1 余量
nmc_parallel_encoding = 10000000
# nmc 文本编码最长输入 37.1µs → x5.4 余量；桌面编码 3.4µs 同源富余
nmc_encoding = 200000
# gsoe 三因子选择 64 候选 10.7µs → x4.7 余量（ADR-170 收录条款配套热路）
three_factor = 50000
# gsoe 形式化闸门评估 256 命题 0.2µs → x10 余量（ns 级先例 x10）
formal_gate = 2000
# ADR-192（2026-09-26）：mlc L2 分层检索 10k 档 Top-10 召回。立项时现值 4.117ms
# （已越 mlc_l2_knn 的 4ms redline），分层后目标 ≤ 2ms（≥2× 改善且退出警示带）。
# 实际门槛以静默态单跑 median 定档（见 perf-slo-2026-09-25.md §1.1 落地状态）。
hnsw_tiered = 2_000_000
sigmoid_scalar = 500
sigmoid_map = 200000
percentile_sorted = 1000
# 静默窗口重锁（2026-10-04,CPU 前置均值 6.8%）:faae_parallel_bench 由 dev-only 升格
# registered。阈值依据 = 静默 release 单跑 median（docs/reports/
# cpu-plane-closeout-2026-10-04.md §4）:faae_scoring max 组 serial_24k 19.915ms
# → ×2.5 余量 50ms;faae_hot_scoring max 组 serial_24k 12.201ms → ×2.5 余量 30ms
# （ms 级 ×2-2.5 惯例，同 C6 校准批）。
# 并发组 faae_concurrent_route（w1_k2..w8_k2，w8 静默 median 54.601ms）跨核数敏感:
# 随文件注册进 CI 运行（run_bench 文件级）,绝对阈值待 CI 首跑数据后按校准批次
# 定档（不假锁,ADR-190 反幽灵门）。
faae_scoring = 50000000
faae_hot_scoring = 30000000

[path_keywords]
exit_code_matrix = ["exit_code"]
diff_engine_bench = ["diff_incremental_5pct", "diff_full_redraw"]
wal_recovery = ["wal_append_single_fsync", "wal_recovery", "wal_read_empty", "wal_truncate_after_recovery"]
degradation_chain = ["degradation"]
render_bench = ["render_all_panels", "render_each_panel", "render_ide_three_panes"]
streaming_single_token = ["streaming_single_token"]
streaming_ttfb = ["ttfb_first_line"]
streaming_feed = ["feed_100_lines"]
dag = ["dag/"]
gea_cache = ["eviction_saturated"]
scheduler_dequeue = ["scheduler_dequeue/1000/"]
dedup = ["dedup_semantic"]
checkpoint = ["checkpoint_save"]
shadow_stats = ["shadow_stats"]
resolve_conflicts = ["resolve_conflicts"]
# ADR-246:组名 14_sections→15_sections(tool_policy 第 15 段落地,组名含计数同步改名,
# 避免 first-match 归类落空变幽灵门)
config_concurrency = ["15_sections"]
writer_ansi = ["incremental_5pct", "render_full_80x24"]
v3_pipeline = ["v3_pipeline"]
reduce_bench = ["reduce"]
session_store = ["single_write"]
cross_layer = ["cross_layer"]
hybrid_search = ["hybrid_search"]
debate = ["deliberate"]
# ADR-192 附带：本键必须排在 `cache_hit` 之前（匹配循环 first-match-wins，文档序 = 判定序，
# 与 bench_check.yml heredoc 的 dict 插入序逐字对齐）；`hit_vs_recompute` 与 `cache_hit`
# 互不为子串（I2 双向已核），故不会反过来遮蔽真 cache_hit 组。
# 【2026-10-26 R2 订正（M65）】同段上句的「与 heredoc 插入序逐字对齐」不成立：
# 实测两表共有键的相对次序已在第 35 位分叉（heredoc=hot_lru vs 本表=bus_bench）。
# 对 probe_select/cache_hit 这一对有子串关系的对键，两边序仍一致（已核），
# 故暂无实际遮蔽事故；但该声明作为不变式是假的 —— 它也是「不能直接删 heredoc
# 改读本表」的原因：插入序 = first-match-wins 判定序，静默换源会改变归类。
probe_select = ["probe_window_select/", "probe_score_throughput/", "hit_vs_recompute"]
l2_recall = ["l2_recall"]
compress = ["100k_to_32k"]
compute_masks = ["compute_all_masks"]
delegation = ["delegation_fanout"]
# ===== 工具链并行化重构（ADR-239）新增 =====
# 关键词取 criterion 值组目录名（形如 `dispatch_layers/floor_echo_transport`）。
# I2 要求任意两关键词互不为子串 ⇒ 用四个互不包含的前缀族
# （dispatch_ / dchain_ / tbatch_ / trchain_），且各关键词自身不含他人前缀。
dispatch_floor_echo = ["floor_echo_transport"]
dispatch_policy_eval = ["policy_evaluate_allow"]
dispatch_sandbox_cached = ["sandbox_check_seccore/"]
dispatch_sandbox_uncached = ["sandbox_check_seccore_legacy"]
dchain_allowall_hit = ["chain_allowall_route_hit"]
dchain_seccore_hit = ["chain_seccore_route_hit/"]
dchain_seccore_legacy = ["chain_seccore_route_hit_legacy"]
dchain_policy_deny = ["chain_policy_deny"]
dchain_sandbox_deny = ["chain_sandbox_deny"]
dchain_route_miss = ["chain_route_miss"]
trchain_allow_echo = ["tool_runtime_chain/allow_route_hit_echo"]
tbatch_serial_zero = ["serial_ms0"]
tbatch_parallel_zero = ["parallel_ms0"]
tbatch_serial_slow = ["serial_ms1/64"]
tbatch_parallel_slow = ["parallel_ms1_bound8/64"]
# ADR-252：取 criterion **叶子全路径**为关键词（而非 `readonly8_ms2` 这类组名），
# 使 `/1` 与 `/8` 两档各自唯一命中，避免宽关键词把并发档窃取进串行阈值。
# I2 已用门自身的 keyword_overlaps 核过：与全部既有键双向互不为子串，
# 重叠数维持 1 ≤ max_keyword_overlaps=1（既有唯一重叠对仍是
# diff_engine_bench × writer_ansi，非本批引入）。
tplan_declared_serial = ["toolplan_layers/readonly8_ms2/1"]
tplan_declared_parallel = ["toolplan_layers/readonly8_ms2/8"]
tplan_undeclared_serial = ["toolplan_layers/undeclared8_ms2/1"]
tplan_undeclared_parallel = ["toolplan_layers/undeclared8_ms2/8"]
# T1：混层 c8 叶子路径。WHY 用 "7r1w_ms2/8" 而非含组名的全路径：command_validator
# 的词条是 ["mixed"]，全路径 "mixed7r1w_ms2/8" 含子串 "mixed" 会触 I2 串台（工单
# 首轮 I2 声明只核 tplan_* 同族漏了该短词条，重测纠正）。"7r1w_ms2/8"（7读1写签名）
# 唯一匹配混层 c8 且不含 "mixed"，与全部既有词条双向互不为子串。
tplan_mixed_parallel = ["7r1w_ms2/8"]
