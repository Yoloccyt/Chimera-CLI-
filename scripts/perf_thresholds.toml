# Chimera CLI bench 阈值与 CI 清单单一真值源
#
# 权威消费者：scripts/check_perf_redlines.py；
# 同时被 .github/workflows/bench_check.yml 的 thresholds 步骤调用（消灭 heredoc 内嵌表）。
# 迁移来源：bench_check.yml THRESHOLDS_NS / PATH_KEYWORDS / run_bench 行（2026-08-31 机械抽取）。
#
# 不变式（由 py 核 --selftest 与常规模式共同断言）：
#   I1 set(thresholds_ns) == set(path_keywords)
#   I2 任意两个关键词互不为子串（防匹配串台，根除 F-R4-04）
#   I3 state==registered 的 (crate,bench) 与 run_bench 行双向等价
#   I4 100ms 兜底条数只减不增（棘轮，见 [ratchet]）

[thresholds_ns]
exit_code_matrix = 10000
diff_engine_bench = 100000
wal_recovery = 100000000
degradation_chain = 1000
render_bench = 16000000
streaming_single_token = 500000
streaming_ttfb = 1000000
streaming_feed = 5000000
dag = 5000000
gea_cache = 500000
scheduler_dequeue = 50000
dedup = 120000000
checkpoint = 15000000
shadow_stats = 50000000
resolve_conflicts = 200000
# ===== C6 校准（2026-09-04）=====
# 以下 18 键由本地 Windows GNU 全量实测收紧(median + 分级余量:ns 级约 x10、
# us 级约 x3-8、ms 级约 x2-2.5,与 sigmoid 33ns→500ns 先例同原则);数据与
# 推导见 docs/reports/c6-kpi-threshold-calibration-report-2026-09-04.md。
# gather 本地 median 305ms 为离群值(5 severe outliers,CI 侧 <100ms 通过)
# 数据不可信 → 保留 100ms 兜底,为 calibration_pending 唯一存活项,待 CI
# 首跑实测收紧。
config_concurrency = 3000000
writer_ansi = 200000
v3_pipeline = 5000000
reduce_bench = 2500000
session_store = 2500000
cross_layer = 100000
hybrid_search = 20000000
debate = 100000
l2_recall = 5000000
compress = 50000
compute_masks = 1500000
delegation = 40000000
# ADR-192 附带（性能门精度）：dev-only bench `hcw-window/probe_select` 升为 registered。
# 其值组目录 `score_cache_hit_vs_recompute/{cache_hit,recompute}` 的路径内嵌 `cache_hit` 子串，
# 在本地累积的 criterion 树上被 first-match-wins 误归给下方 `cache_hit` 键，使其报 100µs > 10µs 假红
# （真值 403.7ns；`all` 静态子模式不跑 thresholds，CI 侧不生成该目录故不受影响，但本地无法验收）。
# 子串语义下 `cache_hit` 无法用更长关键词区分（真路径恰是污染路径的后缀），故按门自身提示
# “fix the keyword sets instead of flipping this switch”：把污染路径抢在 `cache_hit` 之前归给本键
# （匹配循环文档序 = 判定序）。阈值 = 实测最重组 `probe_score_throughput/1000_blocks` 338.5µs 的 ~1.5× 余量
# （同轮三组：probe_window_select/256_blocks 88.1µs、score_cache_hit_vs_recompute/{recompute 96.6µs, cache_hit 0.4ns}）。
probe_select = 500000
cache_hit = 10000
tiering = 500000
gather = 100000000
produce_verify = 500000
command_validator = 50000
xts_top_k = 500000
# C6 新增注册（KPI-03/04 首次入 CI 强制门 + L1 热路径基线）:
# immune_probe 实测 907ns（宣称 708ns 同量级获实证）; bus_bench 实测 55us
# （publish fan-out）。
# rhi_judge 键已删除（2026-09-20）：其宿主 crate auto-dpo 目录已物理移除，
# 阈值指向不存在的 bench 即为虚门；原实测 7.5us 记录保留在 C6 closure 报告中。
immune_probe = 10000
bus_bench = 200000
hot_lru = 200000
# P-6 终批（分诊后实升 4 项；pdca_act/memory_graph_recall 因 criterion 目录层级与
# 斜杠组名失配、断言路径待深查，按"实测路径不确定不升格"纪律留 dev-only 待复查）：
# 召回三段（粗/细/重排）取 p95 组或最重规模 ×3-8 余量；
# osa 串行基线（串行变慢即回归信号；并行组已被 compute_masks 关键词覆盖）
coarse_recall_p95 = 8_000_000
fine_recall_top = 20_000_000
rerank_fill_top = 30_000_000
pdca_act = 20_000
memory_graph_recall = 4_000_000
osa_sequential_baseline = 1_000_000
# P-6 二批（深审 2026-09-25，perf-slo 报告 §1.2/§3 实测驱动）：
# nmc 并行 1200 单元实测 3.27ms（串行 21.2ms，并行收益 6.5×）→ x3.1 余量
nmc_parallel_encoding = 10000000
# nmc 文本编码最长输入 37.1µs → x5.4 余量；桌面编码 3.4µs 同源富余
nmc_encoding = 200000
# gsoe 三因子选择 64 候选 10.7µs → x4.7 余量（ADR-170 收录条款配套热路）
three_factor = 50000
# gsoe 形式化闸门评估 256 命题 0.2µs → x10 余量（ns 级先例 x10）
formal_gate = 2000
# ADR-192（2026-09-26）：mlc L2 分层检索 10k 档 Top-10 召回。立项时现值 4.117ms
# （已越 mlc_l2_knn 的 4ms redline），分层后目标 ≤ 2ms（≥2× 改善且退出警示带）。
# 实际门槛以静默态单跑 median 定档（见 perf-slo-2026-09-25.md §1.1 落地状态）。
hnsw_tiered = 2_000_000
sigmoid_scalar = 500
sigmoid_map = 200000
percentile_sorted = 1000

[path_keywords]
exit_code_matrix = ["exit_code"]
diff_engine_bench = ["diff_incremental_5pct", "diff_full_redraw"]
wal_recovery = ["wal_append_single_fsync", "wal_recovery", "wal_read_empty", "wal_truncate_after_recovery"]
degradation_chain = ["degradation"]
render_bench = ["render_all_panels", "render_each_panel", "render_ide_three_panes"]
streaming_single_token = ["streaming_single_token"]
streaming_ttfb = ["ttfb_first_line"]
streaming_feed = ["feed_100_lines"]
dag = ["dag/"]
gea_cache = ["eviction_saturated"]
scheduler_dequeue = ["scheduler_dequeue/1000/"]
dedup = ["dedup_semantic"]
checkpoint = ["checkpoint_save"]
shadow_stats = ["shadow_stats"]
resolve_conflicts = ["resolve_conflicts"]
config_concurrency = ["14_sections"]
writer_ansi = ["incremental_5pct", "render_full_80x24"]
v3_pipeline = ["v3_pipeline"]
reduce_bench = ["reduce"]
session_store = ["single_write"]
cross_layer = ["cross_layer"]
hybrid_search = ["hybrid_search"]
debate = ["deliberate"]
# ADR-192 附带：本键必须排在 `cache_hit` 之前（匹配循环 first-match-wins，文档序 = 判定序，
# 与 bench_check.yml heredoc 的 dict 插入序逐字对齐）；`hit_vs_recompute` 与 `cache_hit`
# 互不为子串（I2 双向已核），故不会反过来遮蔽真 cache_hit 组。
probe_select = ["probe_window_select/", "probe_score_throughput/", "hit_vs_recompute"]
l2_recall = ["l2_recall"]
compress = ["100k_to_32k"]
compute_masks = ["compute_all_masks"]
delegation = ["delegation_fanout"]
cache_hit = ["cache_hit"]
tiering = ["apply_decision", "handle_quest_created"]
gather = ["gather", "entangle_alone"]
produce_verify = ["produce_verify", "produce_only", "verify_only"]
command_validator = ["mixed"]
xts_top_k = ["xts_top_k"]
sigmoid_scalar = ["sigmoid scalar"]
sigmoid_map = ["sigmoid map"]
percentile_sorted = ["percentile_sorted"]
# C6 新增（关键词与既有 36 键交叉核验无子串冲突，满足 I2）
immune_probe = ["immune_probe"]
bus_bench = ["single_publish_latency", "concurrent_subscribe_throughput", "publish_batch_vs_serial"]
# P-6 升格（深审 2026-09-25）：cmt 热层 LRU 实测 median 45µs（hot_lru_eviction_257th_insert,
# docs/reports/perf-slo-2026-09-25.md §1.2），us 级 x4.4 余量定 200µs；与既有键无子串冲突（I2）
hot_lru = ["hot_lru"]
# P-6 终批（关键词均为实测 full_id 前缀级全链书写，与既有键无子串冲突，I2 已核）
coarse_recall_p95 = ["coarse_recall_p95_latency/p95_latency"]
fine_recall_top = ["fine_recall_10000_blocks"]
rerank_fill_top = ["rerank_fill_5000_blocks"]
# 磁盘形态修正（2026-09-26 根因查实）：criterion 3.x 将 bench_function("a/b")
# 形式的斜杠组名在磁盘目录转义为下划线单层目录（memory_graph_recall_2k_depth2/），
# 关键词必须按磁盘实形书写；非两级 benchmark_group API 的 nmc 真子目录形态不同
pdca_act = ["pdca_act_stressed", "pdca_act_with_feedback_8_experts"]
memory_graph_recall = ["memory_graph_recall_2k_depth2"]
osa_sequential_baseline = ["sequential_compute_5_masks"]
# P-6 二批：关键词取各 bench 实测最重组，与既有键无子串冲突（I2 已交叉核）
nmc_parallel_encoding = ["nmc_parallel_encoding/parallel_1200"]
nmc_encoding = ["text_encoding/long_10kb"]
three_factor = ["three_factor_select_64_candidates"]
formal_gate = ["formal_gate/evaluate/256"]
# ADR-192：关键词按 benchmark_group + BenchmarkId 的真两级磁盘形态书写
# （同 l2_knn_slo 先例；与既有键无子串冲突，I2 已核：含 "top10_recall" 而非 "l2_recall"）
hnsw_tiered = ["l2_knn_tiered/top10_recall/10000_tiered"]

# calibration_pending：当前值取保守 100ms 兜底、待 CI 首跑实测收紧的键。
# 项目约束（ADR-159 决策 3）：此列表只减不增；wal_recovery 的 100ms 是真实规格，列在列表外。
# C6（2026-09-04）：17 项已完成校准收紧仅余 gather（本地离群不可信，见上注）；
# 棘轮 cap 同步 18 → 1。
[ratchet]
calibration_pending = ["gather"]
max_calibration_pending = 1
# max_keyword_overlaps：关键词集互为子串的重叠键对数上限（迁移日实测冻结）。
# WHY 不为 0：diff_engine_bench 的 diff_incremental_5pct 包着 writer_ansi 的
# incremental_5pct（实测唯一重叠对，见 closure 报告）；收紧它是独立动作，
# 不能跟在本迁移 PR 里（那会让「行为不变」无法证明）。只禁止它增长。
max_keyword_overlaps = 1

