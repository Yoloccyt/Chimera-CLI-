# 逐 crate 行覆盖率下界（消费者：scripts/coverage_gate.py --check / --validate-config）
#
# 归因：tarpaulin JSON 的 filename/full_path 前缀 `crates/<name>/` → 该 crate
#       （路径前缀法，不依赖 tarpaulin 包级字段，跨版本稳）。
# 语义：
#   [defaults].floor  —— 未在下方 [[crate]] 显式列出的 workspace 成员的下界。
#   [[crate]]         —— 关键 crate 显式抬高下界（tier=critical 的退化在 step summary 单列）。
#   exempt            —— 不参与"零记录必红(V2)"判定的成员（如纯聚合/无 src 的包）。
# 棘轮纪律：floor **只升不降**（下调须 ADR，同 ADR-160 freeze 只收缩语义）。
#
# 校准状态：本文件为首版；coverage nightly 首次真实测量后，须把 defaults.floor 与
#   各 [[crate]].floor 抬到"实测 - 3~5pp"附近（登记 RK-P45），禁止长期停在兜底值 45。

[defaults]
floor = 45
exempt = []

