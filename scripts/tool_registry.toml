# tool_registry.toml -- lifecycle register for scripts that are NOT gates.
#
# WHY: gate_manifest.toml answers "what blocks CI"; the exemptions file answers
# "why this self-testing script is not a gate". Neither answers "what is this
# script, who owns it, and is it still supposed to exist". Direction C of
# check_gates_provenance.py requires every scripts/**/{py,sh,ps1} to be
# accounted for by exactly one of: gate_manifest.toml, the exemptions file, or
# a row below. unaccounted=0 is therefore a measured fact, not a claim.
#
# status semantics (ADR-228 §5):
#   active     -- on a scheduling path today (manifest task, govd package, CI helper)
#   diagnostic -- manual entry point, run on demand, must never block
#   evidence   -- one-off census/audit artefact, kept as evidence only
#   retired    -- dead; kept so history stays traceable, never executed
#
# Every row needs owner + evidence. A row without either is a schema error
# (govd.manifest.validate_registry), not a silent pass.

