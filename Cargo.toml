# 根 package:承载 workspace 根目录下的 E2E 集成测试(tests/e2e/*)。
# WHY 必须显式声明 [package]:virtual manifest(只有 [workspace])不支持
# [[test]] 与 [dev-dependencies];将根目录变为 package manifest 后,
# Cargo 才能识别 tests/e2e/ 子目录下的 test target。
# publish = false 防止误发布;根 package 无 lib/bin target,仅承载测试。
[package]
name = "chimera-e2e-tests"
version.workspace = true
edition.workspace = true
publish = false
description = "Chimera CLI NEXUS-OMEGA E2E integration tests (workspace root)"

# MCA 双轨隔离 feature(ADR-065 决策 6)
# WHY 根 package 声明 mca:① 使 `cargo test --workspace --features mca` 在 CI 旁路
# job 中合法(至少一个成员定义该 feature);② 门控根 package 承载的 MCA E2E
# 测试(如 mca_m0_dual_channel)。下游 crate(chimera-cli/chimera-tui)后续里程碑
# 各自声明同名 feature,同一条命令行双轨验证全部门控面。默认 off,主干恒绿。
[features]
mca = []

[workspace]
members = [
    # L0 Contracts (ADR-033): 纯类型零依赖契约层，必须最先编译
    "crates/nexus-contracts",
    "crates/nexus-core", "crates/event-bus", "crates/quest-engine",
    "crates/repo-wiki", "crates/model-router", "crates/parliament",
    "crates/pvl-layer", "crates/osa-coordinator", "crates/kvbsr-router",
    "crates/faae-router", "crates/gea-activator", "crates/gqep-executor",
    "crates/sesa-router", "crates/ssra-fusion", "crates/csn-substitutor",
    "crates/mtpe-executor", "crates/mlc-engine", "crates/hcw-window",
    "crates/cmt-tiering", "crates/scc-cache", "crates/lsct-tiering",
    "crates/seccore", "crates/decay-engine", "crates/qeep-protocol",
    "crates/decb-governor", "crates/acb-governor", "crates/efficiency-monitor",
    "crates/gsoe-evolution", "crates/auto-dpo", "crates/mcp-mesh",
    "crates/nmc-encoder", "crates/chtc-bridge", "crates/chimera-tui",
    "crates/chimera-cli", "crates/chimera-mas",
    # L6 Router: omega-learner Bandit 六接缝(P4-W13.1,workspace 第 37 个 crate)
    # WHY 排在最后: 学习层为环外新增,通过异步下发 SelectorPolicy::Learned 给调用方,
    # 不参与现有 crate 依赖环;依赖方向 L6 → L0(nexus-contracts)/L1(event-bus) 合规
    "crates/omega-learner",
    # L10 Interface: mca-gateway 多通道亲和网关(ADR-065,workspace 第 38 个 crate)
    # WHY 排在末位: MCA 体系新增,仅依赖 L0(nexus-contracts)/L1(event-bus),
    # 与 chtc-bridge 同构;流式数据面走 bounded mpsc 不进 event-bus(ADR-065 决策 4)
    "crates/mca-gateway",
]
resolver = "2"

[workspace.package]
# v2.22.0-omega: MCA token efficiency deep optimization (coalescing + token_estimate + event fields)
version = "2.22.0-omega"
edition = "2021"
authors = ["Aether CLI Team <team@aether.dev>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_yaml:TuiConfig 持久化(Task 15),YAML 格式读写配置文件
serde_yaml = "0.9"
anyhow = "1.0"
tracing = "0.1"
# tracing-subscriber:日志订阅器,用于格式化输出 tracing 事件
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env", "cargo"] }
# Figment:多源配置合并(默认 > File > Env > CLI),支持 Yaml/Toml/Json
figment = { version = "0.10", features = ["yaml", "toml", "env"] }
ratatui = "0.29"
# crossterm:跨平台终端 IO(Chimera TUI 的事件循环与屏幕控制)
# WHY 添加到 workspace:chimera-tui(L10)需要终端 IO,ratatui 默认依赖 crossterm,
# 统一在 workspace 声明版本避免 crate 间版本冲突
crossterm = "0.28"
# wasmtime 已下沉到 seccore/Cargo.toml 直接声明(ADR-035 决策 3):
# seccore 是唯一使用 wasmtime 的 crate,且通过 `wasm-sandbox` feature gate 隔离,
# 在 workspace 级声明会导致孤儿依赖(seccore 用 `version = "22.0"` 而非 `workspace = true`)。
# 保持 wasmtime 版本单一源(seccore/Cargo.toml),避免 workspace 级误导。
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
ndarray = { version = "0.16", features = ["serde"] }
# tract: 纯 Rust ONNX 推理引擎，无 C 依赖，跨平台兼容
# WHY 添加到 workspace: nmc-encoder 需 ONNX Runtime 执行图像/视频/音频语义嵌入推理，
# ort 仅支持 MSVC 工具链，tract 为纯 Rust 实现，与 forbid(unsafe_code) 哲学一致
tract-onnx = "0.21"
# image: 图像解码库，支持 PNG/JPEG/WebP 格式解码与缩放
# WHY 添加到 workspace: nmc-encoder 的图像预处理需将原始字节解码为 RGB 像素矩阵，
# 统一在 workspace 声明版本避免与其他 crate 冲突
image = "0.25"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
axum = "0.7"
prometheus-client = "0.22"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
once_cell = "1.20"
dashmap = "6.1"
# arc-swap:RCU(Read-Copy-Update)原语,P2-W7.2.3 内环最终一致 + 单调读
# WHY 添加到 workspace:event-bus 因果一致性三层(L251-255)第二层需要 RCU 保护内环共享状态;
# 读性能 ~5ns,写性能 ~50ns(§9.1),纯 safe 封装,符合 forbid(unsafe_code) 哲学(unsafe 在依赖内不传播)
arc-swap = "1.7"
# hnsw_rs:HNSW 近似最近邻搜索(P2-W8.1 HnswStore 生产路径)
# WHY 添加到 workspace:repo-wiki VectorStore trait 的生产实现,10K-100K entry 规模;
# 纯 Rust 实现(依赖 anndists 距离计算库),无系统库依赖,符合 forbid(unsafe_code) 哲学(unsafe 在依赖内不传播)
hnsw_rs = "0.3.4"
criterion = { version = "0.5", features = ["html_reports"] }
# 库层错误类型标准(§4.1:库层用自定义 thiserror enum)
thiserror = "1.0"
# ADR-004:消息序列化协议为 MessagePack
rmp-serde = "1.3"
# tempfile:测试用临时文件/目录,跨平台安全
tempfile = "3.10"
# proptest:属性测试框架,用于不变量验证(SubTask 15.12)
proptest = { version = "1.5", features = ["alloc"] }
# rand:伪随机数生成(EDSB 概率均衡 / 测试固定种子场景)
# WHY 添加到 workspace:faae-router 的 EDSB 概率均衡需 rand 替代 SystemTime 纳秒
# (Task 11),统一在 workspace 声明版本避免 crate 间版本冲突
rand = "0.8"
# tracing-test:测试中捕获 tracing 日志,用于验证 warn/error 日志输出(SubTask 17.2)
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
# toml:TOML 格式反序列化(P4-W15.1.2 HarnessSpec spec 加载器)
# WHY 添加到 workspace:gsoe-evolution 的 SpecLoader 需解析 TOML 格式 HarnessSpec 文件
# (设计文档 §7.2 完整 DSL 以 TOML 形式存储),统一版本避免 crate 间冲突
toml = "0.8"
# 本地 workspace crate:供成员通过 `workspace = true` 统一引用,
# 版本号由 workspace.package 集中管理。
# 按 L0→L1→...→L10 顺序排列,确保编译顺序符合依赖铁律。
# L0 Contracts (ADR-033):纯类型零依赖契约层,所有上层 crate 可依赖 L0
nexus-contracts = { path = "crates/nexus-contracts" }
# L1 Core:核心运行时,事件总线,模型路由
nexus-core = { path = "crates/nexus-core" }
event-bus = { path = "crates/event-bus" }
mcp-mesh = { path = "crates/mcp-mesh" }
model-router = { path = "crates/model-router" }
# L2 Memory:多模态编码,分层窗口,四级记忆
nmc-encoder = { path = "crates/nmc-encoder" }
hcw-window = { path = "crates/hcw-window" }
mlc-engine = { path = "crates/mlc-engine" }
# L3 Storage:推测缓存,任务感知分层,能力内存分层
scc-cache = { path = "crates/scc-cache" }
lsct-tiering = { path = "crates/lsct-tiering" }
cmt-tiering = { path = "crates/cmt-tiering" }
# L4 Security:零信任沙箱,量子纠缠协议,能力衰减
seccore = { path = "crates/seccore" }
qeep-protocol = { path = "crates/qeep-protocol" }
decay-engine = { path = "crates/decay-engine" }
# L5 Knowledge:仓库知识库,在线进化,自动DPO
repo-wiki = { path = "crates/repo-wiki" }
gsoe-evolution = { path = "crates/gsoe-evolution" }
auto-dpo = { path = "crates/auto-dpo" }
# L6 Router:全维稀疏协调器,KV块路由,函数即专家,门控激活,子专家稀疏激活,黏液适配,学习器
osa-coordinator = { path = "crates/osa-coordinator" }
kvbsr-router = { path = "crates/kvbsr-router" }
faae-router = { path = "crates/faae-router" }
gea-activator = { path = "crates/gea-activator" }
sesa-router = { path = "crates/sesa-router" }
ssra-fusion = { path = "crates/ssra-fusion" }
omega-learner = { path = "crates/omega-learner" }
# L7 Execution:生产验证层,聚集执行,多步预测,降级替代
pvl-layer = { path = "crates/pvl-layer" }
gqep-executor = { path = "crates/gqep-executor" }
mtpe-executor = { path = "crates/mtpe-executor" }
csn-substitutor = { path = "crates/csn-substitutor" }
# L8 Parliament:议会系统,自适应预算,双档预算
parliament = { path = "crates/parliament" }
acb-governor = { path = "crates/acb-governor" }
decb-governor = { path = "crates/decb-governor" }
# L9 Quest:任务引擎,效率监控,多Agent协同
quest-engine = { path = "crates/quest-engine" }
efficiency-monitor = { path = "crates/efficiency-monitor" }
chimera-mas = { path = "crates/chimera-mas" }
# L10 Interface:CLI入口,TUI,跨平台桥接,多通道亲和网关
chimera-cli = { path = "crates/chimera-cli" }
chimera-tui = { path = "crates/chimera-tui" }
chtc-bridge = { path = "crates/chtc-bridge" }
mca-gateway = { path = "crates/mca-gateway" }

# === v2.9.0-omega Task 1.12: CLI 输出增强依赖 ===
# nu-ansi-term:轻量 ANSI 颜色渲染库,用于 output.rs 的 print_success/error/warning/info
# WHY 添加到 workspace:chimera-cli 的统一输出 helper 需要颜色支持,统一版本避免冲突
nu-ansi-term = "0.50"
# indicatif:进度条/spinner 库,长任务时显示进度反馈
# WHY 添加到 workspace:chimera-cli 的 print_progress helper 需要进度指示能力
indicatif = "0.17"
# comfy-table:终端表格渲染库,quest list / mcp list / agent list 等命令使用
# WHY 添加到 workspace:chimera-cli 的 print_table helper 需要表格渲染,纯 Rust 无 unsafe
comfy-table = "7.1"
# clap_complete:shell 补全脚本生成库(Task 1.14 chimera completions 命令)
# WHY 添加到 workspace:chimera-cli 的 completions 命令需要生成 bash/zsh/fish/powershell/elvish 补全脚本,
# 与 clap 4.5 版本兼容,统一在 workspace 声明避免版本冲突
clap_complete = "4.5"
# human-panic:友好的 panic 报告库(Task 2.3 panic hook)
# WHY 添加到 workspace:chimera-cli 的 main.rs 需要在 release 模式输出用户友好的 panic 提示
# (含"请将以下信息提交给开发者"提示 + 简化 backtrace),debug 模式退化为默认 handler 便于开发
# 纯 safe Rust 实现,与 #![forbid(unsafe_code)] 哲学兼容
# WHY 2.0 而非 1.2:2.0 支持 setup_panic!() 无参数调用,API 更简洁;1.2 需 metadata 参数
human-panic = "2.0"
# futures:异步编程核心库,用于 Future/Stream/Sink 等抽象
# WHY 统一到 workspace:4 个 crate(chimera-mas/gqep-executor/mcp-mesh/parliament)使用,
# 统一版本避免版本碎片化
futures = "0.3"
# async-trait:为 trait 方法提供 async fn 支持
# WHY 统一到 workspace:chimera-mas 使用,统一版本管理
async-trait = "0.1"
# regex:正则表达式库
# WHY 统一到 workspace:chimera-mas 使用,统一版本管理
regex = "1"
# tokio-test:tokio 测试工具库
# WHY 统一到 workspace:gqep-executor/pvl-layer 的 dev-dependencies 使用,统一版本管理
tokio-test = "0.4"
# sysinfo:系统信息库(CPU/内存/进程等)
# WHY 统一到 workspace:chimera-tui 使用,保持 0.32 版本不变(API 兼容性)
sysinfo = "0.32"

